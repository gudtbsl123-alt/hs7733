/* 각진 단색 판 단추: 두꺼운 테 + 단단한 아래 그림자 */
.btn{font-family:DH,sans-serif;font-size:28px;color:var(--cream);background:var(--plum);border:4px solid var(--ink);padding:10px 22px;cursor:pointer;
  clip-path:polygon(12px 0,calc(100% - 12px) 0,100% 12px,100% calc(100% - 12px),calc(100% - 12px) 100%,12px 100%,0 calc(100% - 12px),0 12px);
  box-sizing:border-box;filter:drop-shadow(0 6px 0 var(--ink));transition:transform .08s}
.btn:active{transform:translateY(4px);filter:drop-shadow(0 2px 0 var(--ink))}
.btn.yel{background:var(--yel);color:var(--ink)} .btn.org{background:var(--org)} .btn.vio{background:var(--vio)} .btn.grn{background:var(--grn)}
@media (hover:hover){.btn:hover{transform:translateY(-2px)}}
.ico{width:60px;height:60px;padding:0;display:flex;align-items:center;justify-content:center}
#bPause{right:92px;top:18px}#bSound{right:22px;top:18px}#bGear{right:162px;top:18px}
#nick{left:62px;top:530px;width:390px;height:52px;border:0;outline:0;background:transparent;color:var(--cream);font-family:DH,sans-serif;font-size:32px;padding:0 4px;user-select:text;-webkit-user-select:text}
#nick::placeholder{color:#8f7aa0}
#menu{left:500px;top:470px;width:760px;height:230px;display:flex;flex-wrap:wrap;gap:18px 18px;align-content:flex-start}
#menu .btn{height:96px;font-size:30px}
#bSolo{width:300px}#bTeam{width:210px}#bBot{width:210px;font-size:24px!important;line-height:1.1}
.panel{position:absolute;background:var(--plum);border:5px solid var(--ink);color:var(--cream);box-sizing:border-box;
  clip-path:polygon(18px 0,calc(100% - 18px) 0,100% 18px,100% calc(100% - 18px),calc(100% - 18px) 100%,18px 100%,0 calc(100% - 18px),0 18px)}
.panel h2{font-family:BHS,sans-serif;font-weight:400;color:var(--yel);font-size:44px;margin:0 0 10px;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill}
.cover{position:absolute;inset:0;background:rgba(26,18,34,.55);pointer-events:auto}
#howto{left:250px;top:120px;width:780px;padding:28px 36px}
#howto ol{margin:0 0 18px;padding-left:34px;font-size:28px;line-height:1.55}
#howto li b{color:var(--yel);font-weight:400}
#pauseBox{left:440px;top:230px;width:400px;padding:28px;text-align:center}
#gearBox{left:430px;top:170px;width:420px;padding:26px}
#gearBox label{display:flex;align-items:center;gap:14px;font-size:27px;margin:10px 0;cursor:pointer}
.tick{width:40px;height:40px;background:var(--ink);border:3px solid var(--yel);display:inline-flex;align-items:center;justify-content:center;clip-path:polygon(8px 0,calc(100% - 8px) 0,100% 8px,100% calc(100% - 8px),calc(100% - 8px) 100%,8px 100%,0 calc(100% - 8px),0 8px)}
.tick i{width:22px;height:22px;background:var(--yel);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);display:none}
.tick.on i{display:block}
#result{left:850px;top:610px;width:414px;height:94px;padding:0;overflow:visible;background:none;border:0;clip-path:none}
#result h2,#endingTxt,#rows{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
#result .row{display:flex;justify-content:space-between;font-size:27px;padding:7px 0;border-bottom:3px solid var(--dim)}
#result .row b{font-family:BHS,sans-serif;font-weight:400;color:var(--yel);font-size:32px}
#endingTxt{font-size:25px;color:#f0e2f8;margin:6px 0 10px;line-height:1.4}
#result .btns{position:absolute;left:0;right:0;bottom:6px;display:flex;gap:16px}
#result .btns .btn{flex:1;font-size:26px;height:72px}
#notes{left:150px;top:70px;width:980px;height:600px;padding:24px 30px}
#noteList{height:440px;overflow-y:auto;padding-right:8px;-webkit-overflow-scrolling:touch}
.note{background:#3a2848;border-left:8px solid var(--org);padding:12px 16px;margin:0 0 12px;font-size:26px;line-height:1.45}
.note .q{color:var(--cream)} .note .m{color:#ffb3a0} .note .a{color:#bff0c0} .note .e{color:#e0d0ec;font-size:25px}
#notes .btn{position:absolute;right:30px;bottom:22px;width:200px;height:68px}
#rotate{position:fixed;inset:0;background:#2a1f33;color:var(--cream);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;font-family:DH,sans-serif;font-size:26px;text-align:center;z-index:9;pointer-events:auto}
#rotate svg{width:120px;height:120px}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="gl"></canvas><canvas id="hud"></canvas>
  <input id="nick" class="ui hide" maxlength="8" placeholder="이름을 써요" autocomplete="off" spellcheck="false">
  <div id="menu" class="ui hide">
    <button id="bSolo" class="btn yel">혼자 개척하기</button>
    <button id="bTeam" class="btn org">두 팀 대항</button>
    <button id="bBot" class="btn vio">두 팀 대항<br>보라는 컴퓨터</button>
  </div>
  <button id="bGear" class="ui btn ico" aria-label="설정"><svg width="34" height="34" viewBox="0 0 34 34"><polygon points="17,2 21,7 28,6 27,13 32,17 27,21 28,28 21,27 17,32 13,27 6,28 7,21 2,17 7,13 6,6 13,7" fill="#fff6e6" stroke="#2a1f33" stroke-width="2"/><polygon points="17,11 22,14 22,20 17,23 12,20 12,14" fill="#4a3358"/></svg></button>
  <button id="bPause" class="ui btn ico" aria-label="멈춤"><svg width="30" height="30" viewBox="0 0 30 30"><polygon points="5,3 12,3 12,27 5,27" fill="#fff6e6"/><polygon points="18,3 25,3 25,27 18,27" fill="#fff6e6"/></svg></button>
  <button id="bSound" class="ui btn ico" aria-label="소리"><svg width="36" height="32" viewBox="0 0 36 32"><polygon points="2,11 10,11 19,3 19,29 10,21 2,21" fill="#fff6e6"/><g id="waves" fill="none" stroke="#fff6e6" stroke-width="3.5"><polyline points="24,10 27,16 24,22"/><polyline points="29,5 34,16 29,27"/></g><g id="xmark" class="hide" stroke="#ffb3a0" stroke-width="4"><line x1="24" y1="10" x2="34" y2="22"/><line x1="34" y1="10" x2="24" y2="22"/></g></svg></button>
  <div id="howtoWrap" class="hide"><div class="cover"></div><div id="howto" class="panel"><h2>개척 규칙</h2><ol>
    <li>주민의 부탁을 <b>아래 왼쪽 대화창</b>에서 읽어요.</li>
    <li>뗏목의 시설은 <b>끌어서 알맞은 땅</b>(산, 평야, 바닷가)에 놓아요.</li>
    <li>글자 상자는 <b>눌러서 주민에게 보내고</b>, 짐 상자는 <b>창고</b>로 옮겨요.</li>
    <li>틀리면 힌트를 듣고 다시 해요. 3번 연속 한 번에 맞히면 <b>개척선 보너스</b>!</li></ol>
    <button id="bPractice" class="btn yel" style="width:100%;height:76px">연습 섬에서 해 보기</button></div></div>
  <div id="pauseWrap" class="hide"><div class="cover"></div><div id="pauseBox" class="panel"><h2>잠깐 멈춤</h2><button id="bResume" class="btn yel" style="width:100%;height:76px">계속하기</button></div></div>
  <div id="gearWrap" class="hide"><div class="cover"></div><div id="gearBox" class="panel"><h2>설정</h2>
    <label id="optLow"><span class="tick"><i></i></span>저사양 모드(가볍게)</label>
    <label id="optHow"><span class="tick"><i></i></span>시작할 때 규칙 다시 보기</label>
    <button id="bGearOk" class="btn yel" style="width:100%;height:70px;margin-top:12px">닫기</button></div></div>
  <div id="result" class="panel ui hide"><h2 id="endTitle">개척 끝!</h2><div id="endingTxt"></div><div id="rows"></div>
    <div class="btns"><button id="bNotes" class="btn org">오답 노트</button><button id="bAgain" class="btn yel">다시 개척</button></div></div>
  <div id="notesWrap" class="hide"><div class="cover"></div><div id="notes" class="panel"><h2>오답 노트</h2><div id="noteList"></div><button id="bNotesOk" class="btn yel">닫기</button></div></div>
</div></div>
<div id="rotate" class="hide"><svg viewBox="0 0 120 120"><polygon points="38,10 82,10 88,16 88,104 82,110 38,110 32,104 32,16" fill="#4a3358" stroke="#fff6e6" stroke-width="5"/><polygon points="96,40 112,56 96,72" fill="#ffd34a"/></svg>
  <div>휴대폰이나 태블릿을 가로로 돌려 주세요.</div><button id="bRotOk" class="btn yel">이대로 할래요</button></div>

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   세 땅 개척 섬 — 4학년 2학기 사회 3. 다양한 환경과 삶의 모습  

   스타일 카드 — 세 땅 개척 섬
   세계:        바다 위 빈 섬 하나(산·평야·바닷가 + 뒤에 갯벌 작은 섬). 주민 부탁에 맞는 시설을
                알맞은 땅에 놓으면 섬이 마을 → 도시로 자란다(자연환경이 인문환경을 정한다).
   계열·스타일:  B 블록·다각형 · B3 로우폴리 섬
   6축:         모양 각지고 기하학 / 렌더링 B3(면마다 한 색, 꼭짓점 흔들기, 외곽선 없음)
                / 팔레트 노을 따뜻한 색(살구 하늘·청록 바다·올리브 풀, 강조 노랑, 팀색 주황·보라)
                / 빛 왼쪽 낮은 노을 옆빛 + 긴 그림자 / 시점 3/4 위 디오라마(숨쉬는 궤도 카메라)
                / UI 재질 각진 단색 판(8각으로 깎은 모서리, 어두운 자두색 판 + 진한 테 + 단단한 아래 그림자, 크림 글자)
   최근 3개와 다른 축: 햇살골 6/6 · 따끈 설계소 5/6(모양 각짐 같음) · 코스터 v4 4/6(모양·빛 비슷)
   같은 과목 최근 3개 계열: G·P·I(햇살골·골목 민원·고려 활자) → 이번 계열 B(겹침 없음)
   과목 조건: 지형 높낮이와 위치 관계가 위에서 읽힘 → 산·평야·바닷가가 높이·색·물가로 바로 구분
   탐험 칸 여부: 아니오(저장소 첫 로우폴리 섬이라 스타일은 처음)

   아트 바이블
   1. 장르·시점·카메라: 섬 개척 건설 퍼즐 · 3/4 위 디오라마 · 섬 둘레로 아주 천천히 숨쉬는 궤도(±3°)
   2. 렌더링·기준작:    B3 로우폴리 섬 · Thronefall의 각진 면·긴 노을 그림자·단순 실루엣
   3. 빛:              화면 왼쪽 낮은 노을 해(#ffc890) 하나 + 하늘빛 반구광. 그늘은 남보라(#5a4a7a)
   4. 외곽선:          없음. 앞뒤는 밝기·채도로 나눈다(조작 조각은 채도 최고 + 노랑 빛 고리)
   5. 음영:            면 방향이 곧 명암(flatShading) 3단 이상 + 그림자 지도, 공중 조각은 작은 그림자 원
   6. 팔레트:          하늘 살구 #f6c08e · 바다 청록→남색 #38a8c8→#2a3c80 · 풀 올리브 #9cae52 · 모래 #ead2a0 · 눈 #f2ece4
                       강조 노랑 #ffd34a · 주민색 주황 #f0803c / 보라 #7a5bc4 / 하늘 #3f9fd8 / 다홍 #d9573f
   7. 질감·디테일:      면 색 흔들기(같은 땅도 2색), 큰 것(산·숲) / 중간(집·시설·배) / 작은 것(바위·소·파라솔)

function rng(seed) { let s = (seed * 2654435761) >>> 0 || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }

    if (!seen.has(id)) seen.set(id, [(rr() - 0.5) * amp, (rr() - 0.5) * amp, (rr() - 0.5) * amp]);
    const d = seen.get(id); p.setXYZ(k, p.getX(k) + d[0], p.getY(k) + d[1], p.getZ(k) + d[2]);

/* ───────── 섬 땅: 높이 함수 ───────── */
const MT = { x: -11, z: -7 };      // 산 꼭대기
function mountainK(x, z) { return Math.max(0, 1 - Math.hypot((x - MT.x) / 7.5, (z - MT.z) / 6.2)); }
const ST0 = { x: -10.5, z: -3.5 }, ST1 = { x: -4.1, z: -2.9 };
function streamD(x, z) { const dx = ST1.x - ST0.x, dz = ST1.z - ST0.z; const k = Math.max(0, Math.min(1, ((x - ST0.x) * dx + (z - ST0.z) * dz) / (dx * dx + dz * dz))); return Math.hypot(x - ST0.x - dx * k, z - ST0.z - dz * k); }
const DAM = { x: ST0.x + (ST1.x - ST0.x) * 0.3, z: ST0.z + (ST1.z - ST0.z) * 0.3, ry: Math.PI / 2 - Math.atan2(ST1.z - ST0.z, ST1.x - ST0.x) };
function height(x, z) {
  const d = Math.hypot(x / 19, z / 13.5); let y = d < 1 ? 1.2 : 1.2 - (d - 1) * 14;
  const m = mountainK(x, z); y += m * m * 12;
  if (x > 7) y -= (x - 7) * 0.06;
  // 강: 산에서 바다(남쪽)로 흐르는 얕은 골
  const rx = -3.2 + Math.sin(z * 0.35) * 1.2; const rd = Math.abs(x - rx);
  if (z > -4 && rd < 0.9 && y > 0.3) y -= (0.9 - rd) * 0.9;
  // 산골짜기 시내: 산에서 내려와 강과 만난다(댐은 이 물줄기를 가로막는다)
  const sd = streamD(x, z); if (sd < 0.8 && y > 0.3) y -= (0.8 - sd) * 0.8;
  return y;
}
function zoneAt(x, z) {
  const y = height(x, z);
  if (y < 0.18) return '바다';
  if (mountainK(x, z) > 0.18 || y > 2.6) return '산';
  if (x > 9.2 || Math.hypot(x / 19, z / 13.5) > 0.93) return '바닷가';
  return '평야';
}

    else if (zoneAt(x, z) === '바닷가') c.set(R() < 0.5 ? '#f2dcaa' : '#ecd4a0');
    else c.set(R() < 0.5 ? C.grass : C.grass2);
    for (let k = 0; k < 3; k++) col.push(c.r, c.g, c.b);
  }

  { const sp = sg.attributes.position, col = [], c = new THREE.Color();
    for (let i = 0; i < sp.count; i += 3) { const x = (sp.getX(i) + sp.getX(i + 1) + sp.getX(i + 2)) / 3, z = (sp.getZ(i) + sp.getZ(i + 1) + sp.getZ(i + 2)) / 3;
      const d = Math.hypot(x / 21, z / 15.5); const k = Math.min(1, Math.max(0, (d - 1) / 2.2));
      c.set('#38a8c8').lerp(new THREE.Color('#3a54a0'), k);

      for (let k2 = 0; k2 < 3; k2++) col.push(c.r, c.g, c.b); }
    sg.setAttribute('color', new THREE.Float32BufferAttribute(col, 3)); }
  sea = new THREE.Mesh(sg, new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true, transparent: true, opacity: 0.95 }));

}

function tree(x, z, s, rr = R) {

  if (islet.now.visible) { const [ix, iy] = map2(ISLET.x, 0, ISLET.z); g.fillStyle = '#5a5260'; g.fillRect(ix - 80, iy - 8, 160, 16); txt(g, '공항', ix, iy - 26, { size: 20, align: 'center', fill: C.ink }); }
  else { const [ix, iy] = map2(ISLET.x, 0, ISLET.z); txt(g, '갯벌 섬', ix, iy, { size: 20, align: 'center', fill: C.ink }); }
  if (islet.bridge.visible) { const [a, b] = map2(19.5, 0, -4.4), [c2, d] = map2(24, 0, -4.4); g.fillStyle = C.red; g.fillRect(a, b - 5, c2 - a, 10); }
  DOCKS.forEach((d) => { if (d.g.visible) box(d.x, d.z, '#f1e6d4', 56, 40); });
  if (reqFolk && reqFolk.g.visible) { const [a, b] = map2(REQ.x, 0, REQ.z); g.fillStyle = C.ink; g.beginPath(); g.arc(a, b, 17, 0, TAU); g.fill(); g.fillStyle = FOLK[G.item ? G.item.f : '미나'].col; g.beginPath(); g.arc(a, b, 13, 0, TAU); g.fill(); g.fillStyle = C.yel; g.beginPath(); g.moveTo(a, b - 44); g.lineTo(a + 9, b - 32); g.lineTo(a, b - 20); g.lineTo(a - 9, b - 32); g.fill(); }
  // 보기(뗏목 조각·상자)
  offers.forEach((o, i) => { if (!o.obj.visible) return; const [a, b] = offerXY(o); g.fillStyle = C.ink; oct(g, a - 40, b - 34, 80, 68, 10); g.fill(); g.fillStyle = o.kind === 'piece' ? (ICON2[o.label] || C.yel) : '#d39a4e'; oct(g, a - 35, b - 29, 70, 58, 8); g.fill(); });
  if (G.drag && G.drag.moved) { g.fillStyle = C.yel; oct(g, G.drag.px - 34, G.drag.py - 30, 68, 60, 8); g.fill(); g.strokeStyle = C.ink; g.lineWidth = 4; g.stroke(); }
  if (G.scene === 'map' || G.scene === 'title') for (let i = 0; i < 5; i++) { if (i <= G.unlocked || G.scene === 'title') continue; const [a, b] = map2(STAKES[i][0], 0, STAKES[i][1]); g.fillStyle = 'rgba(255,244,236,.92)'; g.beginPath(); g.arc(a, b - 10, 42, 0, TAU); g.arc(a + 34, b, 32, 0, TAU); g.arc(a - 34, b, 30, 0, TAU); g.fill(); }
  if (scale.g.visible) { const [a, b] = [380, 330]; g.fillStyle = C.plum; g.fillRect(a - 12, b - 120, 24, 200); g.save(); g.translate(a, b - 120); g.rotate(scale.tilt); g.fillStyle = '#a8703a'; g.fillRect(-240, -8, 480, 16);
    scale.pans.forEach((p) => { g.fillStyle = p.sx < 0 ? C.org : C.grn; g.fillRect(p.sx * 220 - 70, 60, 140, 20); for (let k = 0; k < p.n; k++) { g.fillStyle = p.sx < 0 ? '#ffc890' : '#bff0c0'; g.fillRect(p.sx * 220 - 64 + (k % 6) * 22, 40 - Math.floor(k / 6) * 20, 18, 18); } }); g.restore(); }
}

/* ══════════════ 매 순간 ══════════════ */
let last = 0, slowT = 0, slowN = 0;
function stepWorld(dt, t) {
  spinBoost = Math.max(0, spinBoost - dt); for (const s of spinners) s.rotation.z -= dt * (2.4 + spinBoost * 3);
  for (const c of clouds) { c.position.x += dt * (c.userData.front ? 0.5 : 0.9); if (c.position.x > 80) c.position.x = -80; if (c.userData.front && c.position.x > -10) c.position.x = -34; }
  for (const b of gulls) { const a = t * b.sp + b.ph; b.g.position.set(b.cx + Math.cos(a) * b.r, b.h + Math.sin(a * 2) * 0.4, b.cz + Math.sin(a) * b.r * 0.6); b.g.rotation.y = -a; const f = Math.sin(t * 9 + b.ph) * 0.5; b.wl.rotation.z = f; b.wr.rotation.z = -f; }
  for (const p of puffs) { p.life += dt; if (p.life > 3) p.life -= 3; const src = chimneys[p.src % chimneys.length]; if (!src) continue; const k = p.life / 3;
    p.m.position.set(src.x + k * 1.2, src.y + k * 2.4, src.z - k * 0.4); p.m.scale.setScalar(0.5 + k * 1.6); p.m.material.opacity = 0.8 * (1 - k); }
  for (const o of offers) if (o.obj.userData.bob && !o.obj.userData.flying) o.obj.userData.bob(t);
  anim.forEach((f) => f(t, dt));
}
// 게임 시간 한 걸음(그리기와 따로: 점검 봇도 이것으로 시간을 보낸다)
function advance(dt) {
  if (G.paused) return;
  if (G.ff) { if (G.tl || G.scene === 'ending') dt *= 4; else G.ff = false; }
  T += dt; G.cool = Math.max(0, G.cool - dt); if (G.scene === 'title') titleStep(dt);
  stepTweens(dt); stepDust(dt); stepFolks(T, dt); stepDrag(T);
}
function frame(now) {
  let dt = (now - last) / 1000 || 0; last = now; dt = Math.min(0.05, dt);
  if (!G.quiet && !LOW && GL && G.scene !== 'title') { if (dt > 0.045) slowN++; else slowN = Math.max(0, slowN - 1); if (slowN > 90) { setLow(true); slowN = 0; stamp('저사양 모드로 바꿨어요', '#fff6e6', 0); } }
  advance(dt);
  if (!G.paused) { placeCam(T); if (shake > 0) { shake = Math.max(0, shake - dt); camera.position.y += Math.sin(T * 60) * shake * 0.25; } stepSea(T); stepWorld(G.paused ? 0 : dt, T); }
  if (GL) { if (LOW || !rt) { renderer.setRenderTarget(null); renderer.render(scene, camera); } else { renderer.setRenderTarget(rt); renderer.render(scene, camera); renderer.setRenderTarget(null); renderer.render(postScene, postCam); } }
  drawHUD(T); FRAMES++; FT.push(performance.now()); if (FT.length > 90) FT.shift(); requestAnimationFrame(frame);
}
/* 타이틀: 검은 띠 + 바다에서 섬이 솟아오르고 로고가 절벽에 새겨진다 */
const riseGroup = [];
function titleStep(dt) {
  G.titleT += dt; const k = Math.min(1, G.titleT / 3.0); const e = ease(k);
  if (land) land.position.y = -7 * (1 - e);
  for (const m of riseGroup) m.position.y = m.userData.y0 - 7 * (1 - e);
  if (G.titleT > 4.4 && !G.titleReady) showTitleUI();
}

/* ══════════════ 시작 ══════════════ */
(async function init() {
  try { await Promise.all([document.fonts.load('40px BHS', '세 땅 개척 섬'), document.fonts.load('30px DH', '지은 시설')]); } catch (e) { /* 글꼴이 없어도 계속 */ }
  buildSky(); buildIsland(); const before = new Set(scene.children); person(-8.6, 5.6, C.red, C.cream, { ry: 0.5 }); person(-5.0, 7.6, C.yel, C.cream); person(12.2, 8.6, C.org, C.cream); person(3.2, -4.8, C.vio, C.cream, { ry: -0.4 });
   scatter(); seaProps(); buildIslet(); buildDocks(); buildScale(); buildRaft(); buildMapClouds(); buildPost(); raft.visible = false;
  // 섬 위 물체도 섬과 함께 솟아오르게(바다·하늘·먼 섬·구름 제외)
  scene.children.forEach((m) => { if (before.has(m) || m === sea || m === raft || m === scale.g || clouds.includes(m) || mapClouds.includes(m) || m.isLight) return; if (m.position.y > -1 && Math.hypot(m.position.x, m.position.z) < 24) { m.userData.y0 = m.position.y; riseGroup.push(m); } });
  scene.children.forEach((m) => { if (m.userData && m.userData.y0 === undefined && m.isMesh && m.position.y === -3) { m.userData.y0 = m.position.y; riseGroup.push(m); } });
  buildDepth(); upgradeCity(); buildPier(); placeCam(0); buildTitleLogo(); buildTitleBoats(); buildNameRock(); fit();
  if (QS.has('skip')) { G.titleT = 4.5; titleStep(0); }
  requestAnimationFrame(frame);
  window.READY = true;
})();
function sceneReset() { for (const k of ['howtoWrap', 'pauseWrap', 'gearWrap', 'notesWrap', 'result']) $(k).classList.add('hide'); $('nick').classList.add('hide'); $('menu').classList.add('hide'); G.paused = false; }

/* ══════════════ 팀 대항의 컴퓨터 팀(봇) ══════════════ */
function botTurn() {
  const myItem = G.item, myStep = G.step;
  after(1.4, () => { if (G.item !== myItem || G.step !== myStep || G.scene !== 'play' || G.busy || G.cool > 0) { if (G.item === myItem && G.step === myStep && G.scene === 'play') botTurn(); return; }
    const st = curStep(); const right = Math.random() < 0.7 || G.tries > 0;
    let label = st.ans, zone = st.zone; if (!right) { const wrongs = st.opts.filter((o) => o !== st.ans); label = wrongs[Math.floor(Math.random() * wrongs.length)]; }
    const o = offers.find((x) => x.label === (myItem.type === 'sort' ? offers[0].label : label)) || offers[0]; const from = offerXY(o);
    let to; if (st.kind === 'place') { const s = nearestSlot(zone, 0, 0); to = proj(s[0], height(s[0], s[1]), s[1]); } else if (myItem.type === 'sort') { const di = DOCKS.findIndex((d) => d.label === label); to = dockXY(di); } else to = reqXY();
    tween(0.9, (k) => { const e = ease(k); G.hand = [from[0] + (to[0] - from[0]) * e, from[1] + (to[1] - from[1]) * e]; }, () => { G.hand = null;
      if (G.item !== myItem || G.step !== myStep) return;
      if (st.kind === 'place') { const s = nearestSlot(zone, 0, 0); judge(label, right ? zone : (zone === '산' ? '평야' : '산'), new THREE.Vector3(s[0], 0, s[1])); }
      else judge(label);
      after(0.2, () => { if (G.item === myItem && G.step === myStep && G.phase === 'hint') botTurn(); }); }); });
}

/* 자동 점검 창구 (.claude/skills/game-verify) — 게임 진행에는 쓰지 않는다 */
window.__test = { version: 1, stageSize: [1280, 720],
  ui: { stage: '#stage', name: '#nick', get start() { const r = boatRect(0); return { x: Math.round(r.x + r.w / 2), y: Math.round(r.y + r.h / 2) }; }, pause: '#bPause', resume: '#bResume', mute: '#bSound', rotate: '#rotate', rotateOk: '#bRotOk' },
  isReady() { return G.titleReady; },
  quiet() { G.quiet = true; },
  items() { return ITEMS.map((it) => ({ no: it.no, group: CH[it.ch].name, type: it.type, ask: it.ask, hint: it.hint, exp: it.exp, steps: it.steps.map((s) => ({ kind: s.kind, ask: s.ask, opts: s.opts, ans: s.ans, zone: s.zone })) })); },
  goto(no, step = 0) { sceneReset(); try { localStorage.setItem('isl3_seen', '1'); } catch (e) { /* 무시 */ }
    if (G.scene === 'title') { G.titleT = 4.5; titleStep(0); $('nick').classList.add('hide'); $('menu').classList.add('hide'); }
    const it = ITEMS.find((x) => x.no === no); G.practice = false; G.ch = it.ch; G.scene = 'play'; G.chQueue = []; Object.assign(cam, CAMS.play); placeCam(T);
    if (it.ch === 0 || it.ch === 3) DOCKS.forEach((d) => { d.g.visible = true; });
    tweens.length = 0; camTo = CAMS.play;
    if (no > 22 && !islet.now.visible) { isletToNow(0.02); G.dev = Math.max(G.dev, 2); }
    if (no <= 22 && islet.now.visible) { islet.now.visible = false; islet.bridge.visible = false; islet.old.visible = true; islet.old.position.y = 0; islet.mud.scale.set(1, 1, 0.62); }   // 점검용 되돌아가기
    G.chQueue = chItems(it.ch).filter((x) => x.no > no);
    G.band = null; G.stamps.length = 0; it._missed = false; openItem(it, step); },
  state() { return { scene: ['ending', 'chclear', 'choice', 'howto'].includes(G.scene) ? (G.scene === 'ending' ? 'result' : G.scene) : G.scene, no: G.item ? G.item.no : 0, step: G.step, phase: G.phase, tries: G.tries, cool: G.cool, paused: G.paused, muted }; },
  targets() { const st = curStep(); if (!st || G.scene !== 'play') return [];
    if (G.item.type === 'sort') return DOCKS.map((d, i) => { const [x, y] = dockXY(i); return { label: d.label, correct: d.label === st.ans, x, y }; });
    return offers.map((o) => { const [x, y] = offerXY(o); return { label: o.label, correct: o.label === st.ans, x, y }; }); },
  start(nick) { $('nick').value = nick || '봇'; G.titleT = 4.5; titleStep(0); try { localStorage.setItem('isl3_seen', '1'); } catch (e) { /* 무시 */ } beginGame('solo', false); },
  botStep(mode) {

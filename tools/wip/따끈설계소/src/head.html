<style>
@font-face{font-family:SunB;src:url(data:font/woff2;base64,__SUNB__) format("woff2")}
@font-face{font-family:Pen;src:url(data:font/woff2;base64,__PEN__) format("woff2")}

.ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(6,20,52,.82)}.ov.on{display:flex}

.pb.sub{color:#eaf3ff;border-color:#eaf3ff;font-size:1.35em}
#note .box{width:78%;max-height:84%;display:flex;flex-direction:column;text-align:left;padding:1.2em 1.6em}

#noteBody .row{border-top:.07em dashed rgba(234,243,255,.5);padding:.7em 0}#noteBody .q{font-size:1.5em;line-height:1.45}#noteBody .q b{color:#ffd66b;font-weight:normal;margin-right:.4em}

<div id="stage">

<script>
/* ── 01_core.js ── */
'use strict';
/* ══════════════════════════════════════════════════════════════════════
   빛줄기 서커스 — 4학년 2학기 수학 4. 사각형
   조건: HTML 파일 하나 · 인터넷 없이 실행 · 그림은 전부 코드 · 이모지 0개 · 글꼴은 OFL 글꼴을 쓰는 글자만 넣음

   아트 바이블 — 빛줄기 서커스
   1. 장르·시점·카메라: 빛 겹치기 퍼즐 공연 · 천막 안 정면 무대(별 모눈 막이 무대 한가운데) · 카메라 숨쉬기 ±8px
      (뒤 천막·객석·앞줄 관객만 서로 다른 시차로 움직이고, 조작하는 무대 막은 고정), 정답 때 겹친 자리로 살짝 확대
   2. 렌더링 방식·기준작: 어두운 바탕 + 빛 더하기(네온·빛 번짐) 위에 셀음영 캐릭터 · 오리와 눈먼 숲의 빛 번짐,
      리듬 세상의 무대 연출
   3. 빛: 왼쪽 기둥 위 트러스에 물린 호박색 작업등 하나가 주광원(모든 물체의 왼쪽 위가 밝음), 그늘은 남보라 쪽.
      작업등의 따뜻한 빛은 막(퍼즐 판)을 빼고 링·기둥·단장에만 닿는다(막 위의 빛은 색 조명뿐).
      빨강·초록·파랑 색 조명은 '효과 빛'으로 더하기 합성. 겹친 자리는 섞임색 표로 칠한다(빨강+파랑 자홍, 빨강+초록 노랑,
      초록+파랑 청록, 셋 흰빛) — 빛 번짐 뒤에 그려 색이 바래지 않게
   4. 외곽선: 앞쪽 물체(단장·곡예사·조명 기구·삼각자·북 단추·쇼 북·간판)와 무대 구조물(기둥·트러스)만 #1a1030 2.5~3px,
      천막 지붕·먼 객석·밧줄·커튼은 선 없음
   5. 음영: 바탕·그늘·빛 3단 + 접지 그림자, 놋쇠·전구는 하이라이트 점, 원통(기둥·조명통)은 굽은 방향 5단 그라데이션,
      빛줄기는 밝은 가장자리선 + 반투명 속 + 떠다니는 먼지
   6. 팔레트: 밤 남보라(#120a26·#241848) / 천막 진홍(#b8233c)·크림(#f1dfbf) 줄무늬 / 놋쇠 금(#e8b44c) /
      빛 삼원색 빨강 #ff4d6a · 초록 #3cff9e · 파랑 #4b8dff
   7. 질감·디테일: 천막 천 결 노이즈, 막의 별 모눈, 큰 것(기둥·트러스·그물)·중간(조명·북·사다리·그네)·
      작은 것(전구·팝콘·반짝이·먼지) 3단계
   8. 깊이: 천막 지붕 → 뒤 객석 불빛 → 별 모눈 막 → 트러스·기둥·밧줄·그네 → 조명 기구·빛줄기 → 단장·곡예사
      → 떠다니는 연기 → 흐린 앞줄 관객 머리·야광봉 (8겹)
   9. 글꼴·UI 재질: 제목·큰 숫자 Black Han Sans(잉크색 두꺼운 외곽선 + 돌출), 본문 Do Hyeon / 북(드럼) 단추 ·
      전구 간판(마키: 막 표시·로고·글자 단추) · 크림 신청서 종이(기울어 흔들림, 찢긴 끝까지 외곽선) ·
      놋쇠 명판(폭·길이) · 전구 칩(각도) · 진홍 틀 칩(점 이름) · 놋쇠 테 나뭇결 상자(꼬리표·도구) ·

function rng(seed){ let s=(seed*2654435761)>>>0||1; return ()=>{ s^=s<<13; s>>>=0; s^=s>>>17; s^=s<<5; s>>>=0; return s/4294967296; }; }

/* ───────── 도형 ───────── */
function rr(g,x,y,w,h,r){ r=Math.min(r,w/2,h/2); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
function el(g,x,y,rx,ry,rot=0){ g.moveTo(x+rx*Math.cos(rot),y+rx*Math.sin(rot)); g.ellipse(x,y,rx,ry,rot,0,TAU); g.closePath(); }

function poly(g,pts){ g.moveTo(pts[0][0],pts[0][1]); for(let i=1;i<pts.length;i++) g.lineTo(pts[i][0],pts[i][1]); g.closePath(); }
function star4(g,x,y,r){ g.moveTo(x,y-r); g.quadraticCurveTo(x+r*.18,y-r*.18,x+r,y); g.quadraticCurveTo(x+r*.18,y+r*.18,x,y+r); g.quadraticCurveTo(x-r*.18,y+r*.18,x-r,y); g.quadraticCurveTo(x-r*.18,y-r*.18,x,y-r); g.closePath(); }
function star5(g,x,y,r,ri=.45,rot=-Math.PI/2){ for(let i=0;i<10;i++){ const a=rot+i*Math.PI/5, k=i%2?r*ri:r; const px=x+Math.cos(a)*k, py=y+Math.sin(a)*k; i?g.lineTo(px,py):g.moveTo(px,py); } g.closePath(); }

/* ───────── 화면 밖 캔버스 층 ───────── */
function layer(w=W,h=H,m=0,dpr){ const d=dpr||DPR; const c=document.createElement('canvas'); c.width=Math.ceil((w+2*m)*d); c.height=Math.ceil((h+2*m)*d);
  const g=c.getContext('2d'); g.setTransform(d,0,0,d,m*d,m*d); g.lineJoin='round'; g.lineCap='round'; return {c,g,w,h,m,d}; }
function blit(L,dx=0,dy=0,a=1){ if(a<=0) return; if(a!==1) ctx.globalAlpha=a; ctx.drawImage(L.c,dx-L.m,dy-L.m,L.w+2*L.m,L.h+2*L.m); if(a!==1) ctx.globalAlpha=1; }

/* ───────── 셀 음영 3단 ─────────
   빛은 왼쪽 위 작업등에서 온다. 도형을 빛 쪽으로 밀어 덮으면 오른쪽 아래에 그늘 초승달,
   반대로 밀어 빼면 왼쪽 위에 빛 초승달이 남는다. */
const LX=-.62, LY=-.78;
function cel(g,shape,base,o={}){
  const s=o.s??7, h=o.h??5, ow=o.ow??3;
  g.save();
  if(ow>0){ g.beginPath(); shape(g); g.lineWidth=ow*2; g.strokeStyle=o.ink||P.ink; g.stroke(); }
  g.beginPath(); shape(g); g.clip();
  g.fillStyle=o.sh||SH(base); g.fill();
  g.save(); g.translate(LX*s,LY*s); g.beginPath(); shape(g); g.restore(); g.fillStyle=base; g.fill();
  if(h>0){ g.beginPath(); shape(g); g.save(); g.translate(-LX*h,-LY*h); shape(g); g.restore(); g.globalAlpha=o.ha??.85; g.fillStyle=o.hl||HL(base); g.fill('evenodd'); g.globalAlpha=1; }
  if(o.gloss){ const [x,y,rx,ry,rot]=o.gloss; g.fillStyle='rgba(255,255,255,.82)'; g.beginPath(); el(g,x,y,rx,ry,rot??-.5); g.fill(); }
  if(o.rim){ g.beginPath(); shape(g); g.save(); g.translate(o.rim[0],o.rim[1]); shape(g); g.restore(); g.globalAlpha=o.rim[3]??.55; g.fillStyle=o.rim[2]; g.fill('evenodd'); g.globalAlpha=1; }
  g.restore();
}
/* 정적 층용(겹친 원 여러 개로 된 모양도 됨) */
function celL(L,shape,base,o={}){
  const g=L.g, s=o.s??8, h=o.h??6, ow=o.ow??3, T=tmpFor(L);
  g.save();
  if(ow>0){ g.beginPath(); shape(g); g.lineWidth=ow*2; g.strokeStyle=o.ink||P.ink; g.stroke(); }
  g.beginPath(); shape(g); g.fillStyle=base; g.fill(); g.restore();
  const cres=(dx,dy,col,a)=>{ clearL(T); const t=T.g; t.save(); t.beginPath(); shape(t); t.fillStyle=col; t.fill();
    t.globalCompositeOperation='destination-out'; t.translate(dx,dy); t.beginPath(); shape(t); t.fill(); t.restore();
    g.save(); g.setTransform(1,0,0,1,0,0); g.globalAlpha=a; g.drawImage(T.c,0,0); g.restore(); };
  if(s>0) cres(LX*s,LY*s,o.sh||SH(base),o.sa??1);
  if(h>0) cres(-LX*h,-LY*h,o.hl||HL(base),o.ha??.85);
}
/* 원통(기둥·조명통): 굽은 방향 5단 */

/* ───────── 질감(값 노이즈) ───────── */
function makeNoise(n,seed,octs){ const c=document.createElement('canvas'); c.width=c.height=n; const g=c.getContext('2d'); const img=g.createImageData(n,n); const R=rng(seed);
  const grids=octs.map(([f,a])=>{ const S=f+1, G=new Float32Array(S*S); for(let i=0;i<f;i++) for(let j=0;j<f;j++) G[i*S+j]=R();
    for(let i=0;i<f;i++) G[i*S+f]=G[i*S]; for(let j=0;j<=f;j++) G[f*S+j]=G[j]; return {f,a,G,S}; });
  for(let y=0;y<n;y++) for(let x=0;x<n;x++){ let v=0;
    for(const {f,a,G,S} of grids){ const fx=x/n*f, fy=y/n*f, ix=fx|0, iy=fy|0, tx=fx-ix, ty=fy-iy, sx=tx*tx*(3-2*tx), sy=ty*ty*(3-2*ty);
      v+=a*((G[iy*S+ix]*(1-sx)+G[iy*S+ix+1]*sx)*(1-sy)+(G[(iy+1)*S+ix]*(1-sx)+G[(iy+1)*S+ix+1]*sx)*sy); }
    const k=(y*n+x)*4, c8=Math.max(0,Math.min(255,v*255)); img.data[k]=img.data[k+1]=img.data[k+2]=c8; img.data[k+3]=255; }
  g.putImageData(img,0,0); return c; }
let NOISE=null, WEAVE=null;
function tex(g,img,alpha,mode,x=0,y=0,w=W,h=H){ g.save(); g.globalCompositeOperation=mode||'overlay'; g.globalAlpha=alpha; g.fillStyle=g.createPattern(img,'repeat'); g.fillRect(x,y,w,h); g.restore(); }
/* 천 결: 가로·세로 실 */
function makeWeave(){ const c=document.createElement('canvas'); c.width=c.height=64; const g=c.getContext('2d'); const R=rng(41);
  g.fillStyle='#808080'; g.fillRect(0,0,64,64);
  for(let i=0;i<64;i+=2){ g.fillStyle=`rgba(255,255,255,${.05+R()*.08})`; g.fillRect(0,i,64,1); g.fillStyle=`rgba(0,0,0,${.05+R()*.08})`; g.fillRect(i,0,1,64); }
  return c; }

/* ───────── 흐림(줄였다 키우기: 구형 PC에서도 빠름) ───────── */
function blurCanvas(src,times){ let cur=src;
  for(let i=0;i<times;i++){ const c=document.createElement('canvas'); c.width=Math.max(1,cur.width>>1); c.height=Math.max(1,cur.height>>1); const g=c.getContext('2d'); g.imageSmoothingQuality='high'; g.drawImage(cur,0,0,c.width,c.height); cur=c; }
  for(let i=0;i<times;i++){ const c=document.createElement('canvas'); c.width=cur.width*2; c.height=cur.height*2; const g=c.getContext('2d'); g.imageSmoothingQuality='high'; g.drawImage(cur,0,0,c.width,c.height); cur=c; }
  const out=document.createElement('canvas'); out.width=src.width; out.height=src.height; const og=out.getContext('2d'); og.imageSmoothingQuality='high'; og.drawImage(cur,0,0,out.width,out.height); return out; }

/* ───────── 글자(게임 글꼴 + 외곽선 + 돌출) ───────── */
const FT='BHS, DH, sans-serif', FB='DH, sans-serif';
function txt(g,s,x,y,o){ g.save(); g.font=`${o.size}px ${o.font||FB}`; g.textAlign=o.align||'left'; g.textBaseline=o.base||'alphabetic'; g.lineJoin='round'; g.miterLimit=2;
  if(o.ls) g.letterSpacing=o.ls+'px';
  if(o.ex){ g.fillStyle=o.exc; g.strokeStyle=o.exc; g.lineWidth=o.sw||0; for(let i=o.ex;i>=1;i--){ if(o.sw) g.strokeText(s,x,y+i); g.fillText(s,x,y+i); } }
  if(o.sw){ g.strokeStyle=o.stroke||P.ink; g.lineWidth=o.sw; g.strokeText(s,x,y); }
  g.fillStyle=o.fill||'#fff'; g.fillText(s,x,y);
  if(o.gl){ g.save(); g.beginPath(); g.rect(x-2000,y-o.size,4000,o.size*.5); g.clip(); g.fillStyle='rgba(255,255,255,.28)'; g.fillText(s,x,y); g.restore(); }
  g.restore(); }
function wrapText(g,s,maxW){ const out=[]; for(const para of String(s).split('\n')){ let line=''; for(const word of para.split(' ')){ const test=line?line+' '+word:word; if(g.measureText(test).width>maxW&&line){ out.push(line); line=word; } else line=test; } out.push(line); } return out; }
/* 받침에 맞는 조사 */
function josa(word,pair){ const c=word.charCodeAt(word.length-1); const has=c>=0xAC00&&c<=0xD7A3&&(c-0xAC00)%28!==0; const [a,b]=pair.split('/'); return word+(has?a:b); }

/* ── 02_audio.js ── */
/* ══════════════ 소리: 효과음은 모두 Web Audio로 합성(배경음악 파일 없음 → 음악 단추 없음) ══════════════ */
const AU={ac:null,out:null,muted:!!SAVE.muted,noiseBuf:null,amb:null};
function audioInit(){
  if(AU.ac) { if(AU.ac.state==='suspended') AU.ac.resume(); return; }
  try{
    AU.ac=new (window.AudioContext||window.webkitAudioContext)();
    AU.out=AU.ac.createGain(); AU.out.gain.value=AU.muted?0:.8;
    const comp=AU.ac.createDynamicsCompressor(); comp.threshold.value=-14; comp.ratio.value=4;
    AU.out.connect(comp); comp.connect(AU.ac.destination);
    const n=AU.ac.sampleRate*2, b=AU.ac.createBuffer(1,n,AU.ac.sampleRate), d=b.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
    AU.noiseBuf=b;
    if(AU.ac.state==='suspended') AU.ac.resume();
    startAmbience();
  }catch(e){ AU.ac=null; }
}
function setMuted(m){ AU.muted=m; SAVE.muted=m; storeSave(); if(AU.out) AU.out.gain.setTargetAtTime(m?0:.8,AU.ac.currentTime,.03); }
function env(g,t,a,d,peak,end=.0001){ g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(peak,t+a); g.gain.exponentialRampToValueAtTime(end,t+a+d); }
function osc(type,f,t,dur,vol,o={}){
  if(!AU.ac) return; const ac=AU.ac;
  const s=ac.createOscillator(), g=ac.createGain(); s.type=type; s.frequency.setValueAtTime(f,t);
  if(o.to) s.frequency.exponentialRampToValueAtTime(o.to,t+(o.slide||dur));
  if(o.det) s.detune.value=o.det;
  env(g,t,o.a||.005,dur,vol);
  let node=s;
  if(o.lp){ const f2=ac.createBiquadFilter(); f2.type='lowpass'; f2.frequency.value=o.lp; s.connect(f2); node=f2; }
  node.connect(g); g.connect(o.dest||AU.out); s.start(t); s.stop(t+dur+.05);
  if(o.vib){ const l=ac.createOscillator(), lg=ac.createGain(); l.frequency.value=o.vib[0]; lg.gain.value=o.vib[1]; l.connect(lg); lg.connect(s.frequency); l.start(t); l.stop(t+dur+.05); }
}
function noise(t,dur,vol,type,freq,q=1,o={}){
  if(!AU.ac) return; const ac=AU.ac;
  const s=ac.createBufferSource(); s.buffer=AU.noiseBuf; s.loop=true;
  const f=ac.createBiquadFilter(); f.type=type; f.frequency.setValueAtTime(freq,t); f.Q.value=q;
  if(o.to) f.frequency.exponentialRampToValueAtTime(o.to,t+dur);
  const g=ac.createGain(); env(g,t,o.a||.004,dur,vol);
  s.connect(f); f.connect(g); g.connect(o.dest||AU.out); s.start(t,Math.random()); s.stop(t+dur+.05);
}
function startAmbience(){ /* 객석 웅성임: 아주 작게 */
  if(!AU.ac||AU.amb) return; const ac=AU.ac;

/* 꼬리표 문항의 현수막: 신청서와 같은 크림 종이(종이 결 + 찢긴 아래 끝 + 잉크 외곽선 + 빨래집게) */

/* ══════════════ 문항 종류 2: 고르기 · 꼬리표 · 각도 바퀴/줄 감개 · 짝짓기 · 꼭짓점 · 외줄 · 삼각자 ══════════════ */
const TRAY={x:268,y:536,w:372,h:112};  /* 막 아래 소품 자리(꼬리표·삼각자·바퀴) */

/* ───── 2) 고르기: 빛 그림·외줄·레이저 짝·별·표지판을 눌러 켠다 ───── */
KINDS.pick={
  init(it){ const S={it,sel:new Set(),objs:it.make()}; return S; },

      if(o.type==='pairL'){ for(const [a,b] of o.segs) laserSeg(a,b,o.col||'#4b8dff',{alpha:sel?1:.85}); }

/* ───── 3) 꼬리표: 낱말 꼬리표를 빈칸에 끌어다 붙인다 ───── */
KINDS.tags={
  init(it){ const S={it,blanks:[],tags:[],drag:null,picked:-1};
    /* 꼬리표는 글자 길이에 맞춘 폭으로 줄 바꿈해 담고, 줄 수만큼 상자가 위로 자란다(아래 끝은 고정) */
    const words=shuffle(it.tags.slice()); ctx.save(); ctx.font=`25px ${FB}`; const ws=words.map(w=>Math.max(100,Math.ceil(ctx.measureText(w).width)+56)); ctx.restore();
    const gap=12, maxW=TRAY.w-28, rows=[[]]; let rw=0;
    words.forEach((w,i)=>{ const row=rows[rows.length-1], add=(row.length?gap:0)+ws[i]; if(row.length&&rw+add>maxW){ rows.push([i]); rw=ws[i]; } else { row.push(i); rw+=add; } });

    for(const tg of S.tags){ tg.x=tg.hx; tg.y=tg.hy; }
    /* 문장과 빈칸 자리 계산 */
    ctx.save(); ctx.font=`25px ${FB}`; const B=it.banner; let y=B.y+44; S.lines=[];
    for(const sent of it.sentences){ const parts=sent.split('[]'); let x=B.x+20; const row=[];
      parts.forEach((pt,i)=>{ for(const word of pt.split(/(\s)/)){ if(!word) continue; const w=ctx.measureText(word).width; if(x+w>B.x+B.w-18&&word!==' '){ x=B.x+20; y+=46; } if(word!==' ') row.push({t:word,x,y}); x+=w; }
        if(i<parts.length-1){ const bw=B.blankW||150; if(x+bw>B.x+B.w-18){ x=B.x+20; y+=46; } S.blanks.push({x:x+4,y:y-32,w:bw,h:42,ans:it.answers[S.blanks.length],tag:-1}); x+=bw+8; } });

  draw(S,t,dt,ph){ if(S.it.fig) S.it.fig(S,t,ph); },
  front(S,t){ const it=S.it, B=it.banner;

  hud(S,t){ drawTray(S.trayY,S.trayH); txt(ctx,'낱말 꼬리표',TRAY.x+18,S.trayY-9,{size:21,fill:'#ffe08a',sw:4,stroke:P.ink});

  down(S,p){ for(let i=S.tags.length-1;i>=0;i--){ const tg=S.tags[i]; if(p.x>=tg.x&&p.x<=tg.x+tg.wd&&p.y>=tg.y&&p.y<=tg.y+tg.h){ S.drag={i,x:tg.x,y:tg.y,ox:p.x-tg.x,oy:p.y-tg.y,moved:false,sx:p.x,sy:p.y}; SFX.tap(); return true; } }

    const tg=S.tags[D.i]; let best=-1,bd=95; S.blanks.forEach((b,bi)=>{ const d=Math.hypot(D.x+tg.wd/2-(b.x+b.w/2),D.y+21-(b.y+21)); if(d<bd){ bd=d; best=bi; } });

/* ───── 4) 수 맞추기: 각도 바퀴(°)·줄 감개(m)를 돌린다 ───── */
KINDS.value={
  init(it){ const S={it,inp:it.inputs.map((d,i)=>Object.assign({val:d.start??(d.type==='angle'?90:0),set:false,ang:-Math.PI/2,active:false},d))};
    let x=TRAY.x; for(const d of S.inp){ if(d.type==='angle'){ d.x=x+116; d.y=TRAY.y+84; d.r=92; x+=238; } else { d.x=x+72; d.y=TRAY.y+30; d.r=42; d.ang=-Math.PI/2+(d.val||0)/12*TAU; x+=160; } }

  draw(S,t,dt,ph){ if(S.it.fig) S.it.fig(S,t,ph); },
  front(S,t,dt,ph){ if(S.it.front) S.it.front(S,t,ph); },
  hud(S,t){ for(const d of S.inp){ if(d.type==='angle') drawDial(ctx,d,t); else drawReel(ctx,Object.assign(d,{unit:d.unit||'m'}),t); } },
  down(S,p){ for(const d of S.inp){ if(d.type==='angle'){ if(p.y<=d.y+30&&p.y>=d.y-d.r-26&&Math.abs(p.x-d.x)<=d.r+20){ S.drag=d; d.active=true; KINDS.value.move(S,p); return true; } }
      else if(Math.hypot(p.x-d.x,p.y-d.y)<d.r+26){ S.drag=d; d.active=true; d.last=Math.atan2(p.y-d.y,p.x-d.x); d.acc=0; return true; } } return false; },
  move(S,p){ const d=S.drag; if(!d) return;
    if(d.type==='angle'){ const v=dialFromPoint(d,p.x,p.y); if(v!==d.val||!d.set){ d.val=v; d.set=true; SFX.tick(v%30?0:3); } }
    else { const a=Math.atan2(p.y-d.y,p.x-d.x); let da=a-d.last; if(da>Math.PI) da-=TAU; if(da<-Math.PI) da+=TAU; d.last=a; d.ang+=da; d.acc+=da;
      const step=TAU/12, k=Math.trunc(d.acc/step); if(k!==0){ d.acc-=k*step; const nv=clamp(d.val+k*(d.step||1),0,d.max||60); if(nv!==d.val||!d.set){ d.val=nv; d.set=true; SFX.tick(2); } } } },
  up(S){ if(S.drag){ S.drag.active=false; S.drag=null; } },
  key(S,e){ const d=S.inp[S.kf||0]; if(!d) return false;

    if(e.key==='ArrowRight'||e.key==='ArrowUp'){ d.val=clamp(d.val+(d.type==='angle'?5:(d.step||1)),0,d.type==='angle'?180:(d.max||60)); d.set=true; SFX.tick(); return true; } return false; },
  ready(S){ return S.inp.every(d=>d.set); },

  check(S){ const bad=S.inp.filter(d=>d.val!==d.answer); if(!bad.length) return {ok:true}; return {ok:false,diag:S.inp.length>1?`${bad.map(d=>d.label).join(', ')}이 알맞지 않아요.`:null}; },
  answer(S){ return S.inp.map(d=>(S.inp.length>1?d.label+' ':'')+d.val+(d.type==='angle'?'°':' '+(d.unit||'m'))).join(', '); },
  solve(S){ for(const d of S.inp){ d.val=d.answer; d.set=true; } },
  stage(S){ return S.it.stage?S.it.stage(S):{type:'flip'}; }
};

/* ───── 5) 짝짓기: 평행한 변끼리 눌러 짝을 짓는다 ───── */
const PAIRCOL=['#ffd24a','#5ee7ff','#ff8fb0'];
KINDS.pairs={
  init(it){ return {it,pend:-1,pairs:[]}; },
  sides(S){ const pg=S.it.pg; return pg.map((p,i)=>[p,pg[(i+1)%pg.length]]); },
  draw(S,t){ goboShape(S.it.pg,t,{}); },
  front(S,t){ const sd=KINDS.pairs.sides(S);
    sd.forEach(([a,b],i)=>{ const pi=S.pairs.findIndex(pr=>pr.includes(i)); const col=pi>=0?PAIRCOL[pi%3]:(S.pend===i?'#ffffff':null);
      if(col){ laserSeg(a,b,col,{lw:5,wide:18}); const m=vmul(vadd(a,b),.5), d=vnorm(vsub(b,a)), q=toPx(m);
        if(pi>=0){ ctx.save(); ctx.translate(q[0],q[1]); ctx.rotate(Math.atan2(d[1],d[0])); for(let k=0;k<=pi;k++){ ctx.strokeStyle=P.ink; ctx.lineWidth=6; ctx.beginPath(); ctx.moveTo(-6+k*9,-8); ctx.lineTo(2+k*9,0); ctx.lineTo(-6+k*9,8); ctx.stroke(); ctx.strokeStyle=col; ctx.lineWidth=3; ctx.stroke(); } ctx.restore(); } }
      else { const q=toPx(vmul(vadd(a,b),.5)); ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.fillStyle=`rgba(255,240,200,${.25+.2*Math.sin(t*4+i)})`; ctx.beginPath(); circ(ctx,q[0],q[1],7); ctx.fill(); ctx.restore(); } });

  down(S,p){ const m=pM(p), sd=KINDS.pairs.sides(S); let best=-1,bd=.6; sd.forEach(([a,b],i)=>{ const d=distSeg(m,a,b); if(d<bd){ bd=d; best=i; } }); if(best<0) return false;
    const pi=S.pairs.findIndex(pr=>pr.includes(best)); if(pi>=0){ S.pairs.splice(pi,1); S.pend=-1; SFX.unpick(); return true; }
    if(S.pend<0){ S.pend=best; SFX.pick(); return true; }

  move(){}, up(){}, key(){ return false; },
  ready(S){ return S.pairs.length>0; },
  notReady:'변을 두 개씩 눌러서 평행한 변끼리 짝을 지어 주세요!',

  answer(S){ return S.pairs.length+'쌍'+(S.pairs.length?' ('+S.pairs.map(p=>p.map(i=>S.it.sideNames[i]).join('와 ')).join(', ')+')':''); },
  solve(S){ S.pairs=S.it.want.map(p=>p.slice()); S.pend=-1; },
  stage(S){ return {type:'land',poly:S.it.pg}; }

/* ───── 6) 꼭짓점 옮기기: 전구 기둥 네 개를 모눈 점으로 옮긴다 ───── */
KINDS.posts={
  init(it){ return {it,v:it.start.map(p=>p.slice()),drag:-1,sel:0,moved:false}; },
  draw(S,t){ const ok=quadSimple(S.v); goboShape(S.v,t,{col:ok?'#ffd98a':'#ff8f8f'}); },
  front(S,t){ /* 전구 줄과 기둥 */
    const pts=S.v.map(toPx);
    ctx.save(); ctx.strokeStyle='rgba(255,236,170,.9)'; ctx.lineWidth=2; ctx.beginPath(); poly(ctx,pts); ctx.stroke(); ctx.restore();
    for(let i=0;i<4;i++){ const a=pts[i], b=pts[(i+1)%4]; for(let k=1;k<6;k++){ const x=lerp(a[0],b[0],k/6), y=lerp(a[1],b[1],k/6); const on=(Math.floor(t*4)+k+i)%2; ctx.fillStyle=on?'#fff3b0':'#c9a060'; ctx.beginPath(); circ(ctx,x,y,3.4); ctx.fill(); } }
    pts.forEach((q,i)=>{ const act=S.drag===i||(KB.on&&S.sel===i);
      ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.fillStyle=`rgba(255,214,110,${act?.55:.25+.15*Math.sin(t*4+i)})`; ctx.beginPath(); circ(ctx,q[0],q[1],act?22:17); ctx.fill(); ctx.restore();

    tagLabel(gx(S.it.legend[0]),gy(S.it.legend[1]),'1칸 = 1 m',{size:20}); },
  down(S,p){ const m=pM(p); let best=-1,bd=.8; S.v.forEach((q,i)=>{ const d=vlen(vsub(m,q)); if(d<bd){ bd=d; best=i; } }); if(best<0) return false; S.drag=best; S.sel=best; SFX.tap(); return true; },
  move(S,p){ if(S.drag<0) return; const m=pM(p), B=S.it.bounds; const q=[clamp(Math.round(m[0]),B[0],B[2]),clamp(Math.round(m[1]),B[1],B[3])];
    if(S.v.some((v,i)=>i!==S.drag&&v[0]===q[0]&&v[1]===q[1])) return;
    if(q[0]!==S.v[S.drag][0]||q[1]!==S.v[S.drag][1]){ S.v[S.drag]=q; S.moved=true; SFX.tick(1); } },
  up(S){ S.drag=-1; },
  key(S,e){ if(e.key==='Tab'){ S.sel=(S.sel+1)%4; return true; } const d={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key]; if(!d) return false; const B=S.it.bounds, v=S.v[S.sel]; const q=[clamp(v[0]+d[0],B[0],B[2]),clamp(v[1]+d[1],B[1],B[3])]; if(!S.v.some((w,i)=>i!==S.sel&&w[0]===q[0]&&w[1]===q[1])){ S.v[S.sel]=q; S.moved=true; SFX.tick(1); } return true; },
  ready(S){ return S.moved; },
  notReady:'전구 기둥을 끌어서 무대 모양을 바꿔 주세요!',
  check(S){ return S.it.goal(S.v); },
  answer(S){ return S.it.answerText(S.v); },

/* ───── 7) 외줄 걸기: 두 변 사이에 외줄을 끌어서 건다 ───── */
KINDS.rope={
  init(it){ return {it,rope:null,drag:null}; },
  snapPt(S,m){ /* 도형 둘레 위 0.5 m 간격 점 중 가장 가까운 곳 */ const pg=S.it.pg; let best=null,bd=.9;
    for(let i=0;i<pg.length;i++){ const a=pg[i], b=pg[(i+1)%pg.length], L=vlen(vsub(b,a)), n=Math.max(1,Math.round(L/.5));
      for(let k=0;k<=n;k++){ const q=vadd(a,vmul(vsub(b,a),k/n)); const d=vlen(vsub(q,m)); if(d<bd){ bd=d; best={p:q,side:i}; } } }

  draw(S,t){ goboShape(S.it.pg,t,{}); },
  front(S,t){ const r=S.drag||S.rope; if(S.it.front) S.it.front(S,t);

    else if(r) { const q=toPx(r.a.p); cel(ctx,s=>circ(s,q[0],q[1],7),P.gold,{s:1.5,h:1,ow:2}); } },
  down(S,p){ const sp=KINDS.rope.snapPt(S,pM(p)); if(!sp) return false; S.drag={a:sp,b:null}; SFX.tap(); return true; },
  move(S,p){ if(!S.drag) return; const sp=KINDS.rope.snapPt(S,pM(p)); const nb=sp&&(sp.side!==S.drag.a.side||vlen(vsub(sp.p,S.drag.a.p))>.4)?sp:null; if(nb&&(!S.drag.b||vlen(vsub(nb.p,S.drag.b.p))>1e-6)) SFX.tick(1); S.drag.b=nb; },
  up(S){ if(S.drag&&S.drag.b){ S.rope=S.drag; SFX.snap(); } S.drag=null; },
  key(){ return false; },
  ready(S){ return !!S.rope; },

/* ───── 8) 삼각자 대고 레이저 긋기 ───── */
const SQ_L=5; /* 삼각자 직각을 낀 변 길이(m) */
KINDS.square={
  init(it){ return {it,sq:{v:it.sqStart.slice(),rot:it.sqRot??0},drag:null,line:null,seat:null}; },
  verts(S){ const {v,rot}=S.sq, u=dirOf(rot), w=dirOf(rot+90); return [v,vadd(v,vmul(u,SQ_L)),vadd(v,vmul(w,SQ_L))]; },
  edges(S){ const [V,A,B]=KINDS.square.verts(S); return [[V,A],[V,B],[A,B]]; },
  draw(S,t){ const it=S.it; laserLine(it.ref.p,it.ref.ang,'#4b8dff'); if(S.line) laserLine(S.line.p,S.line.ang,'#ff4d6a'); },
  front(S,t){ const it=S.it;

    if(it.pt){ starPin(it.pt,t,{r:8}); ptLabel(vadd(it.pt,[.9,-.4]),'ㄱ',{size:24}); }
    const [V,A,B]=KINDS.square.verts(S).map(toPx);
    ctx.save(); ctx.fillStyle='rgba(6,2,16,.3)'; ctx.beginPath(); ctx.moveTo(V[0]+4,V[1]+7); ctx.lineTo(A[0]+4,A[1]+7); ctx.lineTo(B[0]+4,B[1]+7); ctx.closePath(); ctx.fill();

    for(const [P0,P1] of [[V,A],[V,B]]){ for(let k=1;k<SQ_L*2;k++){ const x=lerp(P0[0],P1[0],k/(SQ_L*2)), y=lerp(P0[1],P1[1],k/(SQ_L*2)); const nx=-(P1[1]-P0[1]), ny=P1[0]-P0[0], nl=Math.hypot(nx,ny); const len=k%2?5:9;
      const sx=(B[0]-V[0])*(P1===A?1:0)+(A[0]-V[0])*(P1===B?1:0), sy=(B[1]-V[1])*(P1===A?1:0)+(A[1]-V[1])*(P1===B?1:0), sl=Math.hypot(sx,sy);
      ctx.strokeStyle='rgba(20,40,80,.6)'; ctx.lineWidth=1.2; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+sx/sl*len,y+sy/sl*len); ctx.stroke(); } }
    /* 직각 표시 */
    const u=vnorm([A[0]-V[0],A[1]-V[1]]), w=vnorm([B[0]-V[0],B[1]-V[1]]); ctx.strokeStyle=P.ink; ctx.lineWidth=2.4; ctx.beginPath(); ctx.moveTo(V[0]+u[0]*16,V[1]+u[1]*16); ctx.lineTo(V[0]+u[0]*16+w[0]*16,V[1]+u[1]*16+w[1]*16); ctx.lineTo(V[0]+w[0]*16,V[1]+w[1]*16); ctx.stroke();
    ctx.restore();
    /* 변 누르기 표시 */
    if(!S.drag) KINDS.square.edges(S).forEach(([a,b],i)=>{ const m=toPx(vmul(vadd(a,b),.5)); ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.fillStyle=`rgba(255,120,140,${.35+.25*Math.sin(t*5+i)})`; ctx.beginPath(); circ(ctx,m[0],m[1],8); ctx.fill(); ctx.restore(); });
    /* 회전 손잡이 */

    ctx.save(); ctx.translate(kp[0],kp[1]); ctx.strokeStyle=P.ink; ctx.lineWidth=2.4; ctx.beginPath(); ctx.arc(0,0,7,-2.4,.9); ctx.stroke(); ctx.restore();

  snapAll(S){ /* 변이 레이저와 거의 나란하고 가까우면 딱 붙인다, 점 ㄱ도 끌어당긴다 */
    const it=S.it; S.seat=null;

      KINDS.square.edges(S).forEach(([a,b],ei)=>{ if(S.seat!==null) return; const ed=vnorm(vsub(b,a)); const angDiff=Math.abs(Math.asin(clamp(vcross(ed,d),-1,1)))/DEG;

const PLANE={on:false,t:0,dur:1.05};
function planeAt(k){ const a=[600,760], c=[840,170], b=[1130,112]; const e=easeInOut(k); const x=(1-e)*(1-e)*a[0]+2*(1-e)*e*c[0]+e*e*b[0], y=(1-e)*(1-e)*a[1]+2*(1-e)*e*c[1]+e*e*b[1];
  const tx=2*(1-e)*(c[0]-a[0])+2*e*(b[0]-c[0]), ty=2*(1-e)*(c[1]-a[1])+2*e*(b[1]-c[1]); return {x,y,a:Math.atan2(ty,tx)}; }
function drawPlane(t){ if(!PLANE.on) return; const k=clamp(PLANE.t/PLANE.dur,0,1), p=planeAt(k); const s=lerp(1.25,.8,k);
  ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.scale(s,s);
  ctx.fillStyle='rgba(6,2,16,.35)'; ctx.beginPath(); ctx.moveTo(34,8); ctx.lineTo(-28,-10); ctx.lineTo(-18,8); ctx.lineTo(-28,26); ctx.closePath(); ctx.fill();
  cel(ctx,g=>{ g.moveTo(32,0); g.lineTo(-30,-18); g.lineTo(-20,0); g.closePath(); },'#fbf2dc',{s:3,h:2,ow:2.5});
  cel(ctx,g=>{ g.moveTo(32,0); g.lineTo(-30,16); g.lineTo(-20,0); g.closePath(); },'#e8d6b0',{s:3,h:2,ow:2.5});
  ctx.strokeStyle='rgba(120,80,40,.6)'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(30,0); ctx.lineTo(-20,0); ctx.stroke();
  ctx.restore();
  /* 꼬리 반짝이 */
  ctx.save(); ctx.globalCompositeOperation='lighter'; for(let i=1;i<6;i++){ const q=planeAt(Math.max(0,k-i*.035)); ctx.fillStyle=`rgba(255,240,200,${.35-i*.05})`; ctx.beginPath(); star4(ctx,q.x,q.y,5-i*.6); ctx.fill(); } ctx.restore(); }

function curItem(){ return G.list[G.idx]; }
function rec(it){ return G.rec[it.id]||(G.rec[it.id]={id:it.id,tries:0,solved:false,stars:0,answers:[],time:0}); }
function startItem(){ const it=curItem(); G.S=KINDS[it.kind].init(it); G.ph='intro'; G.phT=0; G.itemT0=G.t; hideNote(); hush(); PLANE.on=true; PLANE.t=0; SFX.whoosh();
  LEVER.ready=false; LEVER.label='쇼 시작!'; if(PERF.on||PERF.stay) goHome(); AC.face='normal'; setRMFace('normal',0); RM.point=0;
  for(let i=FX.length-1;i>=0;i--) if(FX[i].kind==='namecard') FX.splice(i,1); }
function nextItem(){ SFX.paper(); hideNote(); hush();
  if(G.idx<G.list.length-1){ G.idx++; startItem(); }
  else finishAct(); }
function pullLever(){ const it=curItem(), K=KINDS[it.kind];
  if(G.ph==='done'){ SFX.bass(); LEVER.pull=1; nextItem(); return; }
  if(G.ph!=='active') return;
  if(!K.ready(G.S)){ SFX.unpick(); say(it.notReady||K.notReady||'먼저 무대를 꾸며 주세요!'); setRMFace('think',1.6); return; }
  SFX.bass(); G.ph='roll'; G.phT=0; LEVER.pull=1; hush(); SFX.drumroll(.85); setRMFace('surprise',1); }
function resolve(){ const it=curItem(), K=KINDS[it.kind], r=rec(it); const res=K.check(G.S); r.tries++; r.answers.push(K.answer(G.S));
  if(res.ok){ r.solved=true; G.hitStop=.09; /* 정답 순간 짧게 멈춤(손맛) */ r.stars=r.tries===1?3:r.tries===2?2:1; r.time=G.t-G.itemT0;
    G.combo=r.tries===1?G.combo+1:0; const gain=[0,15,35,60][r.stars]+Math.min(5,G.combo)*10; G.audience+=gain;
    G.ph='perform'; G.phT=0; const st=K.stage(G.S); if(K.keepClear) st.clear=K.keepClear(G.S); startPerf(st,true);
    SFX.crash(); SFX.fanfare(); setTimeout(()=>SFX.cheer(),180); G.wave=1.6; setRMFace('happy',3); RM.jump=.001; G.flash=.35; G.shake=.25;
    G.zoom.tk=1.04; const z=st.poly&&st.poly.length>2?toPx(centroid(st.poly)):(st.at||[SC.x+SC.w/2,SC.y+SC.h/2]); G.zoom.x=z[0]; G.zoom.y=z[1];
    /* 이름 도장 */
    const names=(st.names&&st.names[0])||it.stampNames||[];
    /* 이름 도장은 무대 밖 왼쪽 커튼 앞 종이에(빛 자리·폭 명판·판정 글자를 가리지 않게), 다음 신청서까지 남는다 */
    if(names.length){ const cw=220, ch=64+names.length*58;
      addFX({kind:'namecard',x:8+cw/2,y:146+ch/2,w:cw,h:ch,names,life:1e4,t0:.85});
      names.forEach((n,i)=>setTimeout(()=>SFX.stamp(i),(.85+.04+i*.32)*1000)); }

    const pp=popSpot(st); addFX({kind:'pop',x:pp[0],y:pp[1],text:['','좋아요!','멋져요!','완벽해요!'][r.stars],life:2.3,size:84,col:'#ffe08a'}); setTimeout(()=>confetti(it.finale?140:46),350); if(it.finale){ for(let i=0;i<5;i++) setTimeout(()=>{ SFX.firework(); sparkBurst(SC.x+80+Math.random()*(SC.w-160),SC.y+40+Math.random()*180,26,['#ff4d6a','#3cff9e','#4b8dff','#ffd24a']); },500+i*420); }
    setTimeout(()=>sparkBurst(z[0],z[1],20,['#fff3b0','#ffd24a','#9fe2ff','#ff9fb5']),1100);
    if(r.stars===3&&G.combo>=3) setTimeout(()=>addFX({kind:'pop',x:pp[0],y:pp[1]+(pp[1]<SC.y+SC.h/2?76:-76),text:G.combo+'번 연속 한 번에!',life:1.6,size:40,col:'#9fe2ff'}),1500);
  } else { G.combo=0; G.ph='fail'; G.phT=0; startPerf(K.stage(G.S)||{type:'flip'},false); SFX.wrong(); setTimeout(()=>SFX.boing(),1000); setRMFace('sad',2.4); G.flashBad=.35;
    const h=it.hints[Math.min(r.tries-1,it.hints.length-1)]; G.pendingHint={text:h,diag:res.diag}; } }
/* 판정 글자 자리: 막 안에서 곡예사(착지·걷는 길)와 빛 자리를 피해, 위 가운데부터 차례로 빈 곳을 찾는다 */
function popSpot(st){ const W2=420, H2=110, boxes=[], a=PERF.to;
  if(PERF.a&&PERF.b){ const x0=Math.min(PERF.a[0],PERF.b[0]), y0=Math.min(PERF.a[1],PERF.b[1]); boxes.push([x0-64,y0-150,Math.abs(PERF.a[0]-PERF.b[0])+128,Math.abs(PERF.a[1]-PERF.b[1])+190]); }
  else if(a) boxes.push([a[0]-70,a[1]-110,140,190]);
  if(st&&st.type==='flip') boxes.push([SC.x+SC.w/2-90,SC.y,180,260]);
  if(st&&st.clear) for(const r of st.clear) boxes.push([r.x,r.y,r.w,r.h]);
  if(st&&st.poly&&st.poly.length>2){ const all=(st.polys||[st.poly]).flat().map(toPx), xs=all.map(p=>p[0]), ys=all.map(p=>p[1]); boxes.push([Math.min(...xs),Math.min(...ys),Math.max(...xs)-Math.min(...xs),Math.max(...ys)-Math.min(...ys)]); }
  const cx=SC.x+SC.w/2, L=SC.x+220, R=SC.x+SC.w-220, T=SC.y+70, B=SC.y+SC.h-70, M=SC.y+SC.h/2;

  let best=C[0], bo=Infinity; for(const p of C){ const o=ov(p); if(o<bo-1){ bo=o; best=p; } if(bo<=0) break; } return best; }
function finishAct(){ const a=G.act; const stars=G.list.reduce((s,it)=>s+((G.rec[it.id]&&G.rec[it.id].stars)||0),0);
  SAVE.best=SAVE.best||{}; const prev=SAVE.best[a]||0; G.newBest=stars>prev; if(stars>prev) SAVE.best[a]=stars;
  SAVE.unlocked=Math.max(SAVE.unlocked||1,Math.min(3,a+1)); SAVE.bestAud=Math.max(SAVE.bestAud||0,G.audience); storeSave();

  update(dt){ const it=curItem(), K=KINDS[it.kind]; G.phT+=dt;

    if(K.front) K.front(G.S,t,dt,G.ph==='roll'?'roll':G.ph); },

    ctx.save(); ctx.strokeStyle='#d8c19a'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(x+60,SC.y-10); ctx.lineTo(x+60,y); ctx.moveTo(x+w-60,SC.y-10); ctx.lineTo(x+w-60,y); ctx.stroke(); ctx.restore();
    marquee(ctx,x,y,w,h,t,{step:22,lit:NAMEV.done?undefined:((Math.floor(t*3))%2===0)});
    txt(ctx,'오늘의 조명 감독',x+w/2,y+48,{size:30,align:'center',font:FT,fill:'#ffd98a',sw:6,stroke:'#2a0a14'});
    ctx.save(); ctx.strokeStyle='rgba(255,214,140,.5)'; ctx.setLineDash([10,8]); ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(x+90,y+150); ctx.lineTo(x+w-90,y+150); ctx.stroke(); ctx.restore();
    if(NAMEV.done){ const name=G.name, n=Math.min(name.length,Math.floor(NAMEV.lit)); txt(ctx,name.slice(0,n),x+w/2,y+132,{size:56,align:'center',font:FB,fill:'#fff6c8',sw:6,stroke:'#7a3a0a'}); }
    /* 확인 북 */
    drumBtn(ctx,x+w-10,y+h+40,34,'ok',{label:'확인'}); },
  drawHud(t){},
  confirm(){ const v=$('nameIn').value.trim().replace(/\s+/g,' ').slice(0,8); G.name=v||'꼬마 감독'; SAVE.name=G.name; storeSave(); $('nameIn').style.display='none'; NAMEV.done=true; NAMEV.lit=0;
    for(let i=0;i<G.name.length;i++) setTimeout(()=>SFX.bulb(i),i*125); setTimeout(()=>{ SFX.cheer(); G.wave=1; say((G.name+' 감독님')+', 반가워요! 이제 막을 골라 볼까요?',{good:true}); setRMFace('happy',2); },G.name.length*125+150);
    setTimeout(()=>irisTo(()=>goScene('ladder')),G.name.length*125+1900); },
  down(p){ if(NAMEV.done) return; const x=SC.x+70, y=SC.y+130, w=SC.w-140, h=190; if(Math.hypot(p.x-(x+w-10),p.y-(y+h+40))<44){ SFX.click(); SCN.name.confirm(); return; } try{ $('nameIn').focus(); }catch(e){} },
  key(e){ return false; }
};
$('nameIn').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); audioInit(); SFX.click(); if(G.scene==='name'&&!NAMEV.done) SCN.name.confirm(); } });
$('nameIn').addEventListener('pointerdown',e=>{ e.stopPropagation(); audioInit(); });

/* ───── 줄사다리: 높이 올라갈수록 어려운 막 ───── */
const LAD={t:0,plat:[],pick:-1,climb:0};
function ladderLayout(){ const x0=SC.x+SC.w/2; return [ {act:1,x:x0-170,y:SC.y+SC.h-62}, {act:2,x:x0+150,y:SC.y+SC.h/2+6}, {act:3,x:x0-120,y:SC.y+78} ]; }
SCN.ladder={ hud:['sound','gear'], pausable:false,
  enter(){ LAD.t=0; LAD.pick=-1; LAD.climb=0; LAD.plat=ladderLayout(); DARK.k=0; say((G.name?(G.name+' 감독님')+', ':'')+'어느 막을 볼까요? 줄사다리 발판을 눌러 주세요. 위로 갈수록 어려운 막이에요.'); setRMFace('normal',0); RM.point=1; RM.pointT=3; },
  update(dt){ LAD.t+=dt; if(LAD.pick>=0){ LAD.climb+=dt; } },
  draw(t){ /* 막 위에 걸린 줄사다리 */
    const P=LAD.plat, x0=SC.x+SC.w/2;
    ctx.save(); ctx.strokeStyle='#d8c19a'; ctx.lineWidth=5; ctx.lineCap='round';
    for(const s of [-1,1]){ ctx.beginPath(); ctx.moveTo(x0+s*28,SC.y-8); for(let y=SC.y;y<=SC.y+SC.h+10;y+=12) ctx.lineTo(x0+s*28+Math.sin(y*.04+t*1.2)*4,y); ctx.stroke(); }
    ctx.lineWidth=6; for(let y=SC.y+30;y<SC.y+SC.h;y+=34){ ctx.strokeStyle='#b98a52'; ctx.beginPath(); ctx.moveTo(x0-28+Math.sin(y*.04+t*1.2)*4,y); ctx.lineTo(x0+28+Math.sin(y*.04+t*1.2)*4,y); ctx.stroke(); }
    ctx.restore();
    for(const p of P){ ctx.save(); ctx.strokeStyle='rgba(216,193,154,.8)'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(x0,p.y); ctx.lineTo(p.x,p.y); ctx.stroke(); ctx.restore(); } },
  drawFront(t){ const PL=LAD.plat, unlocked=SAVE.unlocked||1;
    PL.forEach((p,i)=>{ const A=ACTS[p.act-1], lock=p.act>unlocked, w=300, h=92, x=p.x-w/2, y=p.y-h/2, hover=Math.hypot(PTR.x-p.x,PTR.y-p.y)<120&&!lock;
      ctx.save(); ctx.translate(0,hover?-3:0);
      cel(ctx,s=>rr(s,x+14,y+h-6,w-28,16,6),'#9a6a3a',{s:3,h:2,ow:2.5});
      marquee(ctx,x,y,w,h,t,{step:20,lit:lock?false:undefined,base:lock?'#4a3d5c':'#8e1a31'});
      txt(ctx,A.title,x+22,y+40,{size:28,font:FT,fill:lock?'#9a8aa8':'#fff3d6',sw:6,stroke:'#2a0a14'});
      txt(ctx,A.sub,x+22,y+70,{size:20,fill:lock?'#7a6a88':'#ffd98a'});
      const best=(SAVE.best&&SAVE.best[p.act])||0; for(let k=0;k<3;k++) starIcon(ctx,x+w-80+k*26,y+30,10,best>=[10,20,27][k]);
      txt(ctx,best?best+'/30':'',x+w-54,y+70,{size:19,align:'center',fill:'#ffe08a'});
      if(lock){ ctx.save(); ctx.strokeStyle='#d8c19a'; ctx.lineWidth=6; ctx.beginPath(); ctx.moveTo(x+10,y+10); ctx.lineTo(x+w-10,y+h-10); ctx.moveTo(x+w-10,y+10); ctx.lineTo(x+10,y+h-10); ctx.stroke();
        cel(ctx,s=>circ(s,x+w/2,y+h/2,16),'#b98a52',{s:2,h:2,ow:2.5}); txt(ctx,'앞 막을 마치면 열려요',x+w/2,y+h+34,{size:19,align:'center',fill:'#fff3d6',sw:4,stroke:P.ink}); ctx.restore(); }
      ctx.restore(); }); },
  drawHud(t){ /* 곡예사 옷(별을 모으면 열림): 앞줄 관객 머리보다 앞에 그린다 */
    drawTray(); const total=[1,2,3].reduce((s,a)=>s+((SAVE.best&&SAVE.best[a])||0),0);
    txt(ctx,'곡예사 옷',TRAY.x+20,TRAY.y+36,{size:23,font:FT,fill:'#ffe08a',sw:4,stroke:P.ink}); txt(ctx,'모은 별 '+total,TRAY.x+20,TRAY.y+70,{size:21,fill:'#fff3d6'});
    COSTUMES.forEach((c,i)=>{ const need=[0,25,50,80][i], open=total>=need, cx=TRAY.x+156+i*56, cy=TRAY.y+46, sel=AC.costume===i;
      cel(ctx,s=>circ(s,cx,cy,20),open?c.c:'#4a3d5c',{s:3,h:2,ow:2.5}); if(open) cel(ctx,s=>star5(s,cx,cy,8,.5),c.c2,{s:1,h:1,ow:1.5});
      if(sel){ ctx.save(); ctx.strokeStyle='#fff3b0'; ctx.lineWidth=3; ctx.beginPath(); circ(ctx,cx,cy,26); ctx.stroke(); ctx.restore(); }
      if(!open) txt(ctx,'별 '+need,cx,cy+44,{size:19,align:'center',fill:'#e6d6f5',sw:3,stroke:P.ink}); }); },
  acrobat:true,
  down(p){ if(LAD.pick>=0) return;
    const total=[1,2,3].reduce((s,a)=>s+((SAVE.best&&SAVE.best[a])||0),0);
    for(let i=0;i<COSTUMES.length;i++){ const cx=TRAY.x+156+i*56, cy=TRAY.y+46; if(Math.hypot(p.x-cx,p.y-cy)<26){ const need=[0,25,50,80][i]; if(total>=need){ AC.costume=i; SAVE.costume=i; storeSave(); SFX.pick(); AC.face='happy'; } else { SFX.unpick(); toast(`별을 ${need}개 모으면 열려요`,1.8); } return; } }
    for(const pl of LAD.plat){ if(Math.abs(p.x-pl.x)<150&&Math.abs(p.y-pl.y)<50){ if(pl.act>(SAVE.unlocked||1)){ SFX.unpick(); say('앞 막을 먼저 마치면 이 발판이 열려요!'); setRMFace('think',1.5); return; }
        LAD.pick=pl.act; SFX.pick(); SFX.whoosh(); startPerf({type:'land',poly:null,at:[pl.x,pl.y-30]},true); PERF.dur=1.4; setTimeout(()=>irisTo(()=>goScene('play',{act:pl.act,idx:0}),pl.x,pl.y),1150); return; } } },
  key(e){ const n=parseInt(e.key,10); if(n>=1&&n<=3){ const pl=LAD.plat.find(q=>q.act===n); SCN.ladder.down({x:pl.x,y:pl.y}); return true; } return false; }
};

/* ───── 결과: 공연 프로그램 책자(DOM, 종이) ───── */
function fmtTime(s){ s=Math.round(s); return Math.floor(s/60)+'분 '+String(s%60).padStart(2,'0')+'초'; }
function plainText(s){ return String(s).replace(/[{}\[\]]/g,'').replace(/\n/g,' '); }
function statIcon(kind){ const c=document.createElement('canvas'); c.width=84; c.height=84; const g=c.getContext('2d'); g.setTransform(2,0,0,2,0,0); g.lineJoin='round'; g.lineCap='round';
  if(kind==='star') starIcon(g,21,22,16,true);
  if(kind==='first'){ cel(g,s=>circ(s,21,21,15),'#3cc47a',{s:2,h:2,ow:2.2}); g.strokeStyle='#fff'; g.lineWidth=4; g.beginPath(); g.moveTo(13,21); g.lineTo(19,27); g.lineTo(29,15); g.stroke(); }
  if(kind==='rate'){ cel(g,s=>circ(s,21,21,15),'#4b8dff',{s:2,h:2,ow:2.2}); g.fillStyle='#fff'; g.beginPath(); g.moveTo(21,21); g.arc(21,21,10,-Math.PI/2,Math.PI*1.1); g.closePath(); g.fill(); }
  if(kind==='time'){ cel(g,s=>circ(s,21,21,15),'#f6e8c8',{s:2,h:2,ow:2.2}); g.strokeStyle=P.ink; g.lineWidth=2.6; g.beginPath(); g.moveTo(21,21); g.lineTo(21,12); g.moveTo(21,21); g.lineTo(28,24); g.stroke(); }
  if(kind==='aud') ticketIcon(g,21,21,1.05);
  if(kind==='combo'){ cel(g,s=>star5(s,15,22,10,.5),'#ff8fb0',{s:1.5,h:1,ow:2}); cel(g,s=>star5(s,28,18,8,.5),'#9fe2ff',{s:1.5,h:1,ow:2}); }
  return c; }
function starBar(n){ const c=document.createElement('canvas'); c.width=300; c.height=56; const g=c.getContext('2d'); g.setTransform(2,0,0,2,0,0);
  g.fillStyle='rgba(60,30,20,.25)'; g.beginPath(); rr(g,2,7,146,14,7); g.fill(); g.fillStyle=lin(g,0,0,150,0,[[0,'#ffd24a'],[1,'#ff8a3d']]); g.beginPath(); rr(g,2,7,146*Math.min(1,n/30),14,7); g.fill();
  g.strokeStyle=P.ink; g.lineWidth=2; g.beginPath(); rr(g,2,7,146,14,7); g.stroke(); return c; }
SCN.results={ hud:['sound','gear'], pausable:false, acrobat:false,
  enter(arg){ const act=arg.act; this.act=act; const list=ITEMS.filter(it=>it.act===act), recs=list.map(it=>G.rec[it.id]).filter(Boolean);
    const first=recs.filter(r=>r.tries===1).length, tries=recs.reduce((s,r)=>s+r.tries,0), stars=recs.reduce((s,r)=>s+r.stars,0), time=G.t-G.actStart;
    let best=0,run=0; for(const it of list){ const r=G.rec[it.id]; if(r&&r.tries===1){ run++; best=Math.max(best,run); } else run=0; }
    $('rTitle').textContent=ACTS[act-1].title+' 공연 기록'; $('rSub').textContent=(G.name?G.name+' 감독님':'조명 감독님')+'의 공연 프로그램';
    const S=[['star','얻은 별',stars+' / 30'],['first','한 번에 맞힘',first+' / 10'],['rate','정답률',Math.round(list.length/Math.max(1,tries)*100)+'%'],['time','걸린 시간',fmtTime(time)],['aud','관객 수',Math.round(G.audience)+'명'],['combo','연속 한 번에',best+'번']];
    const st=$('rStats'); st.innerHTML=''; for(const [ic,lab,val] of S){ const d=document.createElement('div'); d.className='st'; d.appendChild(statIcon(ic)); d.insertAdjacentHTML('beforeend',`<b>${val}</b><span>${lab}</span>`); st.appendChild(d); }
    const ac=$('rActs'); ac.innerHTML=''; for(const A of ACTS){ const b=(SAVE.best&&SAVE.best[A.n])||0; const d=document.createElement('div'); d.className='act'; d.insertAdjacentHTML('beforeend',`<span style="width:150px">${A.title}</span>`); d.appendChild(starBar(b)); d.insertAdjacentHTML('beforeend',`<span>최고 ${b}/30</span>`); ac.appendChild(d); }
    $('rBest').textContent=G.newBest?'새 최고 기록이에요! 별 '+stars+'개':(stars===30?'모든 신청서를 한 번에 해냈어요!':'');
    const word=stars>=27?'관객이 모두 일어나 박수를 쳐요! 오늘의 조명은 최고였어요.':stars>=20?'멋진 공연이었어요! 오답 노트를 한 번 더 살펴보면 다음엔 별을 더 모을 수 있어요.':'괜찮아요! 오답 노트로 실마리를 다시 보고 한 번 더 도전해 봐요.';
    $('rWord').innerHTML='<b>단장 벙글:</b>'+word; $('rSeal').innerHTML=stars>=24?'브라보!':stars>=15?'좋은<br>공연':'다시<br>도전!';
    const notes=$('rNotes'); notes.innerHTML=''; const wrong=list.filter(it=>G.rec[it.id]&&G.rec[it.id].tries>1);
    if(!wrong.length) notes.innerHTML='<div class="none">틀린 신청서가 없어요. 완벽한 공연이었어요!</div>';
    for(const it of wrong){ const r=G.rec[it.id]; const d=document.createElement('div'); d.className='nt';
      d.innerHTML=`<div class="q"><span class="tag">${it.src}</span>${plainText(it.req)}</div><div class="me">내 답: ${r.answers.slice(0,-1).map(a=>plainText(a)).join(' / ')}</div><div class="ok">정답: ${plainText(it.ans)}</div><div class="ex">${plainText(it.exp)}</div>`; notes.appendChild(d); }
    const bt=$('rBtns'); bt.innerHTML='';
    const mk=(label,cls,fn)=>{ const b=document.createElement('button'); b.className='btn '+cls; b.textContent=label; b.addEventListener('click',e=>{ e.stopPropagation(); SFX.click(); fn(); }); bt.appendChild(b); };
    if(act<3) mk('다음 막으로','gold',()=>{ $('results').classList.remove('on'); irisTo(()=>goScene('play',{act:act+1,idx:0})); });
    mk('막 고르기','',()=>{ $('results').classList.remove('on'); irisTo(()=>goScene('ladder')); });
    mk(act<3?'다시 하기':'처음부터','blue',()=>{ $('results').classList.remove('on'); irisTo(()=>goScene('play',{act:act<3?act:1,idx:0})); });
    $('results').classList.add('on'); confetti(stars>=24?90:50); SFX.cheer(); setRMFace('happy',3); RM.point=1; RM.pointT=99; G.wave=1.5; PERF.on=false; PERF.stay=false;
    /* 오답 노트가 넘치면 아래에 '더 있어요' 표시 */
    const nt=$('rNotes'), upd=()=>$('rMore').classList.toggle('on',nt.scrollHeight-nt.scrollTop-nt.clientHeight>6); nt.onscroll=upd; nt.scrollTop=0; requestAnimationFrame(upd); },
  leave(){ $('results').classList.remove('on'); RM.point=0; RM.pointT=0; },
  draw(t){},
  drawHud(t){ /* 책 오른쪽: 곡예사가 단장 모자 위에 올라서서 인사한다(서커스 묘기) — 단장 위에 그린다 */
    const x=RM.x-4, feet=RM.y-398*RM.s+Math.sin(t*2.1)*1.4, sc=1.1, y=feet-50*sc;
    drawPinSpot(x,y,t,.7); const bow=Math.floor(t/1.4)%2===1;
    drawAcrobatFX(ctx,t,{x,y,scale:sc,pose:bow?'bow':'stand',face:'happy'},{shadow:0,contact:false,rim:'#fff2c0'}); }
};

/* 결과 화면 받침대: 진홍·크림 줄무늬 원통(셀음영 + 잉크 외곽선) */
function drawPedestal(g,x,y,t){ const rx=58, ry=16, h=56;
  g.save(); g.fillStyle='rgba(6,2,16,.45)'; g.beginPath(); el(g,x+8,y+h+6,rx+8,ry,0); g.fill();
  g.beginPath(); g.moveTo(x-rx,y); g.lineTo(x-rx,y+h); g.ellipse(x,y+h,rx,ry,0,Math.PI,0,false); g.lineTo(x+rx,y); g.closePath(); g.save(); g.clip();
  for(let i=-6;i<6;i++){ g.fillStyle=i%2?'#b8233c':'#f1dfbf'; g.beginPath(); g.moveTo(x+i*22,y-4); g.lineTo(x+i*22+22,y-4); g.lineTo(x+i*22+10,y+h+ry+4); g.lineTo(x+i*22-12,y+h+ry+4); g.closePath(); g.fill(); }
  g.fillStyle=lin(g,x-rx,0,x+rx,0,[[0,'rgba(255,230,190,.28)'],[.35,'rgba(255,255,255,0)'],[1,'rgba(30,14,60,.42)']]); g.fillRect(x-rx,y-4,rx*2,h+ry+8); g.restore();
  g.strokeStyle=P.ink; g.lineWidth=3; g.stroke();
  cel(g,s=>el(s,x,y,rx,ry,0),'#e8b44c',{s:3,h:2,ow:3});
  g.restore(); }
function drawMoreArrow(){ const c=document.querySelector('#rMore canvas'); if(!c) return; const g=c.getContext('2d'); g.setTransform(2,0,0,2,0,0); g.lineJoin='round'; g.lineCap='round';
  cel(g,s=>{ s.moveTo(4,6); s.lineTo(22,6); s.lineTo(13,18); s.closePath(); },'#b8233c',{s:2,h:1.5,ow:2.5}); }

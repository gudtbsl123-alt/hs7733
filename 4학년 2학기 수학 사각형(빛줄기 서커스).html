#cv{position:absolute;left:0;top:0;width:1280px;height:720px;display:block;touch-action:none}
.layer{position:absolute;left:0;top:0;width:1280px;height:720px;pointer-events:none}
.paper{position:absolute;word-break:keep-all;overflow-wrap:break-word;color:#3a2414;font-family:"DH",sans-serif;background-color:#f6e8c8;background-image:var(--paper);background-size:256px 256px;border:3px solid #1a1030;border-radius:6px 9px 7px 10px;box-sizing:border-box}
/* 객석 신청서(문제) — 밧줄 집게에 물린 종이 */
#note{left:994px;top:106px;width:270px;padding:30px 16px 24px 18px;font-size:25px;line-height:1.38;transform-origin:50% 0;pointer-events:auto;cursor:pointer;opacity:0;transition:opacity .25s;border-bottom:0}
#note.on{opacity:1}
#note .head{display:flex;align-items:center;gap:6px;font-size:18px;color:#8a3b2a;letter-spacing:1px;margin:-8px 0 4px}
#note .head i{flex:1;height:2px;background:repeating-linear-gradient(90deg,#c7a27a 0 6px,transparent 6px 10px)}
#note .fold{position:absolute;left:0;right:0;top:46%;height:2px;background:linear-gradient(90deg,transparent,rgba(120,80,40,.18) 20%,rgba(120,80,40,.18) 80%,transparent)}
#note .fold2{position:absolute;top:0;bottom:0;left:50%;width:2px;background:linear-gradient(180deg,transparent,rgba(120,80,40,.14) 20%,rgba(120,80,40,.14) 80%,transparent)}
#note .pin{position:absolute;left:50%;top:-34px;margin-left:-22px;width:44px;height:56px}
#note .more{display:none;margin-top:6px;font-size:18px;color:#8a3b2a;text-align:right}
#note.long .more{display:block}
#noteText{position:relative}
#note svg.torn{position:absolute;left:-3px;bottom:0;width:calc(100% + 6px);height:16px;overflow:visible;pointer-events:none}
.hl{color:#c2410c;background:linear-gradient(transparent 58%,rgba(255,196,64,.55) 58%,rgba(255,196,64,.55) 92%,transparent 92%);padding:0 1px}
.ul{color:#1d4ed8}
/* 크게 보기 */
#zoom{position:absolute;left:0;top:0;width:1280px;height:720px;background:rgba(8,4,20,.72);display:none;align-items:center;justify-content:center;pointer-events:auto}
#zoom.on{display:flex}
#zoom .paper{position:relative;width:640px;padding:34px 40px 30px;font-size:32px;line-height:1.5}
#zoom .x{display:block;margin-top:18px;font-size:22px;color:#8a3b2a;text-align:right}
/* 이름 쓰기: 전구 간판 위에 겹치는 실제 입력칸(테두리·배경 없음) */
#nameIn{position:absolute;left:386px;top:318px;width:420px;height:70px;border:0;outline:0;background:transparent;color:#fff6c8;font-family:"DH",sans-serif;font-size:50px;text-align:center;caret-color:#ffd24a;display:none;pointer-events:auto;text-shadow:0 0 10px rgba(255,200,80,.9),0 0 3px #ffb02e;letter-spacing:2px}
#nameIn::placeholder{color:rgba(255,230,170,.38)}
/* 쉬는 시간·설정·결과 — 종이·책 재질 */
.panel{position:absolute;pointer-events:auto;display:none}
.panel.on{display:block}
.sheet{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-.6deg);padding:26px 34px 30px;font-size:25px}
.sheet h2{margin:0 0 14px;font-family:"BHS","DH",sans-serif;font-weight:normal;font-size:44px;color:#b8233c;text-align:center;letter-spacing:1px;-webkit-text-stroke:2px #2a1630;paint-order:stroke fill}
.dim{position:absolute;inset:0;background:rgba(6,3,16,.66)}
.row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:150px;height:62px;padding:0 22px;font-family:"DH",sans-serif;font-size:27px;color:#fff6e0;border:3px solid #2a1630;border-radius:31px;background:linear-gradient(180deg,#e2475d 0%,#b8233c 55%,#8e1a31 100%);cursor:pointer;text-shadow:0 2px 0 #5a0f20;letter-spacing:1px;transition:transform .06s}
.btn:before{content:"";position:absolute;left:10px;right:10px;top:5px;height:40%;border-radius:20px;background:linear-gradient(180deg,rgba(255,255,255,.38),rgba(255,255,255,0))}
.btn.gold{color:#4a2608;text-shadow:0 1px 0 #ffe9a8;background:linear-gradient(180deg,#ffe08a 0%,#e8b44c 55%,#b9802a 100%)}
.btn.blue{background:linear-gradient(180deg,#5b8cff 0%,#3157c9 55%,#22399a 100%);text-shadow:0 2px 0 #142363}
.btn:active,.btn.down{transform:translateY(3px)}
.btn canvas{width:30px;height:30px}
.tg{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:10px 4px;border-bottom:2px dashed rgba(120,80,40,.35)}
.sw{position:relative;width:96px;height:46px;border:3px solid #2a1630;border-radius:24px;background:#6b5a7a;cursor:pointer;flex:none}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:34px;height:34px;border-radius:50%;border:3px solid #2a1630;background:radial-gradient(circle at 35% 30%,#fff7d0,#e8b44c 60%,#a8701e);transition:left .15s}
.sw.on{background:#2fae6e}
.sw.on:after{left:49px}
.sw-l{font-size:19px;color:#7a5236}
/* 결과: 공연 프로그램 책자 */
#results .book{position:absolute;left:50%;top:50%;width:1060px;height:640px;transform:translate(-50%,-50%);display:flex;gap:0}
#results .pg{position:relative;flex:1;padding:24px 30px 20px;overflow:hidden}
#results .pg.l{border-radius:12px 4px 4px 12px;border-right-width:1px}
#results .pg.r{border-radius:4px 12px 12px 4px;border-left-width:1px;display:flex;flex-direction:column}
#results h3{margin:0;font-family:"BHS","DH",sans-serif;font-weight:normal;font-size:40px;color:#b8233c;-webkit-text-stroke:2px #2a1630;paint-order:stroke fill;letter-spacing:1px}
#results .sub{font-size:20px;color:#8a5a3a;margin:2px 0 12px}
#results .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
#results .st{position:relative;padding:8px 12px 8px 58px;border:2px solid rgba(90,50,30,.45);border-radius:10px;background:rgba(255,255,255,.28);min-height:56px}
#results .st canvas{position:absolute;left:8px;top:50%;margin-top:-21px;width:42px;height:42px}
#results .st b{display:block;font-family:"BHS","DH",sans-serif;font-weight:normal;font-size:30px;color:#2a1630;line-height:1.1}
#results .st span{font-size:18px;color:#7a5236}
#results .acts{margin-top:12px;display:flex;flex-direction:column;gap:6px}
#results .act{display:flex;align-items:center;gap:10px;font-size:21px}
#results .act canvas{width:150px;height:28px}
#results .best{margin-top:8px;font-size:21px;color:#0f7a4a;min-height:28px}
#results .notes{flex:1;overflow-y:auto;padding-right:8px;margin-top:6px;pointer-events:auto;touch-action:pan-y}
#results .nt{padding:10px 12px;margin-bottom:10px;border:2px solid rgba(90,50,30,.35);border-radius:10px;background:rgba(255,255,255,.3);font-size:21px;line-height:1.4}
#results .nt .q{color:#2a1630}
#results .nt .tag{display:inline-block;font-size:16px;color:#fff;background:#8a3b2a;border-radius:8px;padding:1px 8px;margin-right:6px;vertical-align:2px}
#results .nt .me{color:#b8233c}
#results .nt .ok{color:#0f7a4a}
#results .nt .ex{color:#5a3a26;font-size:20px}
#results .none{font-size:24px;color:#0f7a4a;padding:20px 0}
#results .row{margin-top:10px}
#toast{position:absolute;left:50%;top:84px;transform:translateX(-50%);padding:8px 22px;font-size:22px;opacity:0;transition:opacity .3s}
#toast.on{opacity:1}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>
  <div class="layer" id="ui">
    <div id="note" class="paper"><canvas class="pin" width="88" height="112"></canvas><div class="fold"></div><div class="fold2"></div><div class="head">객석 신청서<i></i></div><div id="noteText"></div><div class="more">눌러서 크게 보기</div></div>
    <div id="toast" class="paper"></div>
    <input id="nameIn" maxlength="8" autocomplete="off" spellcheck="false" placeholder="이름">
    <div id="zoom"><div class="paper"><div id="zoomText"></div><span class="x">아무 곳이나 누르면 닫혀요</span></div></div>
    <div id="pause" class="panel layer"><div class="dim"></div><div class="paper sheet" style="width:520px">
      <h2>쉬는 시간</h2>
      <div style="text-align:center;font-size:23px;color:#7a5236;margin-bottom:6px">공연이 잠깐 멈췄어요</div>
      <div class="row"><button class="btn gold" data-act="resume">계속하기</button></div>
      <div class="row"><button class="btn" data-act="ladder">막 고르기</button><button class="btn blue" data-act="title">처음 화면</button></div>
    </div></div>
    <div id="settings" class="panel layer"><div class="dim"></div><div class="paper sheet" style="width:560px">
      <h2>무대 감독 수첩</h2>
      <div class="tg"><span>효과음</span><span class="sw-l" id="swSoundL">켜짐</span><div class="sw" id="swSound"></div></div>
      <div class="tg"><span>가벼운 화면(저사양)</span><span class="sw-l" id="swLowL">꺼짐</span><div class="sw" id="swLow"></div></div>
      <div class="tg" style="border:0"><span>하는 법 다시 보기</span><button class="btn gold" data-act="howto" style="min-width:120px;height:52px;font-size:23px">보기</button></div>
      <div class="row"><button class="btn" data-act="closeSettings">닫기</button></div>
    </div></div>
    <div id="results" class="panel layer"><div class="dim"></div><div class="book">
      <div class="paper pg l">
        <h3 id="rTitle">오늘의 공연 기록</h3>
        <div class="sub" id="rSub"></div>
        <div class="stats" id="rStats"></div>
        <div class="acts" id="rActs"></div>
        <div class="best" id="rBest"></div>
      </div>
      <div class="paper pg r">
        <h3 style="font-size:34px">오답 노트</h3>
        <div class="sub">틀렸던 신청서를 다시 살펴봐요</div>
        <div class="notes" id="rNotes"></div>
        <div class="row" id="rBtns"></div>
      </div>
    </div></div>
  </div>
</div>
<script>
/* ── 01_core.js ── */
'use strict';
/* ══════════════════════════════════════════════════════════════════════
   빛줄기 서커스 — 4학년 2학기 수학 4. 사각형
   조건: HTML 파일 하나 · 인터넷 없이 실행 · 그림은 전부 코드 · 이모지 0개 · 글꼴은 OFL 글꼴을 쓰는 글자만 넣음

   아트 바이블 — 빛줄기 서커스
   1. 장르·시점·카메라: 빛 겹치기 퍼즐 공연 · 천막 안 정면 무대(별 모눈 막이 무대 한가운데) · 카메라 숨쉬기 ±8px
      (뒤 천막·객석·앞줄 관객만 서로 다른 시차로 움직이고, 조작하는 무대 막은 고정), 정답 때 겹친 자리로 살짝 확대
   2. 렌더링 방식·기준작: 어두운 바탕 + 빛 더하기(네온·빛 번짐) 위에 셀음영 캐릭터 · 오리와 눈먼 숲의 빛 번짐,
      리듬 세상의 무대 연출
   3. 빛: 왼쪽 기둥 위 트러스에 물린 호박색 작업등 하나가 주광원(모든 물체의 왼쪽 위가 밝음), 그늘은 남보라 쪽.
      작업등의 따뜻한 빛은 막(퍼즐 판)을 빼고 링·기둥·단장에만 닿는다(막 위의 빛은 색 조명뿐).
      빨강·초록·파랑 색 조명은 '효과 빛'으로 더하기 합성(겹치면 자홍·노랑·청록·흰빛)
   4. 외곽선: 앞쪽 물체(단장·곡예사·조명 기구·삼각자·북 단추·쇼 북·간판)와 무대 구조물(기둥·트러스)만 #1a1030 2.5~3px,
      천막 지붕·먼 객석·밧줄·커튼은 선 없음
   5. 음영: 바탕·그늘·빛 3단 + 접지 그림자, 놋쇠·전구는 하이라이트 점, 원통(기둥·조명통)은 굽은 방향 5단 그라데이션,
      빛줄기는 밝은 가장자리선 + 반투명 속 + 떠다니는 먼지
   6. 팔레트: 밤 남보라(#120a26·#241848) / 천막 진홍(#b8233c)·크림(#f1dfbf) 줄무늬 / 놋쇠 금(#e8b44c) /
      빛 삼원색 빨강 #ff4d6a · 초록 #3cff9e · 파랑 #4b8dff
   7. 질감·디테일: 천막 천 결 노이즈, 막의 별 모눈, 큰 것(기둥·트러스·그물)·중간(조명·북·사다리·그네)·
      작은 것(전구·팝콘·반짝이·먼지) 3단계
   8. 깊이: 천막 지붕 → 뒤 객석 불빛 → 별 모눈 막 → 트러스·기둥·밧줄·그네 → 조명 기구·빛줄기 → 단장·곡예사
      → 떠다니는 연기 → 흐린 앞줄 관객 머리·야광봉 (8겹)
   9. 글꼴·UI 재질: 제목·큰 숫자 Black Han Sans(두꺼운 외곽선 + 돌출), 본문 Do Hyeon / 북(드럼) 단추 ·
      전구 간판(마키) · 크림 신청서 종이(기울어 흔들림, 찢긴 끝까지 외곽선) · 놋쇠 명판 · 전구 칩(각도) ·
      빨간 잉크 도장 · 쇼 북(답 내기)
   10. 캐릭터: 단장 너구리 '벙글'(2.3등신, 화면 높이 약 2/5, 숨쉬기·깜빡임·지팡이 손짓, 표정 5종),
       곡예사 하늘다람쥐 '날래'(그네 흔들기·활공·착지·인사, 표정 4종)

   화면 틀 — 빛줄기 서커스
   타이틀:        캄캄한 천막에서 조명 세 대가 차례로 켜지고 빛이 겹친 자리에서 곡예사가 묘기를 시작한다.
                   로고는 왼쪽 위에 매달린 작은 전구 간판, 오른쪽 밧줄에 매달린 전구 글자판 '눌러서 입장!'을
                   단장이 가리킨다(아무 곳이나 눌러 입장)
   스테이지 선택:  막 위에 걸린 줄사다리의 발판 3개(높을수록 어려운 막) — 곡예사가 사다리를 타고 오른다
   문제 제시:      객석에서 날아온 종이비행기 신청서가 밧줄 집게에 물린다(누르면 크게)
   답 입력:        조명 손잡이 끌어 돌리기·폭 조절 / 삼각자 대고 레이저 긋기 / 빛 그림 눌러 켜기 /
                   각도 바퀴·줄 감개 돌리기 → 왼쪽 아래 큰 쇼 북 치기
   정답 연출:      곡예사가 빛 자리 윗변에 올라서고, 평행한 변(같은 색)·길이가 같은 변(눈금)·직각 표시가 차례로
                   빛난다. 사각형 이름 도장은 왼쪽 커튼 앞 종이에 찍혀 다음 신청서까지 남는다
   ══════════════════════════════════════════════════════════════════════ */

const W=1280,H=720,TAU=Math.PI*2,DEG=Math.PI/180;
const QS=new URLSearchParams(location.search);
const SAVE_KEY='jangdo-light-circus-v1';
function loadSave(){ try{ const s=JSON.parse(localStorage.getItem(SAVE_KEY)||'{}'); return (s&&typeof s==='object')?s:{}; }catch(e){ return {}; } }
function storeSave(){ try{ localStorage.setItem(SAVE_KEY,JSON.stringify(SAVE)); }catch(e){} }
let SAVE=loadSave();
let LOW=QS.get('low')==='1'||(QS.get('low')!=='0'&&!!SAVE.low);
let DPR=1;
const cv=document.getElementById('cv');
let ctx=cv.getContext('2d');
/* 저사양: 그리기 결과를 작은 캔버스에 담아 두고, 열쇠가 바뀌거나 every 프레임이 지나면 다시 그린다(그사이엔 붙여 넣기만) */
let FRAME=0, INPUT_GEN=0; const CACHE={};
function cached(id,x,y,w,h,key,every,drawFn){ let C=CACHE[id];
  if(!C){ C=CACHE[id]={c:document.createElement('canvas'),key:null,f:-99}; C.g=C.c.getContext('2d'); }
  if(C.c.width!==w||C.c.height!==h){ C.c.width=w; C.c.height=h; C.key=null; }
  if(C.key!==key||FRAME-C.f>=every){ const g=C.g; g.setTransform(1,0,0,1,0,0); g.clearRect(0,0,w,h); g.setTransform(1,0,0,1,-x,-y); g.lineJoin='round'; g.lineCap='round'; g.globalAlpha=1; g.globalCompositeOperation='source-over';
    const keep=ctx; ctx=g; try{ drawFn(); } finally{ ctx=keep; } C.key=key; C.f=FRAME; }
  ctx.drawImage(C.c,x,y,w,h); }
function setDPR(){ DPR=LOW?1:Math.min(2,window.devicePixelRatio||1); cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR); }
setDPR();
let VIEW_SCALE=1;
function fit(){ const s=Math.min(innerWidth/W,innerHeight/H); VIEW_SCALE=s; document.getElementById('stage').style.transform=`translate(-50%,-50%) scale(${s})`; }
addEventListener('resize',fit); fit();

/* ───────── 무대 막(별 모눈) 좌표: 1칸 = 1 m ───────── */
const SC={x:256,y:96,u:34,cols:20,rows:12};
SC.w=SC.u*SC.cols; SC.h=SC.u*SC.rows;
const gx=m=>SC.x+m*SC.u, gy=m=>SC.y+m*SC.u;
const mx=px=>(px-SC.x)/SC.u, my=py=>(py-SC.y)/SC.u;

/* ───────── 색 ───────── */
const P={ ink:'#1a1030', night:'#120a26', night2:'#241848', crimson:'#b8233c', cream:'#f1dfbf', gold:'#e8b44c',
  brass:'#e2a94a', red:'#ff4d6a', green:'#3cff9e', blue:'#4b8dff', paper:'#f6e8c8', fur:'#9a8a86', furD:'#5e4e57', mask:'#3a2c3a',
  coat:'#c4283f', teal:'#21b8b0', violet:'#5a3d8a' };
const LCOL={ r:{c:'#ff4d6a',rgb:[255,77,106],name:'빨강'}, g:{c:'#3cff9e',rgb:[60,255,158],name:'초록'}, b:{c:'#4b8dff',rgb:[75,141,255],name:'파랑'}, w:{c:'#fff2c8',rgb:[255,242,200],name:'흰'} };
function hex(h){ const n=parseInt(h.slice(1),16); return [(n>>16)&255,(n>>8)&255,n&255]; }

const LX=-.62, LY=-.78;
function cel(g,shape,base,o={}){
  const s=o.s??7, h=o.h??5, ow=o.ow??3;

  g.beginPath(); shape(g); g.clip();

  if(h>0){ g.beginPath(); shape(g); g.save(); g.translate(-LX*h,-LY*h); shape(g); g.restore(); g.globalAlpha=o.ha??.85; g.fillStyle=o.hl||HL(base); g.fill('evenodd'); g.globalAlpha=1; }

  g.restore();
}
/* 정적 층용(겹친 원 여러 개로 된 모양도 됨) */
function celL(L,shape,base,o={}){
  const g=L.g, s=o.s??8, h=o.h??6, ow=o.ow??3, T=tmpFor(L);
  g.save();
  if(ow>0){ g.beginPath(); shape(g); g.lineWidth=ow*2; g.strokeStyle=o.ink||P.ink; g.stroke(); }
  g.beginPath(); shape(g); g.fillStyle=base; g.fill(); g.restore();
  const cres=(dx,dy,col,a)=>{ clearL(T); const t=T.g; t.save(); t.beginPath(); shape(t); t.fillStyle=col; t.fill();
    t.globalCompositeOperation='destination-out'; t.translate(dx,dy); t.beginPath(); shape(t); t.fill(); t.restore();
    g.save(); g.setTransform(1,0,0,1,0,0); g.globalAlpha=a; g.drawImage(T.c,0,0); g.restore(); };
  if(s>0) cres(LX*s,LY*s,o.sh||SH(base),o.sa??1);

function makeNoise(n,seed,octs){ const c=document.createElement('canvas'); c.width=c.height=n; const g=c.getContext('2d'); const img=g.createImageData(n,n); const R=rng(seed);

    for(let i=0;i<f;i++) G[i*S+f]=G[i*S]; for(let j=0;j<=f;j++) G[f*S+j]=G[j]; return {f,a,G,S}; });
  for(let y=0;y<n;y++) for(let x=0;x<n;x++){ let v=0;
    for(const {f,a,G,S} of grids){ const fx=x/n*f, fy=y/n*f, ix=fx|0, iy=fy|0, tx=fx-ix, ty=fy-iy, sx=tx*tx*(3-2*tx), sy=ty*ty*(3-2*ty);
      v+=a*((G[iy*S+ix]*(1-sx)+G[iy*S+ix+1]*sx)*(1-sy)+(G[(iy+1)*S+ix]*(1-sx)+G[(iy+1)*S+ix+1]*sx)*sy); }
    const k=(y*n+x)*4, c8=Math.max(0,Math.min(255,v*255)); img.data[k]=img.data[k+1]=img.data[k+2]=c8; img.data[k+3]=255; }
  g.putImageData(img,0,0); return c; }

  const out=document.createElement('canvas'); out.width=src.width; out.height=src.height; const og=out.getContext('2d'); og.imageSmoothingQuality='high'; og.drawImage(cur,0,0,out.width,out.height); return out; }

const AU={ac:null,out:null,muted:!!SAVE.muted,noiseBuf:null,amb:null};
function audioInit(){
  if(AU.ac) { if(AU.ac.state==='suspended') AU.ac.resume(); return; }
  try{
    AU.ac=new (window.AudioContext||window.webkitAudioContext)();
    AU.out=AU.ac.createGain(); AU.out.gain.value=AU.muted?0:.8;
    const comp=AU.ac.createDynamicsCompressor(); comp.threshold.value=-14; comp.ratio.value=4;
    AU.out.connect(comp); comp.connect(AU.ac.destination);
    const n=AU.ac.sampleRate*2, b=AU.ac.createBuffer(1,n,AU.ac.sampleRate), d=b.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=Math.random()*2-1;

    startAmbience();

  if(o.lp){ const f2=ac.createBiquadFilter(); f2.type='lowpass'; f2.frequency.value=o.lp; s.connect(f2); node=f2; }
  node.connect(g); g.connect(o.dest||AU.out); s.start(t); s.stop(t+dur+.05);
  if(o.vib){ const l=ac.createOscillator(), lg=ac.createGain(); l.frequency.value=o.vib[0]; lg.gain.value=o.vib[1]; l.connect(lg); lg.connect(s.frequency); l.start(t); l.stop(t+dur+.05); }

  const f=ac.createBiquadFilter(); f.type=type; f.frequency.setValueAtTime(freq,t); f.Q.value=q;

/* 반평면 n·p <= c 로 볼록 다각형 자르기 */
function clipHalf(pg,n,c){ const out=[]; for(let i=0;i<pg.length;i++){ const a=pg[i], b=pg[(i+1)%pg.length];
  const da=vdot(n,a)-c, db=vdot(n,b)-c; if(da<=1e-9) out.push(a);
  if((da<-1e-9&&db>1e-9)||(da>1e-9&&db<-1e-9)){ const t=da/(da-db); out.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t]); } }
  return out; }
/* 조명 하나가 비추는 영역 = 반평면 여러 개 */
function lightHalfplanes(L){
  const d=dirOf(L.ang), c=[L.px,L.py];
  if(L.type==='band'){ const n=[-d[1],d[0]], nc=vdot(n,c);
    return [[n,nc+L.w/2],[[-n[0],-n[1]],-nc+L.w/2],[[-d[0],-d[1]],-vdot(d,c)]]; }
  if(L.type==='cone'){ const e1=dirOf(L.ang+L.half), e2=dirOf(L.ang-L.half);
    const n1=[e2[1],-e2[0]], n2=[-e1[1],e1[0]];
    return [[n1,vdot(n1,c)],[n2,vdot(n2,c)],[[-d[0],-d[1]],-vdot(d,c)]]; }
  return []; }
function overlapOf(lights,base=SCRIM_POLY){ let pg=base.slice(); for(const L of lights){ for(const [n,c] of lightHalfplanes(L)){ pg=clipHalf(pg,n,c); if(pg.length<3) return []; } } return dedupe(pg); }
function lightPoly(L,box){ return overlapOf([L],box||[[-6,-6],[SC.cols+6,-6],[SC.cols+6,SC.rows+6],[-6,SC.rows+6]]); }
function dedupe(pg,eps=1e-7){ const out=[]; for(const p of pg){ const q=out[out.length-1]; if(!q||Math.hypot(p[0]-q[0],p[1]-q[1])>eps) out.push(p); }
  if(out.length>1&&Math.hypot(out[0][0]-out[out.length-1][0],out[0][1]-out[out.length-1][1])<=eps) out.pop();
  /* 한 줄 위에 있는 꼭짓점 빼기 */
  const res=[]; for(let i=0;i<out.length;i++){ const a=out[(i-1+out.length)%out.length], b=out[i], c=out[(i+1)%out.length];
    if(Math.abs(vcross(vsub(b,a),vsub(c,b)))>1e-9*Math.max(1,vlen(vsub(b,a))*vlen(vsub(c,b)))) res.push(b); }
  return res; }
function touchesEdge(pg){ return pg.some(p=>p[0]<1e-6||p[1]<1e-6||p[0]>SC.cols-1e-6||p[1]>SC.rows-1e-6); }
function polyArea(pg){ let a=0; for(let i=0;i<pg.length;i++){ const p=pg[i],q=pg[(i+1)%pg.length]; a+=p[0]*q[1]-q[0]*p[1]; } return a/2; }
function centroid(pg){ let x=0,y=0,a=0; for(let i=0;i<pg.length;i++){ const p=pg[i],q=pg[(i+1)%pg.length], k=p[0]*q[1]-q[0]*p[1]; a+=k; x+=(p[0]+q[0])*k; y+=(p[1]+q[1])*k; }
  if(Math.abs(a)<1e-9){ return [pg.reduce((s,p)=>s+p[0],0)/pg.length,pg.reduce((s,p)=>s+p[1],0)/pg.length]; } return [x/(3*a),y/(3*a)]; }
/* 사각형 판정: 평행한 변의 쌍 수, 직각 수, 네 변이 같은지, 각 크기 */
function classify(pg){
  const P=dedupe(pg); const n=P.length; const res={n,pts:P};
  if(n!==4) return res;
  const s=[0,1,2,3].map(i=>vsub(P[(i+1)%4],P[i])), L=s.map(vlen);
  const par=(a,b)=>Math.abs(vcross(a,b))<=1e-6*vlen(a)*vlen(b);
  const p02=par(s[0],s[2]), p13=par(s[1],s[3]);
  const ang=[0,1,2,3].map(i=>{ const a=vmul(s[(i+3)%4],-1), b=s[i]; return Math.acos(clamp(vdot(a,b)/(vlen(a)*vlen(b)),-1,1))/DEG; });
  const right=ang.filter(a=>Math.abs(a-90)<1e-4).length;
  const mxL=Math.max(...L), eq=(mxL-Math.min(...L))<=1e-6*mxL;
  res.sides=L; res.angles=ang; res.pairs=(p02?1:0)+(p13?1:0); res.parPairs=[p02,p13]; res.right=right; res.allEqual=eq;
  res.trapezoid=res.pairs>=1; res.parallelogram=res.pairs===2; res.rhombus=res.parallelogram&&eq; res.rectangle=res.parallelogram&&right===4; res.square=res.rhombus&&res.rectangle;
  return res; }
function shapeNames(c){ if(!c||c.n!==4) return []; const out=[]; if(c.trapezoid) out.push('사다리꼴'); if(c.parallelogram) out.push('평행사변형'); if(c.rhombus) out.push('마름모'); if(c.rectangle) out.push('직사각형'); if(c.square) out.push('정사각형'); return out; }
function shapeMain(c){ if(!c||c.n!==4) return c&&c.n?(c.n===3?'삼각형':c.n+'각형'):'빛 자리 없음'; if(c.square) return '정사각형'; if(c.rhombus) return '마름모'; if(c.rectangle) return '직사각형'; if(c.parallelogram) return '평행사변형'; if(c.trapezoid) return '사다리꼴'; return '평행한 변이 없는 사각형'; }
/* 두 직선(점 + 방향)의 교점 */
function lineX(p,d,q,e){ const den=vcross(d,e); if(Math.abs(den)<1e-12) return null; const t=vcross(vsub(q,p),e)/den; return [p[0]+d[0]*t,p[1]+d[1]*t]; }
/* 선분을 막 사각형으로 자르기(직선 전체) */
function lineInBox(p,d,x0=0,y0=0,x1=SC.cols,y1=SC.rows){ let t0=-1e9,t1=1e9;
  for(const [pp,dd,lo,hi] of [[p[0],d[0],x0,x1],[p[1],d[1],y0,y1]]){ if(Math.abs(dd)<1e-12){ if(pp<lo||pp>hi) return null; continue; }
    let a=(lo-pp)/dd, b=(hi-pp)/dd; if(a>b) [a,b]=[b,a]; t0=Math.max(t0,a); t1=Math.min(t1,b); }
  if(t0>t1) return null; return [[p[0]+d[0]*t0,p[1]+d[1]*t0],[p[0]+d[0]*t1,p[1]+d[1]*t1]]; }
function distPointLine(q,p,d){ return Math.abs(vcross(vsub(q,p),vnorm(d))); }
function angBetween(a,b){ let d=Math.abs(((a-b)%180+180)%180); return d; } /* 두 직선이 이루는 각(0~180) */
function segsCross(a,b,c,d){ const o=(p,q,r)=>Math.sign(vcross(vsub(q,p),vsub(r,p))); return o(a,b,c)*o(a,b,d)<0&&o(c,d,a)*o(c,d,b)<0; }
function quadSimple(P){ return !segsCross(P[0],P[1],P[2],P[3])&&!segsCross(P[1],P[2],P[3],P[0]); }
function quadConvex(P){ let s=0; for(let i=0;i<4;i++){ const c=vcross(vsub(P[(i+1)%4],P[i]),vsub(P[(i+2)%4],P[(i+1)%4])); if(Math.abs(c)<1e-9) return false; const sg=Math.sign(c); if(!s) s=sg; else if(sg!==s) return false; } return true; }

function makeHeads(){ const R=rng(777); FOREHEADS=[];

  for(let i=0;i<15;i++){ const k=kinds[i%kinds.length], w=96+R()*30, L=layer(170,190,0,1), g=L.g;
    g.translate(85,190);
    g.fillStyle='#0c0720';
    const hy=-92, r=w*.42;
    g.beginPath(); el(g,0,0,w*.62,70); g.fill();               /* 어깨 */
    g.beginPath(); el(g,0,hy,r,r*.95); g.fill();               /* 머리 */
    if(k==='rabbit'){ g.beginPath(); el(g,-r*.35,hy-r*1.15,r*.2,r*.62,-.12); el(g,r*.35,hy-r*1.15,r*.2,r*.62,.12); g.fill(); }
    if(k==='cat'){ g.beginPath(); g.moveTo(-r*.85,hy-r*.35); g.lineTo(-r*.55,hy-r*1.2); g.lineTo(-r*.15,hy-r*.8); g.moveTo(r*.85,hy-r*.35); g.lineTo(r*.55,hy-r*1.2); g.lineTo(r*.15,hy-r*.8); g.fill(); }

    if(k==='dog'){ g.beginPath(); el(g,-r*.9,hy-r*.1,r*.28,r*.55,.4); el(g,r*.9,hy-r*.1,r*.28,r*.55,-.4); g.fill(); }

    const rim=['#ff4d6a','#4b8dff','#3cff9e','#ffb84a'][i%4];
    g.globalCompositeOperation='source-atop'; g.fillStyle=lin(g,0,hy-r*1.6,0,hy+r*.2,[[0,rgba(rim,.75)],[.35,rgba(rim,.18)],[.6,'rgba(0,0,0,0)']]); g.fillRect(-90,-200,180,200);

/* 빛줄기 그리기(더하기 합성): 공기 속 빛기둥 + 막 위 빛 + 밝은 심 + 연기 + 또렷한 가장자리 + 렌즈 빛 */

    if(L.type==='laser'&&!LOW){ smokeIn(g=>{ for(const [p,dd] of lightEdges(L)){ const s=rayInBox(p,dd,[-8,-8,SC.cols+8,SC.rows+8]); if(!s) continue; const A=toPx(s[0]),B=toPx(s[1]),n=[-dd[1]*9,dd[0]*9]; g.moveTo(A[0]+n[0],A[1]+n[1]); g.lineTo(B[0]+n[0],B[1]+n[1]); g.lineTo(B[0]-n[0],B[1]-n[1]); g.lineTo(A[0]-n[0],A[1]-n[1]); g.closePath(); } },t,.5*k); }

/* 정답 뒤 빛 발판 위 성질 표시: 평행한 변 쌍은 같은 색으로 빛나고, 길이가 같은 변은 같은 눈금, 직각에는 직각 표시 */

/* 각도 칩: 서커스 전구 간판을 줄인 작은 칩(진홍 틀 + 밤색 판 + 위아래 꼬마 전구 + 전구빛 글자) */

/* ───────── 조명 기구 ─────────

/* ── 08c_kinds_more.js ── */
/* ══════════════ 문항 종류 2: 고르기 · 꼬리표 · 각도 바퀴/줄 감개 · 짝짓기 · 꼭짓점 · 외줄 · 삼각자 ══════════════ */
const TRAY={x:268,y:536,w:372,h:112};  /* 막 아래 소품 자리(꼬리표·삼각자·바퀴) */
function drawTray(y=TRAY.y,h=TRAY.h){ const x=TRAY.x, w=TRAY.w; ctx.save(); ctx.fillStyle='rgba(6,2,16,.5)'; ctx.beginPath(); rr(ctx,x+4,y+8,w,h,14); ctx.fill();

/* ───── 2) 고르기: 빛 그림·외줄·레이저 짝·별·표지판을 눌러 켠다 ───── */
KINDS.pick={
  init(it){ const S={it,sel:new Set(),objs:it.make()}; return S; },
  draw(S,t,dt,ph){ const it=S.it; if(it.fig) it.fig(S,t,ph);

/* ───── 3) 꼬리표: 낱말 꼬리표를 빈칸에 끌어다 붙인다 ───── */

        if(i<parts.length-1){ const bw=B.blankW||150; if(x+bw>B.x+B.w-18){ x=B.x+20; y+=46; } S.blanks.push({x:x+4,y:y-32,w:bw,h:42,ans:it.answers[S.blanks.length],tag:-1}); x+=bw+8; } });

  draw(S,t,dt,ph){ if(S.it.fig) S.it.fig(S,t,ph); },

/* ───── 4) 수 맞추기: 각도 바퀴(°)·줄 감개(m)를 돌린다 ───── */
KINDS.value={
  init(it){ const S={it,inp:it.inputs.map((d,i)=>Object.assign({val:d.start??(d.type==='angle'?90:0),set:false,ang:-Math.PI/2,active:false},d))};

  draw(S,t,dt,ph){ if(S.it.fig) S.it.fig(S,t,ph); },
  front(S,t,dt,ph){ if(S.it.front) S.it.front(S,t,ph); },
  hud(S,t){ for(const d of S.inp){ if(d.type==='angle') drawDial(ctx,d,t); else drawReel(ctx,Object.assign(d,{unit:d.unit||'m'}),t); } },
  down(S,p){ for(const d of S.inp){ if(d.type==='angle'){ if(p.y<=d.y+30&&p.y>=d.y-d.r-26&&Math.abs(p.x-d.x)<=d.r+20){ S.drag=d; d.active=true; KINDS.value.move(S,p); return true; } }
      else if(Math.hypot(p.x-d.x,p.y-d.y)<d.r+26){ S.drag=d; d.active=true; d.last=Math.atan2(p.y-d.y,p.x-d.x); d.acc=0; return true; } } return false; },
  move(S,p){ const d=S.drag; if(!d) return;

  up(S){ if(S.drag){ S.drag.active=false; S.drag=null; } },

  answer(S){ return S.inp.map(d=>(S.inp.length>1?d.label+' ':'')+d.val+(d.type==='angle'?'°':' '+(d.unit||'m'))).join(', '); },
  solve(S){ for(const d of S.inp){ d.val=d.answer; d.set=true; } },

/* ───── 5) 짝짓기: 평행한 변끼리 눌러 짝을 짓는다 ───── */
const PAIRCOL=['#ffd24a','#5ee7ff','#ff8fb0'];

  init(it){ return {it,pend:-1,pairs:[]}; },

      if(col){ laserSeg(a,b,col,{lw:5,wide:18}); const m=vmul(vadd(a,b),.5), d=vnorm(vsub(b,a)), q=toPx(m);
        if(pi>=0){ ctx.save(); ctx.translate(q[0],q[1]); ctx.rotate(Math.atan2(d[1],d[0])); for(let k=0;k<=pi;k++){ ctx.strokeStyle=P.ink; ctx.lineWidth=6; ctx.beginPath(); ctx.moveTo(-6+k*9,-8); ctx.lineTo(2+k*9,0); ctx.lineTo(-6+k*9,8); ctx.stroke(); ctx.strokeStyle=col; ctx.lineWidth=3; ctx.stroke(); } ctx.restore(); } }

  down(S,p){ const m=pM(p), sd=KINDS.pairs.sides(S); let best=-1,bd=.6; sd.forEach(([a,b],i)=>{ const d=distSeg(m,a,b); if(d<bd){ bd=d; best=i; } }); if(best<0) return false;

  answer(S){ return S.pairs.length+'쌍'+(S.pairs.length?' ('+S.pairs.map(p=>p.map(i=>S.it.sideNames[i]).join('와 ')).join(', ')+')':''); },
  solve(S){ S.pairs=S.it.want.map(p=>p.slice()); S.pend=-1; },

/* ───── 6) 꼭짓점 옮기기: 전구 기둥 네 개를 모눈 점으로 옮긴다 ───── */
KINDS.posts={
  init(it){ return {it,v:it.start.map(p=>p.slice()),drag:-1,sel:0,moved:false}; },
  draw(S,t){ const ok=quadSimple(S.v); goboShape(S.v,t,{col:ok?'#ffd98a':'#ff8f8f'}); },
  front(S,t){ /* 전구 줄과 기둥 */

    pts.forEach((q,i)=>{ const act=S.drag===i||(KB.on&&S.sel===i);
      ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.fillStyle=`rgba(255,214,110,${act?.55:.25+.15*Math.sin(t*4+i)})`; ctx.beginPath(); circ(ctx,q[0],q[1],act?22:17); ctx.fill(); ctx.restore();

  down(S,p){ const m=pM(p); let best=-1,bd=.8; S.v.forEach((q,i)=>{ const d=vlen(vsub(m,q)); if(d<bd){ bd=d; best=i; } }); if(best<0) return false; S.drag=best; S.sel=best; SFX.tap(); return true; },
  move(S,p){ if(S.drag<0) return; const m=pM(p), B=S.it.bounds; const q=[clamp(Math.round(m[0]),B[0],B[2]),clamp(Math.round(m[1]),B[1],B[3])];

  ready(S){ return S.moved; },

/* ───── 7) 외줄 걸기: 두 변 사이에 외줄을 끌어서 건다 ───── */
KINDS.rope={
  init(it){ return {it,rope:null,drag:null}; },
  snapPt(S,m){ /* 도형 둘레 위 0.5 m 간격 점 중 가장 가까운 곳 */ const pg=S.it.pg; let best=null,bd=.9;
    for(let i=0;i<pg.length;i++){ const a=pg[i], b=pg[(i+1)%pg.length], L=vlen(vsub(b,a)), n=Math.max(1,Math.round(L/.5));

  draw(S,t){ goboShape(S.it.pg,t,{}); },

  down(S,p){ const sp=KINDS.rope.snapPt(S,pM(p)); if(!sp) return false; S.drag={a:sp,b:null}; SFX.tap(); return true; },
  move(S,p){ if(!S.drag) return; const sp=KINDS.rope.snapPt(S,pM(p)); const nb=sp&&(sp.side!==S.drag.a.side||vlen(vsub(sp.p,S.drag.a.p))>.4)?sp:null; if(nb&&(!S.drag.b||vlen(vsub(nb.p,S.drag.b.p))>1e-6)) SFX.tick(1); S.drag.b=nb; },

/* ───── 8) 삼각자 대고 레이저 긋기 ───── */
const SQ_L=5; /* 삼각자 직각을 낀 변 길이(m) */
KINDS.square={
  init(it){ return {it,sq:{v:it.sqStart.slice(),rot:it.sqRot??0},drag:null,line:null,seat:null}; },
  verts(S){ const {v,rot}=S.sq, u=dirOf(rot), w=dirOf(rot+90); return [v,vadd(v,vmul(u,SQ_L)),vadd(v,vmul(w,SQ_L))]; },
  edges(S){ const [V,A,B]=KINDS.square.verts(S); return [[V,A],[V,B],[A,B]]; },
  draw(S,t){ const it=S.it; laserLine(it.ref.p,it.ref.ang,'#4b8dff'); if(S.line) laserLine(S.line.p,S.line.ang,'#ff4d6a'); },
  front(S,t){ const it=S.it;

    if(it.pt){ starPin(it.pt,t,{r:8}); ptLabel(vadd(it.pt,[.9,-.4]),'ㄱ',{size:24}); }
    const [V,A,B]=KINDS.square.verts(S).map(toPx);
    ctx.save(); ctx.fillStyle='rgba(6,2,16,.3)'; ctx.beginPath(); ctx.moveTo(V[0]+4,V[1]+7); ctx.lineTo(A[0]+4,A[1]+7); ctx.lineTo(B[0]+4,B[1]+7); ctx.closePath(); ctx.fill();
    ctx.fillStyle='rgba(150,220,255,.28)'; ctx.strokeStyle=P.ink; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(V[0],V[1]); ctx.lineTo(A[0],A[1]); ctx.lineTo(B[0],B[1]); ctx.closePath(); ctx.fill(); ctx.stroke();

  drawHud(t){ drawLever(ctx,t); if(HOW.step===3) drawHand(LEVER.x+30,LEVER.y+20,t);
    const n=HOW_STEPS.length, hx=SC.x+196; for(let i=0;i<n;i++){ cel(ctx,s=>circ(s,hx-36+i*24,SC.y+SC.h+40,7),i===HOW.step?'#ffd24a':'#4a3d5c',{s:1.5,h:1,ow:2}); }
    tagLabel(hx,SC.y+SC.h+82,HOW.step<n-1?'아무 곳이나 누르면 다음':'큰 북을 쳐 보세요',{size:22});
    tagLabel(1036,36,'건너뛰기',{size:22}); },
  next(){ HOW.step++; SFX.paper(); if(HOW.step>=HOW_STEPS.length){ SAVE.howto=true; storeSave(); irisTo(()=>goScene(SAVE.name?'ladder':'name')); return; } say(HOW_STEPS[HOW.step].text); },
  down(p){ if(Math.abs(p.x-1036)<72&&Math.abs(p.y-36)<28){ SAVE.howto=true; storeSave(); irisTo(()=>goScene(SAVE.name?'ladder':'name')); return; }
    if(HOW.step===3){ if(leverHit(p.x,p.y)){ LEVER.pull=1; SFX.bass(); SFX.drumroll(.5); setTimeout(()=>{ SFX.crash(); SFX.cheer(); G.wave=1.2; },520); setTimeout(()=>SCN.howto.next(),900); } return; }
    if(HOW.step===1&&KINDS.beams.down(HOW.S,p)) return;
    SCN.howto.next(); },
  move(p){ KINDS.beams.move(HOW.S,p); }, up(p){ KINDS.beams.up(HOW.S,p); },
  key(e){ if(e.key==='Enter'||e.key===' '){ if(HOW.step===3){ SCN.howto.down({x:LEVER.x,y:LEVER.y}); } else SCN.howto.next(); return true; } return false; }
};
function drawHand(x,y,t){ const b=Math.sin(t*6)*6; ctx.save(); ctx.translate(x+b*.4,y+b); ctx.rotate(-.4);
  cel(ctx,s=>{ s.moveTo(-6,-30); s.quadraticCurveTo(0,-38,6,-30); s.lineTo(6,-4); s.quadraticCurveTo(18,-8,20,4); s.quadraticCurveTo(22,22,4,26); s.quadraticCurveTo(-14,26,-16,8); s.lineTo(-16,-2); s.quadraticCurveTo(-12,-8,-6,-4); s.closePath(); },'#fff3e0',{s:2,h:1.5,ow:2.5}); ctx.restore(); }

/* ───── 이름 쓰기: 단장이 묻고, 전구 간판에 이름이 켜진다 ───── */
const NAMEV={t:0,lit:0,done:false};
SCN.name={ hud:['sound','gear'], pausable:false,
  enter(){ NAMEV.t=0; NAMEV.lit=0; NAMEV.done=false; const inp=$('nameIn'); inp.value=SAVE.name||''; inp.style.display='block'; setTimeout(()=>{ try{ inp.focus(); }catch(e){} },300);
    say('새 조명 감독님, 이름이 무엇인가요? 간판에 이름을 쓰고 확인 북을 눌러 주세요.'); setRMFace('normal',0); RM.point=1; RM.pointT=99; DARK.k=0; },
  leave(){ $('nameIn').style.display='none'; RM.pointT=0; RM.point=0; },
  update(dt){ NAMEV.t+=dt; if(NAMEV.done){ NAMEV.lit+=dt*8; } },
  draw(t){ },
  drawFront(t){ const x=SC.x+70, y=SC.y+130, w=SC.w-140, h=190;
    ctx.save(); ctx.strokeStyle='#d8c19a'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(x+60,SC.y-10); ctx.lineTo(x+60,y); ctx.moveTo(x+w-60,SC.y-10); ctx.lineTo(x+w-60,y); ctx.stroke(); ctx.restore();
    marquee(ctx,x,y,w,h,t,{step:22,lit:NAMEV.done?undefined:((Math.floor(t*3))%2===0)});
    txt(ctx,'오늘의 조명 감독',x+w/2,y+48,{size:30,align:'center',font:FT,fill:'#ffd98a',sw:6,stroke:'#2a0a14'});
    ctx.save(); ctx.strokeStyle='rgba(255,214,140,.5)'; ctx.setLineDash([10,8]); ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(x+90,y+150); ctx.lineTo(x+w-90,y+150); ctx.stroke(); ctx.restore();
    if(NAMEV.done){ const name=G.name, n=Math.min(name.length,Math.floor(NAMEV.lit)); txt(ctx,name.slice(0,n),x+w/2,y+132,{size:56,align:'center',font:FB,fill:'#fff6c8',sw:6,stroke:'#7a3a0a'}); }
    /* 확인 북 */
    drumBtn(ctx,x+w-10,y+h+40,34,'ok',{label:'확인'}); },
  drawHud(t){},
  confirm(){ const v=$('nameIn').value.trim().replace(/\s+/g,' ').slice(0,8); G.name=v||'꼬마 감독'; SAVE.name=G.name; storeSave(); $('nameIn').style.display='none'; NAMEV.done=true; NAMEV.lit=0;
    for(let i=0;i<G.name.length;i++) setTimeout(()=>SFX.bulb(i),i*125); setTimeout(()=>{ SFX.cheer(); G.wave=1; say((G.name+' 감독님')+', 반가워요! 이제 막을 골라 볼까요?',{good:true}); setRMFace('happy',2); },G.name.length*125+150);
    setTimeout(()=>irisTo(()=>goScene('ladder')),G.name.length*125+1900); },
  down(p){ if(NAMEV.done) return; const x=SC.x+70, y=SC.y+130, w=SC.w-140, h=190; if(Math.hypot(p.x-(x+w-10),p.y-(y+h+40))<44){ SFX.click(); SCN.name.confirm(); return; } try{ $('nameIn').focus(); }catch(e){} },
  key(e){ return false; }
};
$('nameIn').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); audioInit(); SFX.click(); if(G.scene==='name'&&!NAMEV.done) SCN.name.confirm(); } });
$('nameIn').addEventListener('pointerdown',e=>{ e.stopPropagation(); audioInit(); });

/* ───── 줄사다리: 높이 올라갈수록 어려운 막 ───── */
const LAD={t:0,plat:[],pick:-1,climb:0};
function ladderLayout(){ const x0=SC.x+SC.w/2; return [ {act:1,x:x0-170,y:SC.y+SC.h-62}, {act:2,x:x0+150,y:SC.y+SC.h/2+6}, {act:3,x:x0-120,y:SC.y+78} ]; }
SCN.ladder={ hud:['sound','gear'], pausable:false,
  enter(){ LAD.t=0; LAD.pick=-1; LAD.climb=0; LAD.plat=ladderLayout(); DARK.k=0; say((G.name?(G.name+' 감독님')+', ':'')+'어느 막을 볼까요? 줄사다리 발판을 눌러 주세요. 위로 갈수록 어려운 막이에요.'); setRMFace('normal',0); RM.point=1; RM.pointT=3; },
  update(dt){ LAD.t+=dt; if(LAD.pick>=0){ LAD.climb+=dt; } },
  draw(t){ /* 막 위에 걸린 줄사다리 */
    const P=LAD.plat, x0=SC.x+SC.w/2;
    ctx.save(); ctx.strokeStyle='#d8c19a'; ctx.lineWidth=5; ctx.lineCap='round';
    for(const s of [-1,1]){ ctx.beginPath(); ctx.moveTo(x0+s*28,SC.y-8); for(let y=SC.y;y<=SC.y+SC.h+10;y+=12) ctx.lineTo(x0+s*28+Math.sin(y*.04+t*1.2)*4,y); ctx.stroke(); }
    ctx.lineWidth=6; for(let y=SC.y+30;y<SC.y+SC.h;y+=34){ ctx.strokeStyle='#b98a52'; ctx.beginPath(); ctx.moveTo(x0-28+Math.sin(y*.04+t*1.2)*4,y); ctx.lineTo(x0+28+Math.sin(y*.04+t*1.2)*4,y); ctx.stroke(); }
    ctx.restore();
    for(const p of P){ ctx.save(); ctx.strokeStyle='rgba(216,193,154,.8)'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(x0,p.y); ctx.lineTo(p.x,p.y); ctx.stroke(); ctx.restore(); } },
  drawFront(t){ const P=LAD.plat, unlocked=SAVE.unlocked||1;
    P.forEach((p,i)=>{ const A=ACTS[p.act-1], lock=p.act>unlocked, w=300, h=92, x=p.x-w/2, y=p.y-h/2, hover=Math.hypot(PTR.x-p.x,PTR.y-p.y)<120&&!lock;
      ctx.save(); ctx.translate(0,hover?-3:0);
      cel(ctx,s=>rr(s,x+14,y+h-6,w-28,16,6),'#9a6a3a',{s:3,h:2,ow:2.5});
      marquee(ctx,x,y,w,h,t,{step:20,lit:lock?false:undefined,base:lock?'#4a3d5c':'#8e1a31'});
      txt(ctx,A.title,x+22,y+40,{size:28,font:FT,fill:lock?'#9a8aa8':'#fff3d6',sw:6,stroke:'#2a0a14'});
      txt(ctx,A.sub,x+22,y+70,{size:20,fill:lock?'#7a6a88':'#ffd98a'});
      const best=(SAVE.best&&SAVE.best[p.act])||0; for(let k=0;k<3;k++) starIcon(ctx,x+w-80+k*26,y+30,10,best>=[10,20,27][k]);
      txt(ctx,best?best+'/30':'',x+w-54,y+70,{size:19,align:'center',fill:'#ffe08a'});
      if(lock){ ctx.save(); ctx.strokeStyle='#d8c19a'; ctx.lineWidth=6; ctx.beginPath(); ctx.moveTo(x+10,y+10); ctx.lineTo(x+w-10,y+h-10); ctx.moveTo(x+w-10,y+10); ctx.lineTo(x+10,y+h-10); ctx.stroke();
        cel(ctx,s=>circ(s,x+w/2,y+h/2,16),'#b98a52',{s:2,h:2,ow:2.5}); txt(ctx,'앞 막을 마치면 열려요',x+w/2,y+h+34,{size:19,align:'center',fill:'#fff3d6',sw:4,stroke:P.ink}); ctx.restore(); }
      ctx.restore(); });
    /* 곡예사 옷(별을 모으면 열림) */
    drawTray(); const total=[1,2,3].reduce((s,a)=>s+((SAVE.best&&SAVE.best[a])||0),0);
    txt(ctx,'곡예사 옷',TRAY.x+20,TRAY.y+34,{size:21,fill:'#ffe08a'}); txt(ctx,'모은 별 '+total,TRAY.x+20,TRAY.y+64,{size:19,fill:'#fff3d6'});
    COSTUMES.forEach((c,i)=>{ const need=[0,25,50,80][i], open=total>=need, cx=TRAY.x+150+i*56, cy=TRAY.y+52, sel=AC.costume===i;
      cel(ctx,s=>circ(s,cx,cy,20),open?c.c:'#4a3d5c',{s:3,h:2,ow:2.5}); if(open) cel(ctx,s=>star5(s,cx,cy,8,.5),c.c2,{s:1,h:1,ow:1.5});
      if(sel){ ctx.save(); ctx.strokeStyle='#fff3b0'; ctx.lineWidth=3; ctx.beginPath(); circ(ctx,cx,cy,26); ctx.stroke(); ctx.restore(); }
      if(!open) txt(ctx,'별 '+need,cx,cy+40,{size:15,align:'center',fill:'#cbb8e0'}); }); },
  drawHud(t){ },
  acrobat:true,
  down(p){ if(LAD.pick>=0) return;
    const total=[1,2,3].reduce((s,a)=>s+((SAVE.best&&SAVE.best[a])||0),0);
    for(let i=0;i<COSTUMES.length;i++){ const cx=TRAY.x+150+i*56, cy=TRAY.y+52; if(Math.hypot(p.x-cx,p.y-cy)<26){ const need=[0,25,50,80][i]; if(total>=need){ AC.costume=i; SAVE.costume=i; storeSave(); SFX.pick(); AC.face='happy'; } else { SFX.unpick(); toast(`별을 ${need}개 모으면 열려요`,1.8); } return; } }
    for(const pl of LAD.plat){ if(Math.abs(p.x-pl.x)<150&&Math.abs(p.y-pl.y)<50){ if(pl.act>(SAVE.unlocked||1)){ SFX.unpick(); say('앞 막을 먼저 마치면 이 발판이 열려요!'); setRMFace('think',1.5); return; }
        LAD.pick=pl.act; SFX.pick(); SFX.whoosh(); startPerf({type:'land',poly:null,at:[pl.x,pl.y-30]},true); PERF.dur=1.4; setTimeout(()=>irisTo(()=>goScene('play',{act:pl.act,idx:0}),pl.x,pl.y),1150); return; } } },
  key(e){ const n=parseInt(e.key,10); if(n>=1&&n<=3){ const pl=LAD.plat.find(q=>q.act===n); SCN.ladder.down({x:pl.x,y:pl.y}); return true; } return false; }
};

/* ───── 결과: 공연 프로그램 책자(DOM, 종이) ───── */
function fmtTime(s){ s=Math.round(s); return Math.floor(s/60)+'분 '+String(s%60).padStart(2,'0')+'초'; }
function plainText(s){ return String(s).replace(/[{}\[\]]/g,'').replace(/\n/g,' '); }
function statIcon(kind){ const c=document.createElement('canvas'); c.width=84; c.height=84; const g=c.getContext('2d'); g.setTransform(2,0,0,2,0,0); g.lineJoin='round'; g.lineCap='round';
  if(kind==='star') starIcon(g,21,22,16,true);
  if(kind==='first'){ cel(g,s=>circ(s,21,21,15),'#3cc47a',{s:2,h:2,ow:2.2}); g.strokeStyle='#fff'; g.lineWidth=4; g.beginPath(); g.moveTo(13,21); g.lineTo(19,27); g.lineTo(29,15); g.stroke(); }
  if(kind==='rate'){ cel(g,s=>circ(s,21,21,15),'#4b8dff',{s:2,h:2,ow:2.2}); g.fillStyle='#fff'; g.beginPath(); g.moveTo(21,21); g.arc(21,21,10,-Math.PI/2,Math.PI*1.1); g.closePath(); g.fill(); }
  if(kind==='time'){ cel(g,s=>circ(s,21,21,15),'#f6e8c8',{s:2,h:2,ow:2.2}); g.strokeStyle=P.ink; g.lineWidth=2.6; g.beginPath(); g.moveTo(21,21); g.lineTo(21,12); g.moveTo(21,21); g.lineTo(28,24); g.stroke(); }
  if(kind==='aud') ticketIcon(g,21,21,1.05);
  if(kind==='combo'){ cel(g,s=>star5(s,15,22,10,.5),'#ff8fb0',{s:1.5,h:1,ow:2}); cel(g,s=>star5(s,28,18,8,.5),'#9fe2ff',{s:1.5,h:1,ow:2}); }
  return c; }
function starBar(n){ const c=document.createElement('canvas'); c.width=300; c.height=56; const g=c.getContext('2d'); g.setTransform(2,0,0,2,0,0);
  g.fillStyle='rgba(60,30,20,.25)'; g.beginPath(); rr(g,2,7,146,14,7); g.fill(); g.fillStyle=lin(g,0,0,150,0,[[0,'#ffd24a'],[1,'#ff8a3d']]); g.beginPath(); rr(g,2,7,146*Math.min(1,n/30),14,7); g.fill();
  g.strokeStyle=P.ink; g.lineWidth=2; g.beginPath(); rr(g,2,7,146,14,7); g.stroke(); return c; }
SCN.results={ hud:['sound','gear'], pausable:false,
  enter(arg){ const act=arg.act; this.act=act; const list=ITEMS.filter(it=>it.act===act), recs=list.map(it=>G.rec[it.id]).filter(Boolean);
    const first=recs.filter(r=>r.tries===1).length, tries=recs.reduce((s,r)=>s+r.tries,0), stars=recs.reduce((s,r)=>s+r.stars,0), time=G.t-G.actStart;
    let best=0,run=0; for(const it of list){ const r=G.rec[it.id]; if(r&&r.tries===1){ run++; best=Math.max(best,run); } else run=0; }
    $('rTitle').textContent=ACTS[act-1].title+' 공연 기록'; $('rSub').textContent=(G.name?G.name+' 감독님':'조명 감독님')+'의 공연 프로그램';
    const S=[['star','얻은 별',stars+' / 30'],['first','한 번에 맞힘',first+' / 10'],['rate','정답률',Math.round(list.length/Math.max(1,tries)*100)+'%'],['time','걸린 시간',fmtTime(time)],['aud','관객 수',Math.round(G.audience)+'명'],['combo','연속 한 번에',best+'번']];
    const st=$('rStats'); st.innerHTML=''; for(const [ic,lab,val] of S){ const d=document.createElement('div'); d.className='st'; d.appendChild(statIcon(ic)); d.insertAdjacentHTML('beforeend',`<b>${val}</b><span>${lab}</span>`); st.appendChild(d); }
    const ac=$('rActs'); ac.innerHTML=''; for(const A of ACTS){ const b=(SAVE.best&&SAVE.best[A.n])||0; const d=document.createElement('div'); d.className='act'; d.insertAdjacentHTML('beforeend',`<span style="width:150px">${A.title}</span>`); d.appendChild(starBar(b)); d.insertAdjacentHTML('beforeend',`<span>최고 ${b}/30</span>`); ac.appendChild(d); }
    $('rBest').textContent=G.newBest?'새 최고 기록이에요! 별 '+stars+'개':(stars===30?'모든 신청서를 한 번에 해냈어요!':'');
    const notes=$('rNotes'); notes.innerHTML=''; const wrong=list.filter(it=>G.rec[it.id]&&G.rec[it.id].tries>1);
    if(!wrong.length) notes.innerHTML='<div class="none">틀린 신청서가 없어요. 완벽한 공연이었어요!</div>';
    for(const it of wrong){ const r=G.rec[it.id]; const d=document.createElement('div'); d.className='nt';
      d.innerHTML=`<div class="q"><span class="tag">${it.src}</span>${plainText(it.req)}</div><div class="me">내 답: ${r.answers.slice(0,-1).map(a=>plainText(a)).join(' / ')}</div><div class="ok">정답: ${plainText(it.ans)}</div><div class="ex">${plainText(it.exp)}</div>`; notes.appendChild(d); }
    const bt=$('rBtns'); bt.innerHTML='';
    const mk=(label,cls,fn)=>{ const b=document.createElement('button'); b.className='btn '+cls; b.textContent=label; b.addEventListener('click',e=>{ e.stopPropagation(); SFX.click(); fn(); }); bt.appendChild(b); };
    if(act<3) mk('다음 막으로','gold',()=>{ $('results').classList.remove('on'); irisTo(()=>goScene('play',{act:act+1,idx:0})); });
    mk('막 고르기','',()=>{ $('results').classList.remove('on'); irisTo(()=>goScene('ladder')); });
    mk(act<3?'다시 하기':'처음부터','blue',()=>{ $('results').classList.remove('on'); irisTo(()=>goScene('play',{act:act<3?act:1,idx:0})); });
    $('results').classList.add('on'); confetti(stars>=24?90:50); SFX.cheer(); setRMFace('happy',3); G.wave=1.5; PERF.on=false; PERF.stay=false; },
  leave(){ $('results').classList.remove('on'); },
  draw(t){}, drawHud(t){}
};

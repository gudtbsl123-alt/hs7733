  .head { display:flex; flex-direction:column; gap:10px; }
  .controls { display:flex; flex-direction:column; gap:20px; }
  .search-wrap { position:relative; max-width:520px; width:100%; }
  #search { width:100%; background:#fff; border:1px solid #d6d6d6; border-radius:999px; padding:13px 44px 13px 20px; font-size:17px; letter-spacing:-.374px; color:#1d1d1f; outline:none; }
  #clear { position:absolute; right:8px; top:50%; transform:translateY(-50%); width:28px; height:28px; border:none; border-radius:999px; background:#e8e8ed; color:#474747; font-size:14px; cursor:pointer; display:none; }
  #clear:hover { opacity:.7; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { display:inline-flex; align-items:center; white-space:nowrap; border-radius:999px; font-size:14px; letter-spacing:-.224px; cursor:pointer;

  .chip:hover { opacity:.75; }
  .chip.on { background:#1d1d1f; color:#fff; border-color:#1d1d1f; }
  .chips.grade .chip { padding:9px 20px; font-weight:500; }
  .chips.subject .chip { padding:7px 16px; font-weight:400; }

  #grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr)); gap:24px; align-items:stretch; }
  .card { opacity:0; background:#fff; border-radius:12px; padding:24px; display:flex; flex-direction:column; gap:12px; cursor:pointer;
    box-shadow: inset 0 0 0 2px #1d1d1f, 8px 8px 0 0 #1d1d1f;
    transition: transform 180ms cubic-bezier(.2,0,0,1), box-shadow 180ms cubic-bezier(.2,0,0,1); }
  .card:hover { transform:translate(-2px,-2px); box-shadow: inset 0 0 0 2px #1d1d1f, 12px 12px 0 0 #1d1d1f; }

  .card-top { display:flex; align-items:center; gap:10px; }
  .card-icon { font-size:24px; line-height:1; }
  .card-meta { font-size:12px; font-weight:500; letter-spacing:-.12px; color:#707070; }
  .card h3 { margin:0; font-size:24px; font-weight:600; line-height:1.2; letter-spacing:.007em; word-break:keep-all; }
  .card-genre { margin:0; min-height:0; font-size:17px; line-height:1.4; letter-spacing:-.374px; color:#707070; }
  .card-go { margin-top:auto; padding-top:12px; font-size:17px; letter-spacing:-.374px; color:#0066cc; }

<div class="nav">

<section class="hero">

    <div class="cta-row">

    </div>
    <p class="muted" id="heroCount"></p>
  </div>
</section>

<section class="browse" id="browse">

    </div>

    <div class="controls">
      <div class="search-wrap">

    <div id="empty">

    </div>
  </div>
</section>

<footer>
  <div class="foot-in">
    <p>에듀테크 게임 저장소 · 교과서 단원에 맞춰 만든 초등 수업용 웹게임 모음</p>

  </div>
</footer>

<div id="launch"><iframe id="launchFrame" allow="autoplay; fullscreen" allowfullscreen></iframe><button type="button" id="closeLaunch">닫기</button></div>

<div id="admin">

      <select id="adminSel"></select>
    </div>
    <div class="field">
      <label for="adminTitle">타이틀 (학년 및 과목 포함 권장)</label>
      <input type="text" id="adminTitle" placeholder="예: 5학년 1학기 수학 분수의 덧셈과 뺄셈" />
    </div>
    <div class="field">

    </div>
    <div class="admin-actions">
      <button type="button" class="btn-primary" id="saveGame">저장하기</button>
      <button type="button" class="btn-ghost" id="closeAdmin">닫기</button>
    </div>
  </div>
</div>

const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
let games = INITIAL, grade = 'all', subject = 'all', q = '', shownCount = null, raf = 0;

try {
  const raw = localStorage.getItem('edutech_games');
  const parsed = raw ? JSON.parse(raw) : null;
  if (Array.isArray(parsed) && parsed.length) games = parsed;
} catch (e) {}

const $ = s => document.querySelector(s);
const grid = $('#grid');

function subjectOf(t) {
  for (const s of ['국어','수학','사회','과학','창체']) if (t.includes(s)) return s;
  return '기타';
}
function gradeOf(t) { const m = t.match(/([3-6])학년/); return m ? m[1] + '학년' : '기타'; }

function parseTitle(full) {
  let rest = String(full).trim(), g = '', term = '', subj = '', m;
  if ((m = rest.match(/^([3-6]학년)\s*/))) { g = m[1]; rest = rest.slice(m[0].length); }
  if ((m = rest.match(/^([1-2]학기)\s*/))) { term = m[1]; rest = rest.slice(m[0].length); }
  if ((m = rest.match(/^(국어|수학|사회|과학|창체|영어|도덕|실과|음악|미술|체육)\s*/))) { subj = m[1]; rest = rest.slice(m[0].length); }
  let genre = '';
  const gm = rest.match(/[（(]([^()（）]+)[）)]\s*$/);
  if (gm) { genre = gm[1].trim(); rest = rest.slice(0, gm.index).trim(); }
  return { grade: g, term, subject: subj || subjectOf(full), name: rest.trim() || String(full).trim(), genre };
}

const io = 'IntersectionObserver' in window ? new IntersectionObserver(entries => {
  let i = 0;
  entries.forEach(e => {
    if (!e.isIntersecting) return;
    io.unobserve(e.target);
    e.target.style.opacity = '1';
    e.target.animate(
      [{ opacity: 0, transform: 'translateY(16px)' }, { opacity: 1, transform: 'none' }],
      { duration: 460, delay: i++ * 40, easing: 'cubic-bezier(0.2,0,0,1)', fill: 'backwards' }
    );
  });
}, { rootMargin: '0px 0px -8% 0px', threshold: 0.05 }) : null;

function tweenCount(to) {
  cancelAnimationFrame(raf);
  const from = shownCount == null ? to : shownCount;
  if (from === to || REDUCED) { shownCount = to; paintCount(); return; }
  let t0 = null;
  const step = t => {
    if (t0 === null) t0 = t;
    const p = Math.max(0, Math.min(1, (t - t0) / 340));
    shownCount = Math.round(from + (to - from) * (1 - Math.pow(1 - p, 3)));
    paintCount();
    if (p < 1) raf = requestAnimationFrame(step);
  };
  raf = requestAnimationFrame(step);
}

function paintCount() {
  const active = q.trim() || grade !== 'all' || subject !== 'all';
  $('#countText').textContent = active
    ? '전체 ' + games.length + '개 중 ' + (shownCount ?? 0) + '개 표시 중'
    : '학년과 과목으로 좁혀서 찾아보세요';
}

function chips(host, values, current, onPick) {
  host.innerHTML = '';
  values.forEach(v => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip' + (current === v.value ? ' on' : '');
    b.textContent = v.label;
    b.onclick = () => onPick(v.value);
    host.appendChild(b);
  });
}

function renderChips() {
  chips($('#gradeTabs'),
    [['all','전체 학년'],['3학년','3학년'],['4학년','4학년'],['5학년','5학년'],['6학년','6학년']].map(([value,label]) => ({value,label})),
    grade, v => { grade = v; render(); });
  chips($('#subjectTabs'),
    [['all','전체 과목'],['국어','국어'],['수학','수학'],['사회','사회'],['과학','과학'],['창체','창체'],['기타','기타']].map(([value,label]) => ({value,label})),
    subject, v => { subject = v; render(); });
}

function render() {
  const snap = new Map();
  if (!REDUCED) Array.from(grid.children).forEach(el => snap.set(el.dataset.gid, el.getBoundingClientRect()));

  const query = q.trim().toLowerCase();
  const filtered = games.filter(g =>
    (grade === 'all' || gradeOf(g.title) === grade) &&
    (subject === 'all' || subjectOf(g.title) === subject) &&
    (!query || g.title.toLowerCase().includes(query))
  );

  grid.innerHTML = '';
  filtered.forEach(g => {
    const i = parseTitle(g.title);
    const meta = [i.grade && i.term ? i.grade + ' ' + i.term : i.grade, i.subject].filter(Boolean).join(' · ') || '기타';
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.gid = String(g.id);
    card.onclick = () => openLaunch(g.url);

    const top = document.createElement('div');
    top.className = 'card-top';
    const ic = document.createElement('span'); ic.className = 'card-icon'; ic.textContent = g.icon || '🎮';
    const mt = document.createElement('span'); mt.className = 'card-meta'; mt.textContent = meta;
    top.append(ic, mt);

    const h3 = document.createElement('h3'); h3.textContent = i.name;
    const gen = document.createElement('p'); gen.className = 'card-genre'; gen.textContent = i.genre;
    const go = document.createElement('span'); go.className = 'card-go'; go.textContent = '실행하기 ›';

    card.append(top, h3, gen, go);
    grid.appendChild(card);
  });

  $('#empty').style.display = filtered.length ? 'none' : 'flex';
  $('#clear').style.display = q ? 'block' : 'none';

  Array.from(grid.children).forEach(el => {
    const prev = snap.get(el.dataset.gid);
    if (prev && !REDUCED) {
      el.style.opacity = '1';
      const now = el.getBoundingClientRect();
      const dx = prev.left - now.left, dy = prev.top - now.top;
      if (dx || dy) el.animate(
        [{ transform: 'translate(' + dx + 'px,' + dy + 'px)' }, { transform: 'none' }],
        { duration: 340, easing: 'cubic-bezier(0.2,0,0,1)' });
    } else if (io && !REDUCED) {
      io.observe(el);
    } else {
      el.style.opacity = '1';
    }
  });

  renderChips();
  tweenCount(filtered.length);
  $('#heroCount').textContent = '모두 ' + games.length + '개의 게임이 준비되어 있어요';
  $('#footCount').textContent = '게임 ' + games.length + '개';
}

function openLaunch(url) {
  $('#launchFrame').src = url;
  $('#launch').style.display = 'block';
  document.body.style.overflow = 'hidden';
}
$('#closeLaunch').onclick = () => {
  $('#launch').style.display = 'none';
  $('#launchFrame').src = 'about:blank';
  document.body.style.overflow = '';
};
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if ($('#launch').style.display === 'block') $('#closeLaunch').click();
  else if ($('#admin').style.display === 'flex') closeAdmin();
});

$('#search').addEventListener('input', e => { q = e.target.value; render(); });
$('#clear').onclick = () => { q = ''; $('#search').value = ''; render(); };

function fillAdminOptions() {
  const sel = $('#adminSel');
  sel.innerHTML = '';
  const blank = document.createElement('option'); blank.value = ''; blank.textContent = '새 게임 등록';
  sel.appendChild(blank);
  games.forEach(g => {
    const o = document.createElement('option'); o.value = String(g.id); o.textContent = g.title;
    sel.appendChild(o);
  });
}
function closeAdmin() { $('#admin').style.display = 'none'; document.body.style.overflow = ''; }
$('#closeAdmin').onclick = closeAdmin;
$('#openAdmin').onclick = () => {
  if (prompt('관리자 암호를 입력하세요.') !== 'gudtns12') return;
  fillAdminOptions();
  $('#adminSel').value = ''; $('#adminTitle').value = ''; $('#adminUrl').value = '';
  $('#admin').style.display = 'flex';
  document.body.style.overflow = 'hidden';
};
$('#adminSel').addEventListener('change', e => {
  const g = games.find(x => String(x.id) === e.target.value);
  $('#adminTitle').value = g ? g.title : '';
  $('#adminUrl').value = g ? g.url : '';
});
$('#saveGame').onclick = () => {
  const title = $('#adminTitle').value.trim(), url = $('#adminUrl').value.trim();
  if (!title || !url) { alert('타이틀과 파일 경로를 모두 입력해주세요.'); return; }
  const sel = $('#adminSel').value;
  if (sel) {
    games = games.map(g => String(g.id) === sel ? { ...g, title, url } : g);
  } else {
    const icon = title.includes('수학') ? '🔢' : title.includes('사회') ? '🌍'
      : title.includes('과학') ? '🧪' : title.includes('국어') ? '📖' : '🎮';
    games = games.concat([{ id: games.length ? Math.max(...games.map(g => g.id)) + 1 : 1, icon, title, url }]);
  }
  try { localStorage.setItem('edutech_games', JSON.stringify(games)); } catch (e) {}
  closeAdmin();
  render();
};

render();
</script>
</body>
</html>

html,body{margin:0;height:100%;background:#081626;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform:translate(-50%,-50%);transform-origin:50% 50%;overflow:hidden;background:#081626}
#gl,#hud{position:absolute;left:0;top:0;width:1280px;height:720px;display:block}
#gl{z-index:1}#hud{z-index:2}
#nameIn{position:absolute;left:442px;top:476px;width:300px;height:50px;z-index:3;border:0;outline:0;background:transparent;color:#7dff9a;font:30px Galmuri,monospace;caret-color:#7dff9a;text-shadow:0 0 8px #7dff9a;display:none;padding:0}
#nameIn.show{display:block}
#result{position:absolute;inset:0;z-index:4;display:none;overflow-y:auto;background:rgba(6,14,30,.55);padding:26px 0 40px}
#result.show{display:block}
#result.show .paper{animation:print .7s steps(14,end) both}
@keyframes print{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
.cell{animation:lamp .25s ease-out both}
@keyframes lamp{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
.who .gr{display:inline-block;animation:stamp .3s 1.45s cubic-bezier(.3,1.6,.5,1) both;border:3px solid #2fae5a;border-radius:8px;padding:0 8px;transform:rotate(-6deg)}
@keyframes stamp{from{opacity:0;transform:rotate(-6deg) scale(2.2)}to{opacity:1;transform:rotate(-6deg) scale(1)}}
.paper.skip,.paper.skip *{animation:none!important;clip-path:none!important}
.snd{position:absolute;right:20px;top:14px;z-index:5;width:56px;height:52px;background:#fbf1dc;border:3px solid #1b1840;border-bottom-width:6px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.paper{position:relative;margin:0 auto;width:760px;background:#fff8e6;border:3px solid #1b1840;border-radius:4px;padding:26px 46px 30px;font:20px DoHyeon,Galmuri,sans-serif;color:#2a2050;
background-image:radial-gradient(circle at 16px 18px,#d9cfe8 4px,transparent 5px),radial-gradient(circle at calc(100% - 16px) 18px,#d9cfe8 4px,transparent 5px),repeating-linear-gradient(0deg,transparent 0 33px,rgba(120,200,160,.14) 33px 66px);background-size:100% 36px,100% 36px,100% 100%}
.ph{display:flex;justify-content:space-between;align-items:baseline;border-bottom:4px solid #ff7a3c;padding-bottom:8px}
.ph b{font:40px DoHyeon,sans-serif;color:#fff3dc;-webkit-text-stroke:0;text-shadow:3px 0 #1b1840,-3px 0 #1b1840,0 3px #1b1840,0 -3px #1b1840,2px 2px #1b1840,-2px -2px #1b1840,2px -2px #1b1840,-2px 2px #1b1840,0 6px #c4502a}.ph span{font-size:22px;color:#c4502a}
.who{margin:12px 0 14px;font-size:22px}.who b{color:#1b1840}.who .gr{color:#2fae5a}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cell{background:#0e2422;border:3px solid #1b1840;border-radius:10px;padding:8px 12px;color:#7dff9a}
.cell i{display:block;font-style:normal;font-size:15px;color:#8fbfa8}.cell em{font:30px Galmuri,monospace;font-style:normal;text-shadow:0 0 8px #7dff9a}.cell small{font-size:16px}
.qs{margin:16px 0 4px;display:flex;flex-wrap:wrap;gap:6px}
.qd{display:inline-flex;align-items:center;gap:2px;border:2px solid #1b1840;border-radius:14px;padding:2px 10px;font:16px Galmuri,monospace;background:#d8ffe0}
.qd.w{background:#ffe0d0}.qd i{width:9px;height:9px;background:#ffb000;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
h3{font:28px DoHyeon,sans-serif;color:#1b1840;margin:20px 0 8px;border-top:2px dashed #b3a6c8;padding-top:14px}h3 small{font:18px DoHyeon,sans-serif;color:#2fae5a;margin-left:8px}
.note{border:2px dashed #8a7aa8;border-left:6px solid #ff7a3c;border-radius:6px;padding:10px 14px;margin-bottom:10px;background:#fff3d6}
.nq{font-size:20px;line-height:1.45;margin-bottom:6px}.nq span{display:inline-block;background:#ff7a3c;color:#fff;border-radius:8px;padding:0 8px;margin-right:6px;font-size:15px}
.nr{font-size:19px;line-height:1.45;padding:3px 0}.nr b{display:inline-block;width:52px;color:#c4502a}.nr.ok b{color:#2fae5a}.nr.ex b{color:#3d6bd8}
.unlock{margin:14px 0;padding:10px 14px;border:3px dashed #2fae5a;border-radius:12px;font-size:22px;color:#1a6a3a;background:#e8fff0}
.cj{display:inline-block;width:1.05em;height:1.05em;line-height:1.02em;border:2px solid currentColor;border-radius:50%;text-align:center;font-size:.8em;vertical-align:.08em;margin:0 1px}
.btns{display:flex;gap:14px;justify-content:center;margin-top:20px}
.btns button{font:24px DoHyeon,sans-serif;color:#1b1840;background:#fbf1dc;border:3px solid #1b1840;border-bottom-width:7px;border-radius:14px;padding:10px 26px;cursor:pointer}
.btns button.hot{background:#ffd24a}.btns button:active{border-bottom-width:3px;transform:translateY(4px)}

</style>

/* ═════════════ 1. 천문 모형 (학습 내용: 계절의 변화) ═════════════
   - 지구는 태양 둘레를 북쪽에서 볼 때 시계 반대 방향으로 공전한다.
   - 자전축은 공간에서 늘 같은 쪽(+x)으로 기운다. 6월 자리(지구가 -x 쪽)에서 북반구가 태양 쪽으로 기울어 여름.
   - 우리나라 위도 37.5°. 남중 고도 = 90 - 37.5 + 적위.  적위 = 기울기 × cos((월-6)×30°)
   - 낮의 길이는 학습지 표(월별 실측값)를 그대로 쓰고 사이 값은 이어 붙인다. 자전축이 수직이면 12시간. */
const LAT = 37.5, ORBIT_R = 8.6, EARTH_R = 1.4, TILT = 23.5;
const DAYLEN = { 1: 600, 2: 662, 3: 730, 4: 803, 5: 861, 6: 885, 7: 862, 8: 804, 9: 732, 10: 661, 11: 599, 12: 573 }; /* 분, 학습지 12~13번 표 */
const wrapM = (m) => ((m - 1) % 12 + 12) % 12 + 1;           /* 1 이상 13 미만 */
const monthAngle = (m) => Math.PI + (m - 6) * Math.PI / 6;
const earthPos = (m, out) => { const a = monthAngle(m); return out.set(ORBIT_R * Math.cos(a), 0, -ORBIT_R * Math.sin(a)); };
const declin = (m, tilt) => tilt * Math.cos((m - 6) * Math.PI / 6);
const noonAlt = (m, tilt) => 90 - LAT + declin(m, tilt);
function dayLen(m, tilt) {
  const a = Math.floor(m), f = m - a, A = DAYLEN[wrapM(a)], B = DAYLEN[wrapM(a + 1)];
  const base = A + (B - A) * f; return Math.round(720 + (base - 720) * (tilt / TILT));
}
function sunAltAt(m, tilt, hour) { /* 남중 12시 30분 무렵 */
  const d = declin(m, tilt) * D2R, p = LAT * D2R, h = (hour - 12.5) * 15 * D2R;
  return Math.asin(Math.sin(p) * Math.sin(d) + Math.cos(p) * Math.cos(d) * Math.cos(h)) / D2R;
}
const seasonOf = (m) => { const k = wrapM(Math.round(m)); return k >= 3 && k <= 5 ? '봄' : k >= 6 && k <= 8 ? '여름' : k >= 9 && k <= 11 ? '가을' : '겨울'; };

/* 게임 상태 */

/* 툰 재질 + 외곽선 */

function glowTex(stops) { return canvasTex(256, 256, (g) => { const gr = g.createRadialGradient(128, 128, 0, 128, 128, 128); stops.forEach(([o, c]) => gr.addColorStop(o, c)); g.fillStyle = gr; g.fillRect(0, 0, 256, 256); }); }

const anim = [];

/* ═════════════ 3. 우주 배경: 은하수 · 별 3단 · 먼 행성 ═════════════ */
function buildSky() {
  const R = rng(5);
  const tex = canvasTex(2048, 1024, (g, w, h) => {
    const bg = g.createLinearGradient(0, 0, 0, h); bg.addColorStop(0, '#081626'); bg.addColorStop(0.5, '#10304a'); bg.addColorStop(1, '#091424');
    g.fillStyle = bg; g.fillRect(0, 0, w, h);
    /* 은하수 띠: 기울어진 사인 곡선을 따라 흐린 덩어리 */
    for (let i = 0; i < 900; i++) {
      const x = R() * w, y = h * 0.5 + Math.sin(x / w * TAU) * h * 0.18 + (R() - 0.5) * h * 0.16 * (0.4 + R());
      const r = 20 + R() * 70, gr = g.createRadialGradient(x, y, 0, x, y, r);
      const c = R() < 0.45 ? '60,160,190' : R() < 0.6 ? '70,110,210' : '150,110,200';
      gr.addColorStop(0, `rgba(${c},${0.09 + R() * 0.1})`); gr.addColorStop(1, `rgba(${c},0)`);
      g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2);
    }
    for (let i = 0; i < 2600; i++) { const x = R() * w, y = h * 0.5 + Math.sin(x / w * TAU) * h * 0.18 + (R() - 0.5) * h * 0.2; g.fillStyle = `rgba(255,240,255,${0.15 + R() * 0.4})`; g.fillRect(x, y, 1.4, 1.4); }
  });

  const sky = new THREE.Mesh(new THREE.SphereGeometry(300, 48, 24), new THREE.MeshBasicMaterial({ map: tex, side: THREE.BackSide, fog: false, depthWrite: false }));
  sky.rotation.z = 0.5; scene.add(sky);
  /* 별: 원형 점 텍스처 */
  const dot = glowTex([[0, 'rgba(255,255,255,1)'], [0.25, 'rgba(255,255,255,.8)'], [1, 'rgba(255,255,255,0)']]);
  function starLayer(n, rad, size, seed, colors) {
    const r = rng(seed), pos = [], col = [], c = new THREE.Color();
    for (let i = 0; i < n; i++) { const u = r() * 2 - 1, a = r() * TAU, s = Math.sqrt(1 - u * u); const rr = rad * (0.85 + r() * 0.15); pos.push(Math.cos(a) * s * rr, u * rr, Math.sin(a) * s * rr); c.set(colors[(r() * colors.length) | 0]); col.push(c.r, c.g, c.b); }
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
    const m = new THREE.PointsMaterial({ size, map: dot, vertexColors: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false, sizeAttenuation: true });
    const p = new THREE.Points(g, m); scene.add(p); return p;
  }
  starLayer(LOW ? 600 : 1600, 260, 1.6, 11, ['#ffffff', '#cfe0ff', '#ffe9c8', '#d9c8ff']);
  const tw = starLayer(LOW ? 60 : 160, 220, 4.2, 12, ['#ffffff', '#bfe4ff', '#ffe2a8']);
  anim.push((t) => { tw.material.opacity = 0.65 + 0.35 * Math.sin(t * 2.3); });
  /* 반짝 십자별(가까운 몇 개) */
  const cross = canvasTex(128, 128, (g) => { const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64); gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.15, 'rgba(255,255,255,.5)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
    g.fillStyle = 'rgba(255,255,255,.85)'; g.beginPath(); g.moveTo(64, 0); g.lineTo(68, 60); g.lineTo(128, 64); g.lineTo(68, 68); g.lineTo(64, 128); g.lineTo(60, 68); g.lineTo(0, 64); g.lineTo(60, 60); g.closePath(); g.fill(); });
  const sr = rng(77);
  for (let i = 0; i < (LOW ? 4 : 10); i++) { const s = sprite(cross, 3 + sr() * 3); const a = sr() * TAU; s.position.set(Math.cos(a) * 90, 10 + sr() * 50, Math.sin(a) * 90 - 30); scene.add(s); const ph = sr() * 6; anim.push((t) => { const k = 0.6 + 0.4 * Math.sin(t * 1.7 + ph); s.material.opacity = k; s.material.rotation = Math.sin(t * 0.3 + ph) * 0.2; }); }
  /* 먼 행성(안개에 섞여 연함, 외곽선 없음) */
  const ringed = new THREE.Group();
  const pl = mesh(new THREE.SphereGeometry(3.2, 32, 20), '#8f8ab0', { ol: 0 }); ringed.add(pl);
  const ring = new THREE.Mesh(new THREE.RingGeometry(4.2, 6.4, 64), toon('#a9a6c8', { side: THREE.DoubleSide, transparent: true, opacity: 0.6 })); ring.rotation.x = -1.2; ringed.add(ring);
  scene.add(ringed); anim.push((t) => { pl.rotation.y = t * 0.05; ring.rotation.z = t * 0.01; });
  const red = mesh(new THREE.SphereGeometry(1.6, 24, 16), '#b8806a', { ol: 0 }); scene.add(red);
  const ice = mesh(new THREE.SphereGeometry(1.1, 24, 16), '#7fa8c0', { ol: 0 }); scene.add(ice);
  ringed.scale.setScalar(1.35); red.scale.setScalar(1.56); ice.scale.setScalar(1.36);
  FAR.push([ringed, 1120, 150, 150], [red, 140, 380, 150], [ice, 660, 70, 150]);
}

let sunGroup, sunLight;

  });
  const core = new THREE.Mesh(new THREE.SphereGeometry(1.7, 48, 32), new THREE.MeshBasicMaterial({ map: tex, fog: false }));
  sunGroup.add(core);
  const g1 = sprite(glowTex([[0, 'rgba(255,230,150,.95)'], [0.3, 'rgba(255,170,60,.45)'], [1, 'rgba(255,120,40,0)']]), 9);
  const g2 = sprite(glowTex([[0, 'rgba(255,200,120,.35)'], [0.5, 'rgba(255,120,80,.12)'], [1, 'rgba(160,80,200,0)']]), 24);

  sunGroup.add(g2, g1, rays);
  anim.push((t) => { core.rotation.y = t * 0.08; rays.material.rotation = t * 0.05; const k = 1 + Math.sin(t * 1.6) * 0.04; g1.scale.set(9 * k, 9 * k, 1); g2.material.opacity = 0.85 + Math.sin(t * 0.9) * 0.15; });
  sunLight = new THREE.PointLight('#fff1d6', 2.2, 0, 0); scene.add(sunLight);
  scene.add(new THREE.AmbientLight('#3a4f8a', 0.38));
  scene.add(new THREE.HemisphereLight('#6a8ae0', '#10283c', 0.22));
}

/* ═════════════ 5. 궤도 고리 · 달 눈금 ═════════════ */
const monthBeads = []; let ringLabels = [];

/* ═════════════ 17. 시작 ═════════════ */
let last = 0, T = 0, slowFrames = 0, frameCount = 0;
function frame(now) {
  const raw = (now - last) / 1000 || 0, dt = Math.min(SHOT ? 0.4 : 0.05, raw); last = now; if (!S.paused && !S.settings) T += dt;
  if (S.scene === 'play' && !SHOT && !LOW) { frameCount++; if (raw > 0.05) slowFrames++; if (frameCount === 180) { if (slowFrames > 90) { setLow(true); S.toast = { s: '컴퓨터가 느려서 가벼운 화면으로 바꿨어요', t: T }; } } }
  if (!S.dragEarth) { let d = S.monthT - S.month; if (d > 6) d -= 12; if (d < -6) d += 12; S.month = wrapM(S.month + d * Math.min(1, dt * 9)); }
  if (!S.dragLever) S.tilt += (S.tiltT - S.tilt) * Math.min(1, dt * 10);
  if (dayMode() || S.scene !== 'play') { /* 하루 관측: 날짜 고정 */ if (dayMode()) S.month = S.monthT = DAY_MONTH; }
  if (S.scene !== 'play' && S.scene !== 'done') S.hour = 12.5 + Math.sin(T * 0.3) * 3;
  exprTick(); placeCam(T, dt); placeFar(); updateEarth(T); anim.forEach((f) => f(T));
  if (renderer) { if (rt && !LOW) { renderer.setRenderTarget(rt); renderer.render(scene, camera); renderer.setRenderTarget(null); renderer.render(postScene, postCam); } else { renderer.setRenderTarget(null); renderer.render(scene, camera); } }
  else draw2DWorld(T);
  drawHUD(T, dt); requestAnimationFrame(frame);
}
window.__game = {
  S, QUESTIONS, startStage, transmit, nextQ, showResult, goSelect,
  goScene: (s) => { if (s === 'name') goName(); else if (s === 'select') goSelect(); else S.scene = s; },
  setMonth: (m) => { S.month = S.monthT = m; }, setTilt: (v) => { S.tilt = S.tiltT = v; }, setHour: (h) => { S.hour = h; },
  /* 시험용: 지금 문항(단계)의 정답 상태로 맞춘다 */
  solve: () => { const q = S.q, st = q.steps && q.steps[S.step];
    if (q.type === 'orbit') { S.month = S.monthT = st.answer; } else if (q.type === 'spin') S.hour = st.answer; else if (q.type === 'tilt') S.tilt = S.tiltT = TILT;
    else if (q.type === 'cart') S.sel = q.answer; else if (q.type === 'toggle') S.sw = q.answer.slice();
    else if (q.type === 'pick') S.sel = q.fig === 'photos' ? ['㉠', '㉡'][S.order.indexOf(1)] : q.answer; },
  wrong: () => { const q = S.q, st = q.steps && q.steps[S.step];
    if (q.type === 'orbit') { S.month = S.monthT = st.answer === 6 ? 9 : 3; } else if (q.type === 'spin') S.hour = 10; else if (q.type === 'tilt') S.tilt = S.tiltT = 0;
    else if (q.type === 'cart') S.sel = (q.answer + 1) % q.options.length; else if (q.type === 'toggle') S.sw = q.answer.map((v) => 1 - v);
    else if (q.type === 'pick') S.sel = q.fig === 'photos' ? ['㉠', '㉡'][S.order.indexOf(0)] : q.options.find((o) => o !== q.answer); },
  state: () => ({ scene: S.scene, stage: S.stage, qi: S.qi, step: S.step, solved: S.solved, tries: S.tries, stars: S.stars, busy: S.busy }),
};
(async function init() {
  if (!renderer) { glc.style.display = 'block'; try { g2 = glc.getContext('2d'); glc.width = W * HPR; glc.height = H * HPR; } catch (e) { g2 = null; } }
  try { await Promise.all([document.fonts.load('30px Orbit', '지구 궤도 관제사'), document.fonts.load('20px Galmuri', '월남중 고도'), document.fonts.load('25px DoHyeon', '관제 요청')]); } catch (e) { /* 글꼴이 없어도 계속 */ }
  buildSky(); buildSun(); buildOrbit(); buildEarth(); buildForeground(); if (!LOW) buildPost();
  placeCam(0, 1); camera.updateMatrixWorld(); placeFar(); buildComet();
  if (QS.get('scene') === 'select') { SAVE.unlocked = 3; goSelect(); }
  requestAnimationFrame(frame);
})();

</script>

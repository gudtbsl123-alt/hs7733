<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>분수 급행열차 그래픽 시안</title>
<style>
/* 글꼴: Bagel Fat One, Jua — SIL Open Font License 1.1. 이 화면에 쓰는 글자만 골라 파일 안에 넣었다. */
@font-face{font-family:"Bagel";src:url(data:font/woff2;base64,__BAGEL__) format("woff2");font-display:block}
@font-face{font-family:"Jua";src:url(data:font/woff2;base64,__JUA__) format("woff2");font-display:block}
html,body{margin:0;height:100%;background:#20160f;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform:translate(-50%,-50%);transform-origin:50% 50%}
#cv{width:1280px;height:720px;display:block}
</style>
</head>
<body>
<div id="stage"><canvas id="cv"></canvas></div>
<script>
'use strict';
/* ══════════════════════════════════════════════════════════════
   분수 급행열차 — 그래픽 시안: 실제 게임의 플레이 장면을 '아트 바이블 + 렌더링 레시피'로 다시 그림
   조건: HTML 파일 하나 · 인터넷 없이 실행 · 그림은 전부 코드 · 이모지 0개 · 글꼴은 OFL 글꼴을 쓰는 글자만 넣음

   아트 바이블 — 분수 급행열차
   1. 장르·시점·카메라: 기차 운행 · 옆에서 · 카메라 숨쉬기(±9px, 층마다 다른 시차)
   2. 렌더링 방식·기준작: 2D 카툰 셀음영 · 쿠키런의 전경/배경 대비, 벚꽃 기차 장면의 앞쪽 초점 흐림
   3. 빛: 화면 밖 왼쪽 위 늦은 오후 해. 밝은 면은 따뜻하게(#ffe7a0 쪽), 그늘은 보라 쪽(#5a3d8a 쪽)
   4. 외곽선: 앞쪽 물체(수달·기차·쿠키·UI)만 #3b2516 3px, 먼 산·언덕은 선 없음
   5. 음영: 바탕·그늘·빛 3단 + 바닥 그림자, 금속·사탕은 하이라이트 점, 원통은 굽은 방향 5단 그라데이션
   6. 팔레트: 주조 벚꽃분홍·하늘·크림 / 강조 기차초록·빨강·금색 / 그늘 보라
   7. 질감·디테일: 벽·바닥·종이에 노이즈, 자갈 2,600개, 큰 것(나무·역)·중간(벤치·가로등)·작은 것(꽃·꽃잎) 3단계
   8. 깊이: 하늘 → 먼 산 → 언덕 마을 → 벚나무·울타리 → 역 → 선로·기차 → 수달 → 흐린 앞풀·가지 (8겹)
   9. 글꼴·UI 재질: 제목·이름판 Bagel Fat One, 본문·숫자 Jua / 법랑 배지, 종이 운송장, 호두나무·놋쇠 조작판
   10. 캐릭터: 수달 기관사 2.5등신, 화면 높이 1/2, 숨쉬기·깜빡임·꼬리·손짓
   ══════════════════════════════════════════════════════════════ */
const W=1280,H=720,M=28,TAU=Math.PI*2;
const QS=new URLSearchParams(location.search);
let LOW=QS.get('low')==='1';                 /* 저사양 미리보기: 주소 끝에 ?low=1 */
const DPR=LOW?1:Math.min(2,window.devicePixelRatio||1);
const cv=document.getElementById('cv'); cv.width=W*DPR; cv.height=H*DPR;
const ctx=cv.getContext('2d');
function fit(){ const s=Math.min(innerWidth/W,innerHeight/H); document.getElementById('stage').style.transform=`translate(-50%,-50%) scale(${s})`; }
addEventListener('resize',fit); fit();

/* ───────── 팔레트 ───────── */
const MID_INK='#8a6a60';   /* 중경 선 색(앞쪽 #3b2516보다 연하게) */
const P={
  ink:'#3b2516',
  navy:'#2b4686', fur:'#9a6440', muzzle:'#f3d9b6',
  gold:'#ffc84a', red:'#e2453b', green:'#2f9e6a',
  cookie:'#dc9b52', choc:'#5a2f1c',
  wall:'#fff1dc', roof:'#ff8a4c', blossom:'#ffbfd0',
};

/* ───────── 레이어(화면 밖 캔버스) ───────── */
function layer(w=W,h=H,m=M){ const c=document.createElement('canvas'); c.width=Math.ceil((w+2*m)*DPR); c.height=Math.ceil((h+2*m)*DPR);
  const g=c.getContext('2d'); g.setTransform(DPR,0,0,DPR,m*DPR,m*DPR); g.lineJoin='round'; g.lineCap='round'; return {c,g,w,h,m}; }
function blit(L,dx=0,dy=0,a=1){ if(a!==1) ctx.globalAlpha=a; ctx.drawImage(L.c,dx-L.m,dy-L.m,L.w+2*L.m,L.h+2*L.m); if(a!==1) ctx.globalAlpha=1; }
function clearL(L){ const g=L.g; g.save(); g.setTransform(1,0,0,1,0,0); g.clearRect(0,0,L.c.width,L.c.height); g.restore(); }
const TMP={}; function tmpFor(L){ const k=L.c.width+'x'+L.c.height; return TMP[k]||(TMP[k]=layer(L.w,L.h,L.m)); }

/* ───────── 색 ───────── */
function hex(h){ const n=parseInt(h.slice(1),16); return [(n>>16)&255,(n>>8)&255,n&255]; }
function toHex(r,g,b){ return '#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join(''); }
function mix(a,b,t){ const A=hex(a),B=hex(b); return toHex(A[0]+(B[0]-A[0])*t,A[1]+(B[1]-A[1])*t,A[2]+(B[2]-A[2])*t); }
function rgba(h,a){ const [r,g,b]=hex(h); return `rgba(${r},${g},${b},${a})`; }
const SH=c=>mix(mix(c,'#1c1030',.30),'#5a3d8a',.16);   /* 그늘: 어둡게 + 보라 쪽으로 */
const HL=c=>mix(mix(c,'#ffffff',.30),'#ffe7a0',.25);   /* 빛: 밝게 + 따뜻하게 */
function lin(g,x0,y0,x1,y1,st){ const gr=g.createLinearGradient(x0,y0,x1,y1); st.forEach(([o,c])=>gr.addColorStop(o,c)); return gr; }
function rad(g,x,y,r0,r1,st){ const gr=g.createRadialGradient(x,y,r0,x,y,r1); st.forEach(([o,c])=>gr.addColorStop(o,c)); return gr; }
function rng(seed){ let s=(seed*2654435761)>>>0||1; return ()=>{ s^=s<<13; s>>>=0; s^=s>>>17; s^=s<<5; s>>>=0; return s/4294967296; }; }

/* ───────── 도형 ───────── */
function rr(g,x,y,w,h,r){ r=Math.min(r,w/2,h/2); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
function el(g,x,y,rx,ry,rot=0){ g.moveTo(x+rx*Math.cos(rot),y+rx*Math.sin(rot)); g.ellipse(x,y,rx,ry,rot,0,TAU); g.closePath(); }
function circ(g,x,y,r){ g.moveTo(x+r,y); g.arc(x,y,r,0,TAU); g.closePath(); }

/* ───────── 셀 음영(3단) ─────────
   빛은 왼쪽 위에서 온다. 도형을 빛 쪽으로 밀어 덮으면 오른쪽 아래에 그늘 초승달이 남고,
   반대쪽으로 밀어 빼면 왼쪽 위에 빛 초승달이 남는다. */
const LX=-.62, LY=-.78;
/* 움직이는 물체용(닫힌 도형 하나) */
function cel(g,shape,base,o={}){
  const s=o.s??7, h=o.h??5, ow=o.ow??3;
  g.save();
  if(ow>0){ g.beginPath(); shape(g); g.lineWidth=ow*2; g.strokeStyle=o.ink||P.ink; g.stroke(); }
  g.beginPath(); shape(g); g.clip();
  g.fillStyle=o.sh||SH(base); g.fill();
  g.save(); g.translate(LX*s,LY*s); g.beginPath(); shape(g); g.restore(); g.fillStyle=base; g.fill();
  if(h>0){ g.beginPath(); shape(g); g.save(); g.translate(-LX*h,-LY*h); shape(g); g.restore(); g.globalAlpha=o.ha??.85; g.fillStyle=o.hl||HL(base); g.fill('evenodd'); g.globalAlpha=1; }
  if(o.gloss){ const [x,y,rx,ry,rot]=o.gloss; g.fillStyle='rgba(255,255,255,.8)'; g.beginPath(); el(g,x,y,rx,ry,rot??-.5); g.fill(); }
  g.restore();
}
/* 정적 레이어용(겹친 원 여러 개로 된 구름·꽃무더기도 됨) */
function celL(L,shape,base,o={}){
  const g=L.g, s=o.s??8, h=o.h??6, ow=o.ow??3, T=tmpFor(L);
  g.save();
  if(ow>0){ g.beginPath(); shape(g); g.lineWidth=ow*2; g.strokeStyle=o.ink||P.ink; g.stroke(); }
  g.beginPath(); shape(g); g.fillStyle=base; g.fill(); g.restore();
  const cres=(dx,dy,col,a)=>{ clearL(T); const t=T.g; t.save(); t.beginPath(); shape(t); t.fillStyle=col; t.fill();
    t.globalCompositeOperation='destination-out'; t.translate(dx,dy); t.beginPath(); shape(t); t.fill(); t.restore();
    g.save(); g.setTransform(1,0,0,1,0,0); g.globalAlpha=a; g.drawImage(T.c,0,0); g.restore(); };
  if(s>0) cres(LX*s,LY*s,o.sh||SH(base),o.sa??1);
  if(h>0) cres(-LX*h,-LY*h,o.hl||HL(base),o.ha??.85);
}

/* ───────── 질감(값 노이즈) ───────── */
function makeNoise(n,seed,octs){ const c=document.createElement('canvas'); c.width=c.height=n; const g=c.getContext('2d'); const img=g.createImageData(n,n); const R=rng(seed);
  const grids=octs.map(([f,a])=>{ const S=f+1, G=new Float32Array(S*S); for(let i=0;i<f;i++) for(let j=0;j<f;j++) G[i*S+j]=R();
    for(let i=0;i<f;i++) G[i*S+f]=G[i*S]; for(let j=0;j<=f;j++) G[f*S+j]=G[j]; return {f,a,G,S}; });
  for(let y=0;y<n;y++) for(let x=0;x<n;x++){ let v=0;
    for(const {f,a,G,S} of grids){ const fx=x/n*f, fy=y/n*f, ix=fx|0, iy=fy|0, tx=fx-ix, ty=fy-iy, sx=tx*tx*(3-2*tx), sy=ty*ty*(3-2*ty);
      v+=a*((G[iy*S+ix]*(1-sx)+G[iy*S+ix+1]*sx)*(1-sy)+(G[(iy+1)*S+ix]*(1-sx)+G[(iy+1)*S+ix+1]*sx)*sy); }
    const k=(y*n+x)*4, c8=Math.max(0,Math.min(255,v*255)); img.data[k]=img.data[k+1]=img.data[k+2]=c8; img.data[k+3]=255; }
  g.putImageData(img,0,0); return c; }
let NOISE=null, GRAIN=null;
function tex(g,img,alpha,mode){ g.save(); g.globalCompositeOperation=mode||'overlay'; g.globalAlpha=alpha; g.fillStyle=g.createPattern(img,'repeat'); g.fillRect(-M,-M,W+2*M,H+2*M); g.restore(); }

/* ───────── 흐림(줄였다 키우기: 구형 PC에서도 빠름) ───────── */
function blurCanvas(src,times){ let cur=src;
  for(let i=0;i<times;i++){ const c=document.createElement('canvas'); c.width=Math.max(1,cur.width>>1); c.height=Math.max(1,cur.height>>1); const g=c.getContext('2d'); g.imageSmoothingQuality='high'; g.drawImage(cur,0,0,c.width,c.height); cur=c; }
  for(let i=0;i<times;i++){ const c=document.createElement('canvas'); c.width=cur.width*2; c.height=cur.height*2; const g=c.getContext('2d'); g.imageSmoothingQuality='high'; g.drawImage(cur,0,0,c.width,c.height); cur=c; }
  const out=document.createElement('canvas'); out.width=src.width; out.height=src.height; const og=out.getContext('2d'); og.imageSmoothingQuality='high'; og.drawImage(cur,0,0,out.width,out.height); return out; }

/* ───────── 글자(게임 글꼴 + 외곽선 + 돌출) ───────── */
function txt(g,s,x,y,o){ g.save(); g.font=`${o.size}px ${o.font||'Jua'}, sans-serif`; g.textAlign=o.align||'left'; g.textBaseline=o.base||'alphabetic'; g.lineJoin='round'; g.miterLimit=2;
  if(o.ex){ g.fillStyle=o.exc; g.strokeStyle=o.exc; g.lineWidth=o.sw||0; for(let i=o.ex;i>=1;i--){ if(o.sw) g.strokeText(s,x,y+i); g.fillText(s,x,y+i); } }
  if(o.sw){ g.strokeStyle=o.stroke; g.lineWidth=o.sw; g.strokeText(s,x,y); }
  g.fillStyle=o.fill; g.fillText(s,x,y); g.restore(); }

/* ══════════════ 1. 하늘 ══════════════ */
function drawSky(L){ const g=L.g;
  g.fillStyle=lin(g,0,-M,0,H,[[0,'#3e9de4'],[.3,'#7cc6f0'],[.5,'#bfe3ee'],[.62,'#ffe5c8'],[1,'#ffd2a6']]); g.fillRect(-M,-M,W+2*M,H+2*M);
  g.fillStyle=rad(g,-170,-150,0,1050,[[0,'rgba(255,244,205,1)'],[.22,'rgba(255,228,175,.75)'],[.55,'rgba(255,214,160,.2)'],[1,'rgba(255,214,160,0)']]); g.fillRect(-M,-M,W+2*M,H+2*M);
  const R=rng(11); g.save();
  for(let i=0;i<10;i++){ const x=R()*W, y=24+R()*150, w=110+R()*230; g.globalAlpha=.22+R()*.2;
    g.fillStyle=lin(g,x-w,y,x+w,y,[[0,'rgba(255,255,255,0)'],[.5,'rgba(255,255,255,1)'],[1,'rgba(255,255,255,0)']]); g.beginPath(); el(g,x,y,w,3+R()*4,-.05); g.fill(); }
  g.restore(); }

/* ══════════════ 2. 먼 산 · 언덕 마을 (선 없이, 멀수록 하늘색에 섞임) ══════════════ */
function mountain(g,x,y,w,base,shade,snow,bot){
  g.beginPath(); g.moveTo(x-w/2,bot); g.quadraticCurveTo(x-w*.2,y+w*.12,x,y); g.quadraticCurveTo(x+w*.22,y+w*.13,x+w/2,bot); g.closePath(); g.fillStyle=base; g.fill();
  g.beginPath(); g.moveTo(x,y); g.quadraticCurveTo(x+w*.22,y+w*.13,x+w/2,bot); g.lineTo(x+w*.06,bot); g.quadraticCurveTo(x+w*.05,y+w*.25,x,y); g.closePath(); g.fillStyle=shade; g.fill();
  if(snow){ g.beginPath(); g.moveTo(x,y); g.quadraticCurveTo(x-w*.07,y+w*.04,x-w*.12,y+w*.085); g.lineTo(x-w*.06,y+w*.07); g.lineTo(x-w*.02,y+w*.1); g.lineTo(x+w*.03,y+w*.075); g.lineTo(x+w*.09,y+w*.095); g.quadraticCurveTo(x+w*.05,y+w*.03,x,y); g.closePath(); g.fillStyle=snow; g.fill(); }
}
function drawFar(L){ const g=L.g;
  for(const [x,y,w] of [[-60,262,330],[170,222,360],[420,250,320],[660,214,380],[930,240,350],[1170,218,370],[1390,256,320]]) mountain(g,x,y,w,'#b6b0e2','rgba(118,104,186,.38)','#f6f3ff',430);
  g.fillStyle=lin(g,0,230,0,420,[[0,'rgba(255,232,210,0)'],[1,'rgba(255,230,205,.8)']]); g.fillRect(-M,200,W+2*M,240);
  for(const [x,y,w] of [[40,300,300],[300,286,320],[560,304,300],[820,290,330],[1080,300,320],[1320,292,300]]) mountain(g,x,y,w,'#8fbccb','rgba(60,100,140,.3)',null,440);
  g.fillStyle=lin(g,0,280,0,440,[[0,'rgba(255,232,210,0)'],[1,'rgba(255,230,205,.55)']]); g.fillRect(-M,260,W+2*M,200);
}
function drawHills(L){ const g=L.g, R=rng(5);
  const band=(y0,amp,col,seed)=>{ const r=rng(seed); g.beginPath(); g.moveTo(-M,H); g.lineTo(-M,y0); for(let x=-M;x<=W+M;x+=16){ const y=y0+Math.sin(x*.006+seed)*amp+Math.sin(x*.017+seed*2)*amp*.35; g.lineTo(x,y); } g.lineTo(W+M,H); g.closePath(); g.fillStyle=col; g.fill(); return r; };
  band(352,14,'#a6d3b2',3);
  /* 작은 집 · 나무 (멀어서 작고 흐림) */
  for(let i=0;i<26;i++){ const x=R()*W, y=356+Math.sin(x*.006+3)*14+R()*16; const k=R();
    if(k<.42){ const w=10+R()*8, hh=8+R()*5; g.fillStyle='#fff6ea'; g.fillRect(x,y-hh,w,hh); g.fillStyle=['#e97a5a','#6b8fd6','#e9a24a'][i%3]; g.beginPath(); g.moveTo(x-2,y-hh); g.lineTo(x+w/2,y-hh-6); g.lineTo(x+w+2,y-hh); g.closePath(); g.fill(); g.fillStyle='rgba(80,90,120,.35)'; g.fillRect(x+w*.3,y-hh*.6,2.5,3); }
    else if(k<.75){ g.fillStyle='#6fae86'; g.beginPath(); el(g,x,y-7,7,9); g.fill(); }
    else { g.fillStyle='#f5b7c8'; g.beginPath(); el(g,x,y-8,9,8); g.fill(); } }
  band(384,10,'#8ec79e',7);
  g.fillStyle=lin(g,0,330,0,440,[[0,'rgba(255,236,214,.45)'],[1,'rgba(255,236,214,.12)']]); g.fillRect(-M,330,W+2*M,120);
}

/* ══════════════ 3. 벚나무 · 울타리 ══════════════ */
function blossomTree(L,cx,cy,rad0,seed,trunk=true){ const g=L.g, R=rng(seed);
  if(trunk){ g.save(); g.lineCap='round';
    const br=[[cx,cy+rad0*1.35,cx-4,cy+rad0*.2,22],[cx-2,cy+rad0*.5,cx-rad0*.55,cy-rad0*.05,11],[cx,cy+rad0*.45,cx+rad0*.5,cy-rad0*.1,10],[cx-2,cy+rad0*.3,cx+rad0*.05,cy-rad0*.45,9]];
    for(const [x0,y0,x1,y1,w] of br){ g.strokeStyle=P.ink; g.lineWidth=w+3; g.beginPath(); g.moveTo(x0,y0); g.quadraticCurveTo((x0+x1)/2+8,(y0+y1)/2,x1,y1); g.stroke(); }
    for(const [x0,y0,x1,y1,w] of br){ g.strokeStyle='#6e4433'; g.lineWidth=w; g.beginPath(); g.moveTo(x0,y0); g.quadraticCurveTo((x0+x1)/2+8,(y0+y1)/2,x1,y1); g.stroke();
      g.strokeStyle='rgba(255,215,170,.35)'; g.lineWidth=w*.3; g.beginPath(); g.moveTo(x0-w*.25,y0); g.quadraticCurveTo((x0+x1)/2+8-w*.25,(y0+y1)/2,x1-w*.25,y1); g.stroke(); }
    g.restore(); }
  const blobs=[]; for(let i=0;i<13;i++){ const a=R()*TAU, d=Math.sqrt(R())*rad0*.62; blobs.push([cx+Math.cos(a)*d*1.25,cy+Math.sin(a)*d*.8,rad0*(.36+R()*.22)]); }
  const shape=t=>{ for(const [x,y,r] of blobs) circ(t,x,y,r); };
  celL(L,shape,P.blossom,{s:16,h:8,ow:1.7,sh:'#e48aa9',hl:'#fff1f5',ink:'#a0607a'});
  /* 꽃잎 점 질감 */
  const g2=L.g; g2.save(); g2.beginPath(); shape(g2); g2.clip();
  for(let i=0;i<rad0*2.2;i++){ const x=cx+(R()-.5)*rad0*2.4, y=cy+(R()-.5)*rad0*1.7; const dark=(x-cx)*-LX+(y-cy)*-LY>rad0*.15;
    g2.fillStyle=dark?'rgba(214,105,145,.55)':'rgba(255,255,255,.7)'; g2.beginPath(); circ(g2,x,y,1.6+R()*2.2); g2.fill(); }
  g2.restore(); }
function drawTrees(L){ const g=L.g;
  /* 하얀 울타리 */
  for(let x=-20;x<560;x+=19){ g.fillStyle='#fffaf2'; g.strokeStyle='#8a6a58'; g.lineWidth=2; g.beginPath(); g.moveTo(x,446); g.lineTo(x,410); g.lineTo(x+6,402); g.lineTo(x+12,410); g.lineTo(x+12,446); g.closePath(); g.fill(); g.stroke(); g.fillStyle='rgba(120,90,140,.25)'; g.fillRect(x+8,410,4,36); }

function glowDot(x,y,r,col,a){ gg.globalAlpha=a; gg.fillStyle=rad(gg,x/4,y/4,0,r/4,[[0,col],[1,'rgba(0,0,0,0)']]); gg.beginPath(); circ(gg,x/4,y/4,r/4); gg.fill(); gg.globalAlpha=1; }
function bloom(list,a){ gg.clearRect(0,0,GW,GH); for(const f of list) f(); gb.clearRect(0,0,GW/2,GH/2); gb.drawImage(glowC,0,0,GW/2,GH/2);
  ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=a; ctx.drawImage(glowB,0,0,W,H); ctx.globalAlpha=a*.6; ctx.drawImage(glowC,0,0,W,H); ctx.restore(); }

/* ══════════════ 시작 ══════════════ */
let Lsky,Lfar,Lhills,Ltrees,Lstation,Lground,Ltrain,Lfore,Lui,Lrays,Lvig,Lbase=null,clouds=[];
const birds=[{x:840,y:150,v:22,ph:0,s:1},{x:900,y:172,v:22,ph:1.7,s:.8},{x:1180,y:120,v:18,ph:.6,s:.9}];
function drawBird(g,b,t){ const f=Math.sin(t*9+b.ph); g.save(); g.translate(b.x,b.y); g.scale(b.s,b.s); g.strokeStyle='#6a5f8e'; g.lineWidth=2.4; g.beginPath(); g.moveTo(-9,-f*3); g.quadraticCurveTo(-4,-5-f*3,0,0); g.quadraticCurveTo(4,-5-f*3,9,-f*3); g.stroke(); g.restore(); }
async function build(){
  try{ await Promise.all([document.fonts.load('30px Bagel','쿠키역0123'),document.fonts.load('25px Jua','과자 마을선')]); }catch(e){}
  NOISE=makeNoise(256,3,[[4,.42],[8,.26],[16,.17],[48,.15]]);
  Lsky=layer(); drawSky(Lsky);
  Lfar=layer(); drawFar(Lfar);
  Lhills=layer(); drawHills(Lhills);
  Ltrees=layer(); drawTrees(Ltrees);
  Lstation=layer(); drawStation(Lstation);
  Lground=layer(); drawGround(Lground);
  Ltrain=layer(); drawTrain(Ltrain);
  Lfore=layer(); drawFore(Lfore); Lfore.c=blurCanvas(Lfore.c,LOW?2:3);
  Lui=layer(W,H,0); drawUI(Lui);
  Lrays=layer(); drawRays(Lrays);
  Lvig=layer(); drawVignette(Lvig);
  clouds=[{L:cloudSprite(4,250,110),x:700,y:86,v:6,f:.12},{L:cloudSprite(8,190,86),x:1010,y:150,v:4,f:.12},{L:cloudSprite(12,300,120),x:1300,y:40,v:7,f:.12},{L:cloudSprite(16,170,76),x:520,y:250,v:3,f:.12}];
  makePetalBlur(); initParticles();
  if(LOW){ /* 저사양: 카메라를 고정하고, 움직이지 않는 층을 한 장으로 합쳐 한 번만 그린다 */
    Lbase=layer(); const g=Lbase.g; g.save(); g.setTransform(1,0,0,1,0,0); g.drawImage(Lsky.c,0,0); g.restore();
    for(const c of clouds) g.drawImage(c.L.c,c.x-c.L.m,c.y-c.L.m,c.L.w+2*c.L.m,c.L.h+2*c.L.m);
    g.save(); g.setTransform(1,0,0,1,0,0); for(const L of [Lfar,Lhills,Ltrees,Lstation,Lground]) g.drawImage(L.c,0,0); g.restore(); }
  requestAnimationFrame(frame);
}
let last=0, T=0;
function frame(now){ const dt=Math.min(.05,(now-last)/1000||0); last=now; T+=dt; const t=T;
  stepParticles(dt,t);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const cx=LOW?0:Math.sin(t*.16)*9, cy=LOW?0:Math.sin(t*.11)*3;          /* 카메라 숨쉬기 → 층마다 다르게 움직여 시차가 생김 */
  if(LOW) blit(Lbase);
  else { blit(Lsky);
    for(const c of clouds){ c.x-=c.v*dt; if(c.x<-c.L.w-40) c.x=W+40; blit(c.L,c.x+cx*c.f,c.y+cy*c.f); }
    for(const b of birds){ b.x-=b.v*dt; if(b.x<-30) b.x=W+30; drawBird(ctx,b,t); }
    blit(Lfar,cx*.15,cy*.15); blit(Lhills,cx*.3,cy*.3); blit(Ltrees,cx*.55,cy*.55);
    blit(Lstation,cx*.75,cy*.75); blit(Lground,cx,cy); }
  /* 증기(굴뚝 뒤로 흘러감) */
  ctx.save(); ctx.translate(cx,cy); for(const p of puffs) drawPuff(ctx,p); ctx.restore();
  blit(Ltrain,cx,cy+Math.sin(t*16)*.35);
  ctx.save(); ctx.translate(cx*1.15,cy*1.15); drawOtter(ctx,t); ctx.restore();
  /* 꽃잎 */
  for(const p of petals) if(!p.near) drawPetal(ctx,p,t);
  /* 반짝임 */
  ctx.save(); ctx.translate(cx,cy); ctx.globalCompositeOperation='lighter';
  for(const s of sparks){ const k=s.life/.6, r=7*Math.sin(k*Math.PI); ctx.fillStyle='rgba(255,246,200,.95)'; star4(ctx,s.x,s.y,r); ctx.fill(); } ctx.restore();
  blit(Lfore,cx*1.6,cy*1.6);
  for(const p of petals) if(p.near) drawPetal(ctx,p,t);
  if(!LOW){ ctx.save(); ctx.globalCompositeOperation='screen'; blit(Lrays,0,0,.75+Math.sin(t*.5)*.2); ctx.restore();
    ctx.save(); ctx.globalCompositeOperation='lighter'; for(const m of motes){ const a=.35+.35*Math.sin(t*1.7+m.ph); ctx.fillStyle=`rgba(255,240,200,${a})`; ctx.beginPath(); circ(ctx,m.x+Math.sin(t*.3+m.ph)*14,m.y+Math.cos(t*.25+m.ph)*10,m.s); ctx.fill(); } ctx.restore();
    bloom([()=>glowDot(-60,-50,520,'rgba(255,236,180,.9)',1),()=>glowDot(1203+cx,391+cy,70,'rgba(255,230,150,1)',.9),()=>glowDot(1252+cx*.75,302+cy*.75,46,'rgba(255,220,80,1)',.9+.1*Math.sin(t*3)),
      ()=>glowDot(410+cx*.75,331+cy*.75,58,'rgba(255,214,140,1)',.75),()=>glowDot(690+cx*.75,331+cy*.75,58,'rgba(255,214,140,1)',.75)],.85);
    blit(Lvig); }
  blit(Lui);
  /* UI 위 움직이는 것: 현재 역 표시, 계기판 빛, 힌트 전구 */
  const pulse=.5+.5*Math.sin(t*4);
  ctx.save(); ctx.fillStyle=`rgba(255,160,60,${.35+.35*pulse})`; ctx.beginPath(); circ(ctx,96,60,9+pulse*4); ctx.fill(); ctx.fillStyle='#ff8a3d'; ctx.strokeStyle='#1a2850'; ctx.lineWidth=2.5; ctx.beginPath(); circ(ctx,96,60,6.5); ctx.fill(); ctx.stroke(); ctx.restore();
  if(!LOW) bloom([()=>glowDot(808,647,60,'rgba(255,150,40,1)',.55+.08*Math.sin(t*23)),()=>glowDot(930,647,60,'rgba(255,150,40,1)',.5+.08*Math.sin(t*19)),()=>glowDot(1236,616,64,'rgba(255,224,90,1)',.55+.25*pulse)],.9);
  requestAnimationFrame(frame); }
addEventListener('keydown',e=>{ if(e.key==='l'||e.key==='L'){ location.search=LOW?'':'?low=1'; } });
build();
</script>

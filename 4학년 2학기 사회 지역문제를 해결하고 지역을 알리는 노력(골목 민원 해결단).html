html,body{margin:0;height:100%;background:#141230;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform:translate(-50%,-50%);transform-origin:50% 50%;overflow:hidden;background:#64b85a}
#cv{position:absolute;left:0;top:0;width:1280px;height:720px;display:block;image-rendering:pixelated}
#nameIn{position:absolute;left:432px;top:236px;width:416px;height:56px;z-index:3;border:0;outline:0;background:transparent;color:#24305e;font:36px Galmuri,sans-serif;text-align:center;caret-color:#c23a4a;display:none;padding:0;-webkit-user-select:text;user-select:text}
#nameIn.show{display:block}
#result,#settings{position:absolute;inset:0;z-index:4;display:none;overflow-y:auto;background:rgba(16,18,50,.6);padding:28px 0 40px;font:24px Galmuri,sans-serif;color:#fff;-webkit-user-select:text;user-select:text}
#result.show,#settings.show{display:block}
#settings{padding-top:96px}
/* 파란 픽셀 창: 남색 바깥 4px → 흰 테 4px → 4단 파랑, 모서리 4px 깎기 */
.pw{position:relative;margin:0 auto;width:880px;box-sizing:border-box;padding:24px 32px 28px;background:linear-gradient(#3d58c4 0 25%,#3550b4 25% 50%,#2d47a3 50% 75%,#263e92 75%);
  border:4px solid #fff;box-shadow:0 0 0 4px #1a1630,-8px 16px 0 4px rgba(26,22,48,.35);
  text-shadow:2px 0 #1a1630,-2px 0 #1a1630,0 2px #1a1630,0 -2px #1a1630}
.pw.sm{width:560px}
#result.show .pw,#settings.show .pw{animation:open .35s steps(5) both}
@keyframes open{from{transform:translateY(-30px);opacity:0}to{transform:none;opacity:1}}
h2{font:48px Galmuri,sans-serif;color:#ffd04a;margin:0 0 14px}h2 small{font-size:24px;color:#cfe3ff;margin-left:10px}
h3{font:36px Galmuri,sans-serif;color:#ffd04a;margin:26px 0 10px;border-top:4px dashed #6fa8ff;padding-top:14px}h3 small{font-size:24px;color:#cfe3ff;margin-left:10px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stats div{background:#eef4ff;border:4px solid #1a1630;padding:8px 10px;text-shadow:none;color:#24305e}.stats i{display:block;font-style:normal;font-size:24px;color:#3a5cc0}.stats b{font:36px Galmuri,sans-serif}
.book{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px 12px}
.pt{display:flex;flex-direction:column;align-items:center;gap:2px}.pt img{width:96px;height:auto;box-sizing:border-box;image-rendering:pixelated;background:#9fc3ff;border:4px solid #1a1630}.pt i{font-style:normal;font-size:24px;text-align:center;line-height:1.25;word-break:keep-all}
.pt.off img{filter:grayscale(1) brightness(.35)}
/* 오답 노트 한 장 = 작은 밝은 픽셀 창(남색 바깥 테 + 하늘색 안쪽 테) */
.note{background:#eef4ff;color:#24305e;text-shadow:none;border:4px solid #1a1630;box-shadow:inset 0 0 0 4px #9fc3ff,4px 4px 0 0 rgba(26,22,48,.35);padding:14px 18px;margin-bottom:14px;font-size:24px;line-height:1.5}
.note.good{box-shadow:inset 0 0 0 4px #9fd86a,4px 4px 0 0 rgba(26,22,48,.35)}
.nq b{display:block;color:#3a5cc0;font-size:24px}.nr{padding:2px 0;display:flex;gap:12px}.nr em{flex:0 0 108px;font-style:normal;color:#c23a4a}.nr.ok em{color:#2f8a3a}.nr.ex em{color:#3a5cc0}
.btns{display:flex;gap:14px;justify-content:center;margin-top:22px}
.btns button,.tg{font:24px Galmuri,sans-serif;color:#fff;text-shadow:2px 0 #1a1630,-2px 0 #1a1630,0 2px #1a1630,0 -2px #1a1630;background:#3550b4;border:4px solid #fff;outline:4px solid #1a1630;padding:8px 26px;cursor:pointer}
.btns button.hot{background:#c23a4a}.btns button:active,.tg:active{transform:translateY(4px)}
.tg{display:flex;width:100%;justify-content:space-between;align-items:center;margin:14px 0;font-size:24px;padding:10px 18px}.tg em{font-style:normal;color:#ffd04a}
</style>

<body>
<div id="stage"><canvas id="cv" width="1280" height="720"></canvas><input id="nameIn" maxlength="10" autocomplete="off" spellcheck="false" aria-label="단원 이름"><div id="result"></div><div id="settings"></div></div>
<script>
/* ═══════════════════════════════════════════════════════════════════════
   골목 민원 해결단 — 4학년 2학기 사회 2. 지역문제를 해결하고 지역을 알리는 노력
   캔버스 2D 픽셀 게임. 압축하지 않는다. 섹션마다 주석을 달아 다음 세션이 바로 고칠 수 있게 한다.

   스타일 카드 — 골목 민원 해결단
   세계:       흑백으로 바랜 동네의 여섯 구역. 주민 민원을 해결하면 구역이 색을 되찾고(지역문제의 해결),
               후반에는 장터·축제·홍보 광장으로 지역의 자랑거리를 알린다(지역을 알리는 노력)
   계열·스타일: P 픽셀 · P1 위에서 보는 픽셀 마을 (docs/스타일_카탈로그.md)
   6축:        모양 블록·격자 / 렌더링 P1(320×180을 정수 4배) / 팔레트 제한 40색(풀빛·하늘·벽돌 + 남색 그늘)
               / 빛 오른쪽 위 해, 구역마다 한낮→오후→황금빛→노을→밤 등불(계단 빛) / 시점 3/4 위 / UI 파란 픽셀 창
   최근 3개와 다른 축: 열기구 6/6 · 울림 밴드 6/6 · 관제사 6/6
   같은 과목 최근 계열: I(고려 활자)·I(달려라 경제 쿠키) → 이번 P(겹침 없음)
   과목 조건: 사람·가게의 흐름이 보이고 선택 결과가 세계 변화로 → 주민이 오가고, 해결하면 구역이 바뀐다
   탐험 칸 여부: 아니오(저장소 첫 픽셀 마을)

   아트 바이블 — 골목 민원 해결단

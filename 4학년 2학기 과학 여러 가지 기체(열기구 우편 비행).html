html,body{margin:0;height:100%;background:#2a2340;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform:translate(-50%,-50%);transform-origin:50% 50%;overflow:hidden;background:#cfe9f3}
#cv{position:absolute;left:0;top:0;width:1280px;height:720px;display:block}
#nameIn{position:absolute;left:705px;top:296px;width:310px;height:56px;z-index:3;border:0;outline:0;background:transparent;color:#3a2a3f;font:36px Gowun,sans-serif;text-align:center;caret-color:#e8553f;display:none;padding:0;-webkit-user-select:text;user-select:text}
#nameIn.show{display:block}
#result,#settings,#pause{position:absolute;inset:0;z-index:4;display:none;overflow-y:auto;background:rgba(40,30,70,.5);padding:28px 0 40px;font:20px Gowun,sans-serif;color:#3a2a3f;-webkit-user-select:text;user-select:text}
#result.show,#settings.show,#pause.show{display:block}
#settings,#pause{padding-top:110px}
.paper,.card{position:relative;margin:0 auto;width:780px;background:#fffaf0;border:3px solid #3a2a3f;border-radius:8px;padding:34px 50px 34px;box-sizing:border-box;
background-image:repeating-linear-gradient(135deg,#e8553f 0 14px,#fff8ea 14px 28px,#3a6ac8 28px 42px,#fff8ea 42px 56px);background-size:100% 100%;
-webkit-mask:none}
.paper::before,.card::before{content:"";position:absolute;inset:12px;background:#fffaf0;border-radius:4px;z-index:0}
.paper>*,.card>*{position:relative;z-index:1}
.card{width:560px}
#result.show .paper{animation:open .5s cubic-bezier(.2,1.3,.4,1) both}
@keyframes open{from{transform:translateY(-40px) rotate(-1.5deg);opacity:0}to{transform:none;opacity:1}}
.ph{display:flex;justify-content:space-between;align-items:baseline;border-bottom:3px dashed #c9b8a0;padding-bottom:6px;margin-bottom:6px}
.ph b{font:64px Dongle,sans-serif;line-height:1;color:#e8553f;text-shadow:3px 0 #3a2a3f,-3px 0 #3a2a3f,0 3px #3a2a3f,0 -3px #3a2a3f,2px 2px #3a2a3f,-2px -2px #3a2a3f,2px -2px #3a2a3f,-2px 2px #3a2a3f,0 6px #8a2a2a}
.ph span{font-size:18px;color:#9a6a4a}
.who{margin:12px 0 14px;font-size:22px}.who b{font:34px Dongle,sans-serif;color:#3a6ac8}
.who .gr{display:inline-block;margin-left:10px;color:#c42f2f;border:3px solid #c42f2f;border-radius:50%;padding:4px 12px;font:26px Dongle,sans-serif;transform:rotate(-8deg);animation:stamp .35s 1s cubic-bezier(.3,1.6,.5,1) both}
@keyframes stamp{from{opacity:0;transform:rotate(-8deg) scale(2.2)}to{opacity:1;transform:rotate(-8deg) scale(1)}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cell{background:#fff3dc;border:2px solid #3a2a3f;border-radius:10px;padding:8px 12px;animation:pop .3s ease-out both}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
.cell i{display:block;font-style:normal;font-size:16px;color:#9a6a4a}.cell em{font:44px Dongle,sans-serif;font-style:normal;line-height:1;color:#3a2a3f}.cell small{font-size:22px}
.qs{margin:16px 0 4px;display:flex;flex-wrap:wrap;gap:6px}
.qd{display:inline-flex;align-items:center;gap:4px;border:2px solid #3a2a3f;border-radius:3px;padding:2px 9px;font:26px Dongle,sans-serif;background:#fffaf0;box-sizing:border-box;outline:2px dotted #fffaf0;outline-offset:-5px}
.qd.w{background:#ffe9b0}.qd.off{background:#e9e2d8;color:#a89a8a}.qd i{width:10px;height:10px;background:#3a8a2a;border-radius:50%}.qd.w i{background:#e8a020}.qd.off i{background:#ccc}
h3{font:40px Dongle,sans-serif;color:#3a6ac8;margin:20px 0 8px;border-top:3px dashed #c9b8a0;padding-top:12px}h3 small{font:18px Gowun,sans-serif;color:#9a6a4a;margin-left:10px}
.note{border:2px solid #3a2a3f;border-left:8px solid #e8553f;border-radius:6px;padding:10px 14px;margin-bottom:10px;background:#fff8e6}
.nq{font-size:20px;line-height:1.5;margin-bottom:6px}.nq span{display:inline-block;background:#e8553f;color:#fff;border-radius:8px;padding:0 8px;margin-right:6px;font-size:16px}
.nr{font-size:19px;line-height:1.5;padding:3px 0}.nr b{display:inline-block;width:52px;color:#c42f2f}.nr.ok b{color:#3a8a2a}.nr.ex b{color:#3a6ac8}
.unlock{margin:14px 0;padding:10px 14px 10px 64px;border:3px solid #c42f2f;border-radius:10px;font-size:22px;color:#8a2a2a;background:#fff3e0;position:relative}.unlock::before{content:'';position:absolute;left:14px;top:50%;width:34px;height:34px;margin-top:-17px;border:3px solid #c42f2f;border-radius:50%;background:radial-gradient(circle,#ffc93c 0 7px,transparent 8px)}

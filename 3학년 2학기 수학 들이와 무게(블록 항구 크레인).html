#note .nt{position:absolute;left:120px;right:120px;top:24px;height:70px;background:#26304f;border:4px solid #1d2340;border-bottom:12px solid #151a2c;display:flex;align-items:center;justify-content:space-between;padding:0 20px}
#note h2{margin:0;font:38px Gugi,sans-serif;color:#ffd23f}
#note .bb{font:30px DoH,sans-serif;color:#1d2340;background:#ffd23f;border:4px solid #1d2340;border-bottom:10px solid #d49b00;padding:6px 26px;cursor:pointer}
#note .bb:active{border-bottom-width:4px;margin-top:6px}
#note .nl{position:absolute;left:120px;right:120px;top:124px;bottom:20px;overflow-y:auto;touch-action:pan-y;padding-right:8px}
#note .nc{background:#eef3ff;color:#1d2340;border:4px solid #1d2340;border-bottom:12px solid #aab6d6;margin:0 0 18px;padding:0 0 12px}
#note .nh{background:var(--c);color:#fff;font-size:27px;padding:8px 16px;border-bottom:4px solid #1d2340;text-shadow:0 2px 0 #1d2340}
#note .nh span{float:right;font-size:24px}
#note .q{font-size:27px;line-height:1.45;margin:12px 16px}
#note .row{display:flex;gap:12px;align-items:center;margin:6px 16px;font-size:27px}
#note .row i{font-style:normal;background:#26304f;color:#ffd23f;padding:2px 12px;border:3px solid #1d2340}
#note .my{color:#c2321f}
#note .ok{color:#2f8a3a}
#note .ex{font-size:25px;line-height:1.45;margin:10px 16px 0;background:#fff8d6;border:3px solid #1d2340;padding:8px 12px}
#note .none{font-size:32px;text-align:center;margin-top:80px}
/* 세로로 든 휴대폰·태블릿: 가로로 돌리기 안내 (블록 판, 이대로 하기 가능) */
#rot{display:none;position:fixed;inset:0;z-index:9;background:rgba(13,18,34,.82);align-items:center;justify-content:center;font-family:DoH,sans-serif}
#rot .rb{width:min(84vw,420px);background:#ffcf33;border:4px solid #1d2340;border-bottom:16px solid #c99400;padding:22px 18px 20px;text-align:center;color:#1d2340}
#rot .ph{width:56px;height:92px;margin:6px auto 18px;background:#eef3ff;border:5px solid #1d2340;border-bottom-width:12px;animation:rotph 2.4s ease-in-out infinite}
#rot .ph i{display:block;width:30px;height:46px;margin:10px auto 0;background:#3aa3de;border:3px solid #1d2340}
@keyframes rotph{0%,30%{transform:rotate(0)}55%,85%{transform:rotate(-90deg)}100%{transform:rotate(0)}}
#rot p{margin:0 0 18px;font-size:27px;line-height:1.35}
#rot button{font:28px DoH,sans-serif;color:#fff;background:#57c45c;border:4px solid #1d2340;border-bottom:10px solid #2f8a3a;padding:6px 26px;text-shadow:0 2px 0 #1d2340}
#rot button:active{border-bottom-width:4px;margin-top:6px}
</style>
</head>
<body>
<div id="stage"><canvas id="gl"></canvas><canvas id="hud"></canvas><input id="name" maxlength="8" autocomplete="off" spellcheck="false" aria-label="이름"><div id="note"></div></div>
<div id="rot"><div class="rb"><div class="ph"><i></i></div><p>휴대폰을 가로로 돌리면<br>항구가 크게 보여요</p><button id="rotOk">이대로 하기</button></div></div>

<script>
/* 블록 항구 크레인 — 3학년 2학기 수학 5. 들이와 무게 (30문항: 학습지 20 + 변형 10)

스타일 카드 — 블록 항구 크레인
  세계: 블록으로 지은 작은 항구 '통통항'. 배에 짐·물을 알맞게 실어 보낼수록 부두 뒤에 건물이 한 층씩 쌓여 항구가 자란다
  계열·스타일: B 블록·다각형 · B1 낮 복셀 (기준작: Autonomica, 복셀 타이쿤)
  6축: ① 블록·격자 ② B1 낮 복셀 ③ 고채도 원색(바다 파랑·크레인 노랑·빨강) ④ 오전 왼쪽 낮은 옆빛(긴 그림자) + 바다 물결빛
       ⑤ 디오라마(앞 위에서 비스듬히, 천천히 숨쉬는 카메라) ⑥ 블록 단추 + LED 점 전광판

아트 바이블 — 블록 항구 크레인
 1. 장르·시점·카메라: 크레인 퍼즐 경영 · 디오라마(앞 위 약 25°, 왼쪽에서 비스듬히) · 카메라가 좌우로 숨쉬기, 화면이 바뀔 때는 부드럽게 날아감
 2. 렌더링: B1 낮 복셀(InstancedMesh, 위가 막힌 칸 ×0.8 가짜 그늘, 칸마다 ±4% 색 흔들림) · Autonomica의 블록 디오라마
 3. 빛: 화면 밖 왼쪽, 오전의 낮은 옆빛(긴 그림자가 오른쪽으로) + 하늘 반구광, 그늘은 남보라 #6a5a9a 쪽, 배 옆구리에 물결 반사빛
 4. 외곽선: 3D에는 없음(블록 모서리 그늘로 형태를 낸다). UI 블록 단추와 글자만 먹 #1d2340 4px
 5. 음영: 블록 면 3단(윗면 밝음·옆면 중간·가려진 칸 어둠) + 바닥 그림자(PCFSoft, 저사양은 납작한 그림자 판)
 6. 팔레트: 바다 #1a7fc4·#2189cf·#3aa3de, 부두 나무 #d99c5f·돌 #a3aabd, 크레인 노랑 #ffcf33,
            강조 빨강 #e5483a·초록 #57c45c·보라 #b46ae0·주황 #ff8a3d, 배 남색 #2b4fb8, 먹 #1d2340,
            UI 블록 밝은 면 #eef3ff/#aab6d6 · 어두운 면(전광판) #26304f/#151a2c
 7. 질감·디테일: 판자 이음 줄, 돌 축대 2색 엇갈림. 큰 것(배·크레인·건물)·중간(상자·통·가로등)·작은 것(말뚝·밧줄·갈매기·물거품) 3단
 8. 깊이: 먼 섬·산(안개) → 앞바다에 줄 선 배들 → 방파제·등대 → 자라는 건물 → 부두·크레인·배 → 상자·수달 → 앞 예인선·부표 (7겹) + 위아래 초점 흐림
 9. 글꼴·UI 재질: 제목 Gugi, 본문·숫자 Do Hyeon / 블록 단추(윗면·옆면 두 색, 누르면 한 칸 내려감) + LED 점 전광판
10. 캐릭터: 수달 항구지기 '달강' — 블록 3등신, 화면 높이 약 2/5(왼쪽 앞), 숨쉬기·깜빡임·꼬리, 표정 5종(보통·집중·기쁨·걱정·놀람)

화면 틀 — 블록 항구 크레인
  타이틀: 항구 위를 천천히 도는 카메라 + 하늘에서 글자 블록이 하나씩 떨어져 쌓이며 로고가 됨
  이름: 글자 블록을 쌓아 만든 이름판에 직접 쓰기
  스테이지 선택: 카메라가 앞바다로 날아가 줄 선 배 6척을 보여 줌, 고른 배가 뱃고동을 울리고 부두로(배 = 부두 일감)
  문제 제시: 배 선교 위 LED 점 전광판(틀리면 같은 판이 힌트 모드로 바뀜, 누르면 크게 보기) + 배 옆구리 흘수 눈금·물탱크 눈금
  답 입력: 크레인으로 부두의 상자·물통을 집어 배에 내리기(흘수선·물높이 맞추기 / 알맞은 칸에 나눠 싣기)
  결과: 오늘 지은 건물이 선 항구 위로 배 6척이 줄지어 출항하는 퍼레이드 + 블록 점수판 + 화물 도감 30칸 → 블록 판 오답 노트

가장 비슷한 기존 게임: 수학 코스터 타이쿤(경영) — 짓는 대신 '싣는' 조작, 2D 아이소 대신 3D 복셀, 계산 심사 창 대신 흘수선이 곧 채점.
*/

'use strict';
const W = 1280, H = 720, TAU = Math.PI * 2;

const SAVE_KEY = 'hs7733_block_harbor_v1';
function loadSave() { try { return JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); } catch (e) { return null; } }
function writeSave(o) { try { localStorage.setItem(SAVE_KEY, JSON.stringify(o)); } catch (e) { /* 저장 못 해도 계속 */ } }
let PREF = (() => { try { return JSON.parse(localStorage.getItem(SAVE_KEY + '_pref') || '{}'); } catch (e) { return {}; } })();
function savePref() { try { localStorage.setItem(SAVE_KEY + '_pref', JSON.stringify(PREF)); } catch (e) { /* 무시 */ } }
/* 자동 점검(?test=1)은 소프트웨어 3D라 저사양 그리기로 연다(배치·글·문항은 같다). 학생·교사 화면에는 영향 없음 */
let LOW = QS.get('low') === '1' || QS.has('test') || (!QS.has('low') && !!PREF.low);

let SCALE = 1;

addEventListener('resize', fit); fit();
/* 세로 화면 안내('이대로 하기'를 누르면 그 뒤로는 띄우지 않음) · 길게 누르기 메뉴 막기 */

addEventListener('resize', checkRot); checkRot();
addEventListener('contextmenu', (e) => e.preventDefault());

let renderer = null, NOGL = QS.get('nogl') === '1';

{ const c = document.createElement('canvas'); c.width = 4; c.height = 256; const g = c.getContext('2d'); const gr = g.createLinearGradient(0, 0, 0, 256);

const VIEWS = {
  harbor: { lx: -3, ly: 3, lz: -5, az: -0.36, r: 94, el: 0.44 },
  title: { lx: -22, ly: 2, lz: -16, az: -0.18, r: 112, el: 0.4 },
  sea: { lx: 80, ly: 0, lz: -66, az: 0.0, r: 128, el: 0.58 },

  const cp = camera.position; const boxes = fbBoxes().map((b) => ({ b, d: (cp.x - (b[0] + b[3]) / 2) ** 2 + (cp.y - (b[1] + b[4]) / 2) ** 2 + (cp.z - (b[2] + b[5]) / 2) ** 2 })).sort((a, b) => b.d - a.d);
  const shade = (c, k) => '#' + new THREE.Color(c).multiplyScalar(k).getHexString();
  for (const { b } of boxes) { const [x0, y0, z0, x1, y1, z1, c] = b; const P = (x, y, z) => project(x, y, z);
    const face = (pts, col) => { const q = pts.map((p) => P(...p)); if (q.some((p) => p[2] > 1)) return; g.fillStyle = col; g.beginPath(); q.forEach((p, i) => (i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]))); g.closePath(); g.fill(); g.strokeStyle = 'rgba(29,35,64,.35)'; g.lineWidth = 1; g.stroke(); };
    const sx = cp.x < x0 ? x0 : x1;
    face([[sx, y0, z0], [sx, y0, z1], [sx, y1, z1], [sx, y1, z0]], shade(c, 0.72));
    face([[x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1]], shade(c, 0.88));
    face([[x0, y1, z0], [x1, y1, z0], [x1, y1, z1], [x0, y1, z1]], shade(c, 1.08)); }
  g.fillStyle = 'rgba(29,35,64,.75)'; g.fillRect(0, H - 34, 850, 34); g.font = '20px DoH, sans-serif'; g.fillStyle = '#fff'; g.fillText('이 컴퓨터는 3D를 쓸 수 없어 간단한 그림으로 보여 줘요. 게임 방법은 똑같아요.', 16, H - 12);
}

/* ══════════════ 루프 ══════════════ */
let last = 0, T = 0;
function tick(dt) { if (G.hitstop > 0) { G.hitstop -= dt; dt *= 0.1; } T += dt;
  placeCam(T, dt); if (PAUSED) return;
  stepTimers(dt); stepTweens(dt); updateCraneMeshes(); stepCrates(dt); stepLife(dt); stepTown(dt); stepOtter(dt); stepGrow(dt);
  G.ledFlash = Math.max(0, G.ledFlash - dt); G.hintT = (G.hintT || 0) + dt; G.winT = (G.winT || 0) + dt; G.hudDrop = Math.max(0, (G.hudDrop || 0) - dt * 3); G.streakBump = Math.max(0, (G.streakBump || 0) - dt * 5);
  if (G.task) { const v = G.task.type === 'load' ? curValue() : 0; if (v !== G.shown) { G.shown = v; G.valBump = 1; } G.valBump = Math.max(0, (G.valBump || 0) - dt * 6.7); }
  if (MODE === 'select' && G.justUnlocked != null) { const u = queue[G.justUnlocked].userData, before = G.unlockT || 0; G.unlockT = before + dt;
    u.lock.rotation.y += dt * 20; u.lock.position.y = 13 + Math.min(1, G.unlockT / 0.6) * 4;
    if (before < 0.6 && G.unlockT >= 0.6) { SFX.unlock(); SFX.hornShort(); u.horn = 1; const m = queue[G.justUnlocked]; burst(m.position.x - 4, 14, m.position.z, 14, 10); }
    if (G.unlockT > 1.2) { u.lock.position.y = 13; G.justUnlocked = null; } }
  if (MODE === 'result') G.resT = (G.resT || 0) + dt;
  if (MODE === 'title' || MODE === 'name') stepLogo(dt);
  if (MODE === 'berth' && G.state !== 'berthDone') G.time += dt;
  if (G.state === 'berthDone' && G.berthT > 0) G.berthT += dt;
  if (MODE === 'result') { queue.forEach((m) => { m.position.x += dt * 9; m.rotation.y = 0; if (m.position.x > 70) m.position.x -= 200; }); if (G.resFinal && Math.random() < dt * 0.8) { const p = PLOTS[Math.floor(Math.random() * 6)]; burst(p[0] + 2, 14, p[1] + 2, 10, 12); } }
}
function draw(dt) {
  if (NOGL) drawFallback();
  else if (rt) { renderer.setRenderTarget(rt); renderer.render(scene, camera); renderer.setRenderTarget(null); renderer.render(postScene, postCam); }
  else renderer.render(scene, camera);
  drawHUD(dt); }
let HOLD = QS.has('step');   /* 검사용: ?step 이면 자동 진행을 멈추고 GAME.advance(초)로만 시간을 보낸다 */
/* 자동 점검(?test=1)에서는 그림만 게임 시간 0.12초에 한 번 그린다: 시험 브라우저는 3D를 소프트웨어로 그려 창 여러 개가 서로 느려지기 때문
   (게임 시간은 그대로). 점검 창구가 장면을 바꿀 때는 곧바로 한 번 그린다(__test.goto) */
const TEST_DRAW = QS.has('test') ? 0.12 : 0; let drawAcc = 0;
function frame(now) { const dt = Math.min(0.05, (now - last) / 1000 || 0); last = now; if (!HOLD) { tick(dt); drawAcc += dt; if (drawAcc >= TEST_DRAW) { draw(drawAcc); drawAcc = 0; } } requestAnimationFrame(frame); }
(async function init() {
  try { await Promise.all([document.fonts.load('40px Gugi', '블록 항구 크레인'), document.fonts.load('30px DoH', '부두 상자')]); } catch (e) { /* 글꼴이 없어도 계속 */ }
  buildLand(); buildDock(); buildTug(); buildBreakwater(); buildCrane(); buildShip(); buildOtter(); buildLife(); if (renderer) buildPost();
  sun.castShadow = !LOW; ship.x = ship.tx = 130;
  restore(loadSave()); makeLogo(); setView('title', true); placeCam(0, 0);
  window.GAME = { G, crane, ship, TASKS, BERTHS, addLayer, skipNow, focusShip, act, pickSlot, chooseBerth, startTask, goSelect, goResult, goTitle, openNote, setLow, moveSel,
    get sel() { return sel; }, set sel(v) { sel = v; }, get MODE() { return MODE; }, get T() { return T; }, get BTNS() { return BTNS; }, project,
    perf(n) { let a = 0, h = 0; for (let i = 0; i < n; i++) { const t0 = performance.now(); tick(1 / 30); const t1 = performance.now(); drawHUD(1 / 30); a += t1 - t0; h += performance.now() - t1; } return `게임 계산 ${(a / n).toFixed(2)}ms, 2D UI ${(h / n).toFixed(2)}ms (프레임당)`; },
    async advance(sec) { const n = Math.round(sec * 30); for (let i = 0; i < n; i++) { tick(1 / 30); await new Promise((r) => setTimeout(r, 0)); } draw(1 / 30); return T; } };
  requestAnimationFrame(frame);
})();

/* 자동 점검 창구 (.claude/skills/game-verify) — 게임 진행에는 쓰지 않는다
   이 게임의 답은 '상자 누르기 → 배 누르기' 두 번 누르기라서 문항 종류를 crane-load·crane-pick·crane-sort로 둔다
   (한 번 누르기용 오답·정답 탭 시험 대신, 두 번 누르기 터치 시험은 제작 폴더의 따로 만든 스크립트로 한다) */
function testSolution(t) {
  if (t.type === 'pick') return t.crates.filter((c) => c.ok);
  if (t.type === 'sort') return t.crates.filter((c) => c.hold >= 0).sort((a, b) => a.hold - b.hold);
  const need = t.target - t.start, cs = t.crates;
  if (t.need === 1) return cs.filter((c) => c.w === need).slice(0, 1);
  for (let i = 0; i < cs.length; i++) for (let j = i + 1; j < cs.length; j++) if (cs[i].w + cs[j].w === need) return [cs[i], cs[j]];
  return [];
}
function testQuiet() { timers.length = 0; tweens.length = 0; skipFns = []; crane.busy = false; crane.held = null; crane.hookY = TRAVEL_Y + 2.6; }
function testSettle() {   /* 배가 부두에 닿고 상자가 바닥에 앉은 '답을 기다리는' 상태로 바로 */
  testQuiet(); ship.x = ship.tx = SHIP.x;
  for (const c of G.crates) { c.falling = false; c.fallV = 0; c.g.position.y = FLOOR; }
  G.state = 'play'; sel = 0; }
function testOpen(id) { PAUSED = false; closeNote(); nameEl.style.display = 'none'; MODE = 'berth'; G.berth = TASKS[id].berth; G.replay = false; setView('harbor', true); startTask(id); testSettle(); }
function testPut(cs, h) {   /* 상자를 배에 실은 것과 같은 상태(크레인 연출만 건너뜀) */
  const t = G.task;
  cs.forEach((c, k) => { c.where = 'ship'; c.holdAt = h != null ? h : 0; c.sx = t.type === 'sort' ? holdX(c.holdAt, t.holds.length) : shipSlotX(G.onShip.length, t.need); c.stack = 0; G.onShip.push(c); loadOn(c); }); }
function testBack() { for (const c of G.crates) if (c.where !== 'dock' && !c.locked) { if (c.where === 'ship') unload(c); c.where = 'dock'; c.slot = c.home; } G.onShip = G.onShip.filter((c) => c.locked); }
window.__test = { version: 1, stageSize: [W, H],
  ui: { stage: '#stage', start: { x: 1110, y: 652 }, rotate: '#rot', rotateOk: '#rotOk' },
  isReady() { return MODE === 'title' && BTNS.some((b) => b.id === 'new'); },
  quiet() { /* 자동 저사양 전환이 없어 끌 것이 없다 */ },
  items() { return TASKS.map((t) => ({ no: t.id + 1, group: BERTHS[t.berth].name, hint: t.hints.map((h) => h.replace(/\n/g, ' ')).join(' / '), exp: t.explain,
    steps: [{ kind: 'crane-' + t.type, ask: t.q, opts: t.crates.map((c) => c.label.replace(/\n/g, ' ')), ans: testSolution(t).map((c) => c.label.replace(/\n/g, ' ')),
      holds: t.holds || null, target: t.type === 'load' ? fmtU(t, t.target) : null, answer: t.answer }] })); },
  goto(no) { testOpen(no - 1); placeCam(T, 0); draw(0); },
  state() {
    const sc = { title: 'title', name: 'name', select: 'select', berthIntro: 'select', berth: 'play', result: 'result' }[MODE] || MODE;
    const ph = G.state === 'win' || G.state === 'berthDone' ? 'ok' : (G.state === 'wrong' || (G.tries > 0 && G.ledMode !== 'q')) ? 'hint' : 'ask';
    return { scene: sc, no: G.task ? G.task.id + 1 : 0, step: 0, phase: ph, tries: G.tries, cool: G.state === 'wrong' || crane.busy ? 1 : 0, paused: PAUSED, muted: MUTED }; },
  targets() {
    if (!G.task) return []; const sol = testSolution(G.task).map((c) => c.label);
    const out = G.crates.filter((c) => c.where === 'dock').map((c) => { const p = project(c.g.position.x, c.g.position.y, c.g.position.z); return { label: c.label.replace(/\n/g, ' '), correct: sol.includes(c.label), x: Math.round(p[0]), y: Math.round(p[1]) }; });
    const p = project(ship.x + 11, ship.g.position.y + 6.5, ship.g.position.z); out.push({ label: '배', confirm: true, x: Math.round(p[0]), y: Math.round(p[1]) });
    return out; },
  start(nick) { G.name = nick || '봇'; goSelect(); },
  botStep(mode) {
    if (MODE === 'result') return;
    if (G.task && (G.state === 'win' || G.state === 'berthDone')) { testQuiet(); const nx = TASKS.findIndex((t) => !G.done[t.id]); if (nx < 0) { goResult(true); testQuiet(); } else testOpen(nx); return; }
    if (MODE !== 'berth' || !G.task) { const nx = TASKS.findIndex((t) => !G.done[t.id]); if (nx < 0) { goResult(true); testQuiet(); } else testOpen(nx); return; }
    const t = G.task; testSettle(); testBack();
    const sol = testSolution(t), bad = t.crates.filter((c) => !sol.includes(c));

    const live = (c) => G.crates.find((o) => o.label === c.label);
    if (t.type === 'sort') {
      const left = sol.map(live).filter((c) => !c.locked);
      if (miss) { const c = left[0]; testPut([c], (c.hold + 1) % t.holds.length); judgeSort(c, (c.hold + 1) % t.holds.length); testQuiet(); testBack(); G.state = 'play'; return; }
      for (const c of left) { testPut([c], c.hold); judgeSort(c, c.hold); if (G.state === 'win') break; }
      return; }

    testPut(sol.map(live)); judge(); if (G.state === 'win' && TASKS.every((q) => G.done[q.id])) { testQuiet(); goResult(true); testQuiet(); placeCam(T, 0); draw(0); } },
  result() { return { score: totalDone(), firstTry: Object.values(G.done).filter((d) => d.first).length, wrongNote: G.wrongs.length, best: G.best, time: Math.round(G.time) }; },
